ckground:rgba(143,168,155,.1);border:1px solid rgba(143,168,155,.3);font-size:12px;text-align:center}.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.pill{background:#111a17;border:1px solid rgba(255,255,255,.12);color:#f2efe9;border-radius:999px;padding:11px 10px;text-align:left;font-size:12px;font-weight:700;cursor:pointer}.pill:hover{border-color:rgba(197,160,89,.65)}.hint{font-size:11px;color:#8fa89b;margin-top:9px}.premium{background:rgba(197,160,89,.08);border:1px solid rgba(197,160,89,.25);border-radius:16px;padding:16px}.premium-context{margin:0 0 14px;padding:11px 12px;border-left:3px solid #c5a059;background:rgba(197,160,89,.07);border-radius:10px}.premium-context b{display:block;font-size:12px;line-height:1.4}.premium-context span{display:block;margin-top:5px;color:#aab5af;font-size:11px;line-height:1.5}.premium-feature{margin-top:12px;padding:13px;border-radius:13px;background:#111a17;border:1px solid rgba(255,255,255,.1)}.premium-feature h3{margin:5px 0 6px;font-size:14px}.premium-feature p{margin:0 0 8px}.feature-kicker{color:#c5a059;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.examples{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.examples span{padding:8px;border-radius:9px;background:rgba(255,255,255,.04);font-size:10px;color:#d7d5cf}.step-line{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.step-line span{font-size:9px;color:#aab5af;text-align:center}.step-line b{display:block;margin:auto auto 4px;width:20px;height:20px;line-height:20px;border-radius:50%;background:rgba(197,160,89,.18);color:#c5a059}.premium-identity{margin-top:12px;padding:13px;border-radius:13px;border:1px solid rgba(143,168,155,.25);background:rgba(143,168,155,.06)}.premium-identity b{font-size:13px}.premium-identity p{margin:6px 0 0}.legal-note{font-size:10px!important;color:#8fa89b!important;margin-top:8px!important}.premium .secondary{margin-top:10px}.premium h2{margin:0 0 7px;font-size:19px}.premium p{color:#aab5af;font-size:12px;line-height:1.55}.bridge{margin-top:12px;padding:12px;border-left:3px solid #c5a059;background:rgba(197,160,89,.06);border-radius:10px}.steps{display:grid;gap:8px;margin-top:12px}.step{padding:11px 12px;border-radius:12px;background:#111a17;border:1px solid rgba(255,255,255,.1)}.step b{display:block;font-size:12px;margin-bottom:4px}.step span{color:#aab5af;font-size:11px;line-height:1.45}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,21,.98);border-top:1px solid rgba(255,255,255,.12);z-index:5}.tabs-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;border:0;color:#aab5af;padding:11px 4px;font-size:10px;font-weight:800}.tab.active{color:#f2efe9}.tab small{display:block;font-size:9px;font-weight:500;margin-top:3px;color:#6f7e76}footer{text-align:center;margin-top:25px;padding-top:12px}footer a{color:#aab5af;font-size:11px;text-decoration:none}@media(max-width:420px){h1{font-size:25px}.pills{grid-template-columns:1fr}.precomer-search{display:grid;grid-template-columns:1fr}.precomer-search button{width:100%}}

<body><div id="root"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function cerrarSesion(){try{localStorage.removeItem('reseteo_usuario');localStorage.removeItem('reseteo_terminos_v1')}catch(e){}window.location.href='/'}
function pase(){try{return JSON.parse(lsGet('reseteo_usuario')||'null')?.pase||''}catch(e){return ''}}
const INTENTOS={energia:['energia','cansancio','cansado','cansada','sin energia','agotado','agotada'],descanso_sueno:['sueno','dormir','descanso','descansar','insomnio'],digestion:['digestion','pesadez','hinchazon','hinchado','hinchada'],entrenamiento:['entrenamiento','entrenar','ejercicio','actividad fisica','actividad'],foco_concentracion:['foco','concentracion','concentración','atencion','atención'],hambre_saciedad:['hambre','saciedad','antojo','antojos'],recuperacion:['recuperacion','recuperación','recuperar','despues de entrenar','después de entrenar']};
const PILLS=[['⚡','Te quedás sin energía','cansancio','energia'],['🌙','Dormís mal','sueño','descanso_sueno'],['🌿','Pesadez después de comer','pesadez','digestion'],['🎯','Te cuesta el foco','foco','foco_concentracion'],['🍽️','Llegás con hambre','hambre','hambre_saciedad'],['🏋️','Antes de entrenar','entrenamiento','entrenamiento'],['🔄','Recuperación','recuperación','recuperacion']];
function escalaValor(valor){return ({baja:'1',media:'3',alta:'5',mal:'1',regular:'3',bien:'5'})[valor]||''}
function suenoValor(valor){const h=Number(valor);if(!h)return '';if(h<6)return 'menos_6h';if(h<7)return '6_7h';if(h<=9)return '7_9h';return 'mas_9h'}
function hidratacionValor(valor){const l=Number(valor);if(!l)return '';if(l<1)return 'menos_1l';if(l<2)return '1_2l';if(l<=3)return '2_3l';return 'mas_3l'}
function actividadValor(valor){const m=Number(valor);if(!m)return 'sedentario';if(m<60)return 'activo';return 'muy_activo'}
function intentDeTexto(t){const n=String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');for(const [intent,terms] of Object.entries(INTENTOS)){if(terms.some(x=>n.includes(String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,''))))return intent}return null}
function PillCard({data,kind,onPremium}){if(!data)return null;const free=Boolean(data.premium);return <div className="card"><div className="label">{free?'🔴 Lo que encontramos':'🔴 Estado actual'}</div><h3>{data.mecanismo||data.recomendacion||data.objetivo||'Una observación para esta situación'}</h3>{data.descripcion_mecanismo&&<p>{data.descripcion_mecanismo}</p>}{!free&&data.accion_texto&&<><div className="label">🟡 Hack · Qué podés probar</div><p className="action">{data.accion_texto}</p></>}{!free&&data.observacion_texto&&<><div className="label">🟢 Beneficio · Qué observar</div><p>{data.observacion_texto}</p></>}{!free&&data.continuidad_texto&&<><div className="label">Continuidad</div><p>{data.continuidad_texto}</p></>}{free&&onPremium&&<button className="primary" onClick={onPremium}>✦ Ver cómo probarlo en Premium →</button>}</div>}
function App(){
 const [tab,setTab]=useState('descubrir'),[premiumOrigen,setPremiumOrigen]=useState('basica'),[premiumContexto,setPremiumContexto]=useState(null),[premiumEstado,setPremiumEstado]=useState(null),[premiumEstadoMsg,setPremiumEstadoMsg]=useState(''),[premiumExperimentos,setPremiumExperimentos]=useState([]),[premiumExpMsg,setPremiumExpMsg]=useState(''),[premiumExpBusy,setPremiumExpBusy]=useState(false),[texto,setTexto]=useState(''),[textoAntesDeComer,setTextoAntesDeComer]=useState(''),[textoMiDia,setTextoMiDia]=useState(''),[momentoMiDia,setMomentoMiDia]=useState(''),[busy,setBusy]=useState(false),[msg,setMsg]=useState(''),[msgAntesDeComer,setMsgAntesDeComer]=useState(''),[msgMiDia,setMsgMiDia]=useState(''),[resultado,setResultado]=useState(null),[resultadoAntesDeComer,setResultadoAntesDeComer]=useState(null),[resultadoMiDia,setResultadoMiDia]=useState(null),[entradas,setEntradas]=useState([]),[energy,setEnergy]=useState(''),[dig,setDig]=useState(''),[sleep,setSleep]=useState(''),[water,setWater]=useState(''),[activity,setActivity]=useState('');
 useEffect(()=>{if(!pase()){window.location.replace('/index.html');return}fetch('/api/data').then(r=>r.ok?r.json():Promise.reject()).then(d=>setEntradas(d.entradas||[])).catch(()=>setEntradas([]))},[]);
 useEffect(()=>{if(tab!=='premium')return;setPremiumEstadoMsg('');fetch('/api/premium?ruta=estado',{headers:{Authorization:'Bearer '+pase()}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'No pudimos consultar tu estado Premium.');setPremiumEstado(d)}).catch(e=>{setPremiumEstado(null);setPremiumEstadoMsg(e.message||'No pudimos consultar tu estado Premium.')})},[tab]);
 useEffect(()=>{if(tab!=='premium'||!premiumEstado?.premium)return;fetch('/api/premium?ruta=experimento',{headers:{Authorization:'Bearer '+pase()}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'No pudimos cargar tus pruebas.');setPremiumExperimentos(d.experimentos||[])}).catch(e=>setPremiumExpMsg(e.message||'No pudimos cargar tus pruebas.') )},[tab,premiumEstado?.premium]);
 async function crearExperimento(){
  const titulo=(premiumContexto?.titulo||'Mi próxima prueba').trim();
  const variable=(premiumContexto?.variable||'preparación').trim();
  const opcionA=window.prompt('Primera forma de probarlo', 'Como lo hacés habitualmente');
  if(!opcionA)return;
  const opcionB=window.prompt('Segunda forma de probarlo', 'Una alternativa para comparar');
  if(!opcionB)return;
  setPremiumExpBusy(true);setPremiumExpMsg('');
  try{const r=await fetch('/api/premium?ruta=experimento',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+pase()},body:JSON.stringify({accion:'crear',origen:premiumOrigen,titulo,variable,opcionA,opcionB})});const d=await r.json();if(!r.ok)throw Error(d.error||'No pudimos crear la prueba.');setPremiumExperimentos([d.experimento,...premiumExperimentos]);}catch(e){setPremiumExpMsg(e.message||'No pudimos crear la prueba.')}finally{setPremiumExpBusy(false)}
 }
 async function registrarExperimento(id,lado){
  const valor=window.prompt(lado==='a'?'¿Cómo fue la primera experiencia?':'¿Cómo fue la segunda experiencia?','');
  if(!valor)return;
  setPremiumExpBusy(true);setPremiumExpMsg('');
  try{const body={accion:'registrar',experimentoId:id};body[lado==='a'?'registroA':'registroB']=valor;const r=await fetch('/api/premium?ruta=experimento',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+pase()},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'No pudimos guardar la experiencia.');setPremiumExperimentos(premiumExperimentos.map(x=>x.id===id?d.experimento:x));}catch(e){setPremiumExpMsg(e.message||'No pudimos guardar la experiencia.')}finally{setPremiumExpBusy(false)}
 }
 async function cerrarExperimento(id){
  setPremiumExpBusy(true);setPremiumExpMsg('');
  try{const r=await fetch('/api/premium?ruta=experimento',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+pase()},body:JSON.stringify({accion:'cerrar',experimentoId:id})});const d=await r.json();if(!r.ok)throw Error(d.error||'Completá las dos experiencias antes de comparar.');setPremiumExperimentos(premiumExperimentos.map(x=>x.id===id?d.experimento:x));}catch(e){setPremiumExpMsg(e.message||'No pudimos cerrar la prueba.')}finally{setPremiumExpBusy(false)}
 }
 function limpiar(){setTexto('');setResultado(null);setMsg('')}
 async function irPill(label,query,intent){setTexto(query);setMsg('');setResultado(null);setMsgAntesDeComer('');setResultadoAntesDeComer(null);setBusy(true);try{const r=await fetch('/api/pildora?intent='+encodeURIComponent(intent));const d=await r.json();if(!r.ok)throw Error(d.error||'No pudimos cargar esta situación.');setResultado({tipo:'pildora',...d});}catch(e){setMsg(e.message||'No pudimos cargar esta situación ahora.')}finally{setBusy(false)}}
 function irPremium(origen='basica',contexto=null){setPremiumOrigen(origen);setPremiumContexto(contexto);setTab('premium')}
 async function registrarComida(contexto='descubrir',soloVista=false){const t=(contexto==='mi-dia'?textoMiDia:soloVista?textoAntesDeComer:texto).trim();if(!t)return;setBusy(true);if(contexto==='mi-dia'){setMsgMiDia('');setResultadoMiDia(null)}else if(soloVista){setMsgAntesDeComer('');setResultadoAntesDeComer(null)}else{setMsg('');setResultado(null)}try{const r=await fetch('/api/registrar-comida',{method:'POST',headers:{'Content-Type':'application/json',...(pase()?{Authorization:'Bearer '+pase()}: {})},body:JSON.stringify({texto:t,soloVista,...(contexto==='mi-dia'&&momentoMiDia?{momento:momentoMiDia}:{})})});const b=await r.json();if(!r.ok)throw Error(b.error||'No pudimos analizar esta comida ahora.');const x=b.bloqueos?.[0]||b.resueltos?.[0]||b.sugerencias?.[0]||null;const sol=x?.solucion||null;if(soloVista){const antesResultado={tipo:'antes-comer',titulo:x?.combinacion||x?.nombre||'Qué observar en esta comida',texto:x?.resultado||x?.mensaje||'No encontramos una observación específica para esta combinación. Eso no significa que haya algo negativo: simplemente no tenemos un hallazgo concreto que señalar en esta consulta.',observacion:x?.observacion_usuario||sol?.observacion_usuario||null,premium:x?.invitacionPremium||b.invitacionPremium,variable:x?.variable_modificada||sol?.variable_modificada,categoria:x?.categoria||sol?.categoria};setResultadoAntesDeComer(antesResultado);}else{const comidaResultado={tipo:'comida',titulo:x?.combinacion||x?.nombre||'Esto encontramos en tu comida',texto:x?.resultado||x?.mensaje||x?.mecanismo||x?.adaptacion||sol?.adaptacion||'Ya tenemos esta comida para explorarla.',adaptacion:x?.adaptacion||sol?.adaptacion,accion:x?.accion_usuario||sol?.accion_usuario,observacion:x?.observacion_usuario||sol?.observacion_usuario,contexto:x?.contexto_activacion||sol?.contexto_activacion,continuidad:x?.continuidad_de_soluciones||x?.continuidad||sol?.continuidad_de_soluciones||sol?.continuidad,premium:x?.invitacionPremium||b.invitacionPremium,variable:x?.variable_modificada||sol?.variable_modificada,categoria:x?.categoria||sol?.categoria};if(contexto==='mi-dia')setResultadoMiDia(comidaResultado);else setResultado(comidaResultado);}}catch(e){if(contexto==='mi-dia')setMsgMiDia(e.message||'No pudimos analizar esta comida ahora.');else if(soloVista)setMsgAntesDeComer(e.message||'No pudimos revisar esta comida ahora.');else setMsg(e.message||'No pudimos analizar esta comida ahora.')}finally{setBusy(false)}}
 async function registrarBienestar(){const body={energia:escalaValor(energy)||undefined,digestion:escalaValor(dig)||undefined,sueno:suenoValor(sleep)||undefined,hidratacion:hidratacionValor(water)||undefined,actividad_fisica:actividadValor(activity)||undefined};if(!Object.values(body).some(v=>v!==undefined)){setMsg('Elegí al menos una señal para guardar.');return}if(!pase()){window.location.replace('/index.html');return}setBusy(true);setMsg('');try{const r=await fetch('/api/registrar-bienestar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+pase()},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo guardar');setMsg('✓ Listo. Guardamos lo que anotaste hoy.')}catch(e){setMsg(e.message||'No pudimos guardar esto ahora.')}finally{setBusy(false)}}
 function renderAntesDeComer(data=resultadoAntesDeComer){if(!data)return null;return <div className="result"><div className="card"><div className="label">Observación antes de comer</div><h3>{data.titulo}</h3><p>{data.texto}</p>{data.observacion&&<><div className="label">Qué observar en tu experiencia</div><p>{data.observacion}</p></>}{data.premium&&<><div className="bridge"><b>Si estas características te generan dudas, podés profundizar.</b><p style={{margin:'6px 0 0'}}>Premium te permite explorar distintas formas de preparar, combinar o modificar una comida y después observar qué cambia en tu propia experiencia.</p><button className="primary" onClick={()=>irPremium('antes-de-comer',data)}>✦ Conocer el Laboratorio de Profundidad →</button></div></>}</div></div>}function renderResultado(data=resultado){if(!data)return null;if(data.tipo==='pildora')return <div className="result"><div className="card"><div className="label">Para empezar</div><h3>{data.intro}</h3><p>Elegí una de estas dos pruebas y fijate qué experiencia te deja.</p></div><PillCard data={data.food} kind="food" onPremium={()=>irPremium('basica')}/><PillCard data={data.activity} kind="activity" onPremium={()=>irPremium('basica')}/><div className="bridge"><b>Hay más formas de seguir desde acá.</b><p style={{margin:'6px 0 0'}}>En Premium encontrás más opciones para probar esta situación desde distintos ángulos, sin tener que empezar de cero.</p><button className="primary" onClick={()=>irPremium('hallazgo',data)}>✦ Explorar más opciones →</button></div></div>;if(data.tipo==='vacio')return <div className="result"><div className="card"><div className="label">Todavía no</div><h3>{data.titulo}</h3><p>{data.texto}</p></div></div>;return <div className="result"><div className="card"><div className="label">Lo que encontramos</div><h3>{data.titulo}</h3><p>{data.texto}</p>{data.contexto&&<><div className="label">Por qué puede ser interesante</div><p>{data.contexto}</p></>}{data.adaptacion&&<><div className="label">Una idea para probar</div><p className="action">{data.adaptacion}</p></>}{data.accion&&<><div className="label">Podés probar</div><p className="action">{data.accion}</p></>}{data.observacion&&<><div className="label">Prestá atención a</div><p>{data.observacion}</p></>}{data.continuidad&&<><div className="label">Para seguir aprendiendo</div><p>{data.continuidad}</p></>}{data.variable&&<p style={{fontSize:11,color:'#8fa89b'}}>Aspecto a comparar: {data.variable}{data.categoria?' · '+data.categoria:''}</p>}{data.premium&&<button className="primary" onClick={()=>irPremium('hallazgo')}>✦ Quiero llevar esto un paso más allá →</button>}</div></div>}
 return <><main className="wrap"><div className="top"><div className="brand">RESETEO PROPIO</div><div className="status">Tu espacio personal</div></div>
 {tab==='descubrir'&&<><section className="hero"><div className="eyebrow">DESCUBRIR</div><h1>Entendé mejor lo que comés y cómo te sentís.</h1><p>Elegí una situación que quieras explorar o mirá una comida antes de comerla. Acá empieza la exploración.</p></section><section className="precomer" style={{marginTop:12}}><div className="eyebrow">ANTES DE COMER</div><h3>¿Estás por comer algo y querés saber qué observar?</h3><p>Escribí la comida que estás pensando comer. Te damos una observación simple, basada en lo que conocemos de esa combinación, para que sepas qué mirar en tu experiencia.</p><div className="search precomer-search"><input value={textoAntesDeComer} onChange={e=>{setTextoAntesDeComer(e.target.value);setMsgAntesDeComer('');setResultadoAntesDeComer(null);setResultado(null)}} placeholder="Ej: milanesa con papas fritas"/><button onClick={()=>{setResultado(null);registrarComida('descubrir',true)}} disabled={busy}>{busy?'...':'Ver qué observar'}</button></div>{msgAntesDeComer&&<div className="saved">{msgAntesDeComer}</div>}{renderAntesDeComer()}{resultadoAntesDeComer&&<button className="secondary" style={{marginTop:8}} onClick={()=>{setResultadoAntesDeComer(null);setMsgAntesDeComer('');setTextoAntesDeComer('')}}>Borrar devolución</button>}</section><section className="pillbox" style={{marginTop:12}}><h3 style={{margin:'0 0 5px',fontSize:14}}>Elegí algo para explorar</h3><p style={{margin:0,color:'#aab5af',fontSize:12}}>Entrá por una situación concreta y descubrí qué podés observar y probar.</p><div className="pills">{PILLS.map(([icon,label,q,intent])=><button key={label} className="pill" onClick={()=>{setResultadoAntesDeComer(null);setMsgAntesDeComer('');irPill(label,q,intent)}}>{icon} {label}</button>)}</div></section>{msg&&<div className="saved">{msg}</div>}{renderResultado()}{resultado&&<button className="secondary" style={{marginTop:8}} onClick={()=>{setResultado(null);setMsg('');setTexto('')}}>Borrar devolución</button>}</>}
 {tab==='mi-dia'&&<><section className="hero"><div className="eyebrow">MI DÍA</div><h1>Hacé visible lo que pasa en tu día.</h1><p>Anotá lo que comiste y cómo te sentiste. Con el tiempo, esas anotaciones te ayudan a comparar experiencias.</p></section><section className="event"><h3>¿Qué comiste?</h3><p>Escribilo como lo recordarías al contárselo a alguien.</p><select value={momentoMiDia} onChange={e=>{setMomentoMiDia(e.target.value);setMsgMiDia('');setResultadoMiDia(null)}}><option value="">Momento del día</option><option value="Desayuno">Desayuno</option><option value="Almuerzo">Almuerzo</option><option value="Merienda">Merienda</option><option value="Cena">Cena</option></select><textarea value={textoMiDia} onChange={e=>{setTextoMiDia(e.target.value);setMsgMiDia('');setResultadoMiDia(null)}} placeholder="Ej: arroz con pollo" style={{marginTop:8}}></textarea><button className="primary" onClick={()=>registrarComida('mi-dia')} disabled={busy}>{busy?'Procesando...':'Quiero entender esta comida'}</button>{msgMiDia&&<div className="saved">{msgMiDia}</div>}{renderResultado(resultadoMiDia)}</section><section className="event"><h3>¿Cómo te sentiste?</h3><p>Guardá una o varias señales de hoy para poder compararlas más adelante.</p><div className="row"><select value={energy} onChange={e=>setEnergy(e.target.value)}><option value="">Energía</option><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option></select><select value={dig} onChange={e=>setDig(e.target.value)}><option value="">Digestión</option><option value="mal">Mal</option><option value="regular">Regular</option><option value="bien">Bien</option></select></div><div className="row"><select value={sleep} onChange={e=>setSleep(e.target.value)}><option value="">Sueño</option><option value="4">4 h</option><option value="5">5 h</option><option value="6">6 h</option><option value="7">7 h</option><option value="8">8 h</option><option value="9">9 h</option><option value="10">10 h</option></select><select value={water} onChange={e=>setWater(e.target.value)}><option value="">Hidratación</option><option value="0.5">0,5 L</option><option value="1">1 L</option><option value="1.5">1,5 L</option><option value="2">2 L</option><option value="2.5">2,5 L</option><option value="3">3 L</option><option value="4">4 L</option></select></div><select value={activity} onChange={e=>setActivity(e.target.value)} style={{marginTop:8}}><option value="">Actividad física</option><option value="0">0 min</option><option value="20">20 min</option><option value="40">40 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">120 min</option></select><button className="primary" onClick={registrarBienestar} disabled={busy}>{busy?'Guardando...':'Guardar lo de hoy'}</button>{msg&&<div className="saved">{msg}</div>}</section></>}
 {tab==='premium'&&<section className="premium"><div className="eyebrow">PREMIUM</div><div className="premium-identity">
<b>{premiumEstado?.premium?'Tu acceso Premium está activo.':'Este es tu espacio Premium.'}</b>
<p>{premiumEstado?.premium?'Las herramientas de profundización están disponibles en este momento.':'Las herramientas de profundización se habilitan cuando tu cuenta tiene Premium activo.'}</p>
{premiumEstado?.modoPruebaFundador&&<p className="legal-note">Modo prueba fundador activo. Es una activación experimental y no representa una compra.</p>}
{!premiumEstado?.premium&&premiumEstado?.origen===null&&<button className="primary" onClick={async()=>{setPremiumEstadoMsg('');setBusy(true);try{const r=await fetch('/api/premium?ruta=activar-fundador',{method:'POST',headers:{Authorization:'Bearer '+pase()}});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo activar el modo prueba.');const s=await fetch('/api/premium?ruta=estado',{headers:{Authorization:'Bearer '+pase()}});const sd=await s.json();if(!s.ok)throw Error(sd.error||'No pudimos actualizar el estado Premium.');setPremiumEstado(sd);}catch(e){setPremiumEstadoMsg(e.message||'No pudimos activar el modo prueba.')}finally{setBusy(false)}}} disabled={busy}>✦ Activar modo prueba fundador</button>}
{premiumEstadoMsg&&<p className="legal-note">{premiumEstadoMsg}</p>}
</div>{premiumContexto&&<div className="premium-context"><b>Tu punto de partida</b><span>{premiumContexto.titulo||'La observación que acabás de encontrar'}</span>{premiumContexto.texto&&<span style={{marginTop:5}}>{premiumContexto.texto}</span>}{premiumContexto.accion&&<span style={{marginTop:5}}>Podés empezar probando: <b style={{display:'inline',fontSize:11,color:'#f2efe9'}}>{premiumContexto.accion}</b></span>}</div>}{premiumOrigen==='antes-de-comer'&&!premiumContexto&&<div className="premium-context"><b>Esto que acabás de descubrir puede llevarse un paso más allá.</b><span>Premium te permite convertir una observación sobre una comida en una prueba concreta que después podés comparar con otra ocasión.</span></div>}{premiumOrigen==='desbloqueo'&&<div className="premium-context"><b>Ya empezaste a construir tu historial personal.</b><span>Premium te permite profundizar sobre las métricas y patrones que van surgiendo de tus propios registros. Tus registros siguen siendo tuyos y podés borrarlos cuando quieras.</span></div>}<h2>Convertí esta observación en una prueba.</h2><p>Premium te da un lugar para elegir una alternativa, probarla y después comparar qué cambió en tu propia experiencia.</p><div className="premium-feature"><div className="feature-kicker">A · TU PRÓXIMO PASO</div><h3>Elegí una sola variable para probar.</h3><p>Partí de la observación que acabás de encontrar y cambiá una cosa por vez. Así la comparación es más fácil de entender.</p><button className="primary" onClick={crearExperimento} disabled={!premiumEstado?.premium||premiumExpBusy}>✦ Crear mi próxima prueba</button></div><div className="premium-feature"><div className="feature-kicker">B · EXPERIMENTACIÓN PERSONAL</div><h3>Probá, registrá y compará.</h3><p>Creá dos formas de hacer lo mismo. Después contá cómo fue cada experiencia y cerrá la prueba para dejarla en tu historial.</p>{premiumExpMsg&&<div className="saved">{premiumExpMsg}</div>}{premiumExperimentos.filter(x=>x.estado==='abierto').map(x=><div className="event" key={x.id}><h3>{x.titulo}</h3><p><b>Variable:</b> {x.variable}</p><p><b>A:</b> {x.opcion_a}</p><p><b>B:</b> {x.opcion_b}</p>{!x.registro_a&&<button className="secondary" onClick={()=>registrarExperimento(x.id,'a')} disabled={premiumExpBusy}>Registrar experiencia A</button>}{x.registro_a&&<p className="saved">✓ A registrada</p>}{!x.registro_b&&<button className="secondary" onClick={()=>registrarExperimento(x.id,'b')} disabled={premiumExpBusy}>Registrar experiencia B</button>}{x.registro_b&&<p className="saved">✓ B registrada</p>}<button className="primary" onClick={()=>cerrarExperimento(x.id)} disabled={premiumExpBusy||!x.registro_a||!x.registro_b}>Comparar y cerrar prueba</button></div>)}{premiumExperimentos.filter(x=>x.estado==='abierto').length===0&&<div className="steps"><div className="step"><b>1 · Crear</b><span>Elegí dos formas concretas de probar.</span></div><div className="step"><b>2 · Registrar</b><span>Contá brevemente cómo fue cada experiencia.</span></div><div className="step"><b>3 · Comparar</b><span>Cerrá la prueba cuando tengas las dos experiencias.</span></div></div>}</div><div className="premium-feature"><div className="feature-kicker">C · HISTORIAL Y PATRONES</div><h3>Tu historial ya empieza a guardar contexto.</h3><p>Las pruebas cerradas quedan asociadas a tu cuenta para que puedas volver sobre lo que comparaste. No convierten esos registros en un diagnóstico.</p><p className="legal-note">Los patrones orientan la observación personal: no son diagnósticos ni reemplazan la evaluación de un profesional de la salud.</p>{premiumExperimentos.filter(x=>x.estado==='cerrado').slice(0,3).map(x=><div className="step" key={x.id}><b>{x.titulo}</b><span>{x.opcion_a} · {x.registro_a||'sin registro'}<br/>{x.opcion_b} · {x.registro_b||'sin registro'}</span></div>)}</div><div className="premium-identity"><b>Reseteo Propio no es una dieta.</b><p>No es un contador de calorías, un recetario ni una app médica. No te dice qué tenés que comer: pone información, opciones y herramientas de exploración a tu alcance para que vos tomes tus propias decisiones.</p></div><div className="bridge"><b>Descubrir es el comienzo. Premium te permite profundizar.</b><p style={{margin:'6px 0 0'}}>Pasás de encontrar una observación a probar una alternativa, registrar la experiencia y compararla con otra ocasión.</p></div><button className="secondary" onClick={()=>setTab('descubrir')}>← Seguir explorando</button></section>}
 <footer><button className="secondary" onClick={cerrarSesion}>Cerrar sesión</button><div style={{marginTop:10}}><a href="/privacidad.html">Política de privacidad</a></div></footer></main><nav className="tabs"><div className="tabs-inner"><button className={'tab '+(tab==='descubrir'?'active':'')} onClick={()=>setTab('descubrir')}>DESCUBRIR<small>Explorar</small></button><button className={'tab '+(tab==='mi-dia'?'active':'')} onClick={()=>setTab('mi-dia')}>MI DÍA<small>Registrar</small></button><button className={'tab '+(tab==='premium'?'active':'')} onClick={()=>irPremium('basica')}>PREMIUM<small>Ir más allá</small></button></div></nav></>;
}
