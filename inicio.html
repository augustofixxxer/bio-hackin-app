<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reseteo Propio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1715;color:#f2efe9;font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:680px;margin:auto;padding:20px 14px 100px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font-weight:800}.status{color:#8fa89b;font-size:11px}.hero{margin-bottom:16px}.eyebrow{color:#c5a059;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}h1{font-size:28px;line-height:1.1;margin:7px 0}.hero p{color:#aab5af;font-size:13px;line-height:1.5}.search,.card,.event,.pillbox{background:#17211e;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#f2efe9}.search button,.primary{background:#c5a059;color:#2a1d08;border:0;border-radius:12px;padding:11px 14px;font-weight:800}.secondary{background:transparent;color:#f2efe9;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;width:100%;font-weight:700}.result{margin-top:12px}.card{margin-top:10px}.card h3,.event h3{margin:0 0 6px;font-size:14px}.card p,.event p{margin:0 0 9px;color:#aab5af;font-size:12px;line-height:1.55}.card .label{color:#c5a059;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:12px 0 5px}.card .action{color:#f2efe9}.event{margin-top:10px}.event textarea,.event select{width:100%;background:#111a17;color:#f2efe9;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px}.event textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.primary{width:100%;margin-top:8px}.saved{margin-top:10px;padding:10px;border-radius:11px;background:rgba(143,168,155,.1);border:1px solid rgba(143,168,155,.3);font-size:12px;text-align:center}.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.pill{background:#111a17;border:1px solid rgba(255,255,255,.12);color:#f2efe9;border-radius:999px;padding:11px 10px;text-align:left;font-size:12px;font-weight:700;cursor:pointer}.pill:hover{border-color:rgba(197,160,89,.65)}.hint{font-size:11px;color:#8fa89b;margin-top:9px}.premium{background:rgba(197,160,89,.08);border:1px solid rgba(197,160,89,.25);border-radius:16px;padding:16px}.premium h2{margin:0 0 7px;font-size:19px}.premium p{color:#aab5af;font-size:12px;line-height:1.55}.bridge{margin-top:12px;padding:12px;border-left:3px solid #c5a059;background:rgba(197,160,89,.06);border-radius:10px}.steps{display:grid;gap:8px;margin-top:12px}.step{padding:11px 12px;border-radius:12px;background:#111a17;border:1px solid rgba(255,255,255,.1)}.step b{display:block;font-size:12px;margin-bottom:4px}.step span{color:#aab5af;font-size:11px;line-height:1.45}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,21,.98);border-top:1px solid rgba(255,255,255,.12);z-index:5}.tabs-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;border:0;color:#aab5af;padding:11px 4px;font-size:10px;font-weight:800}.tab.active{color:#f2efe9}.tab small{display:block;font-size:9px;font-weight:500;margin-top:3px;color:#6f7e76}footer{text-align:center;margin-top:25px;padding-top:12px}footer a{color:#aab5af;font-size:11px;text-decoration:none}@media(max-width:420px){h1{font-size:25px}.pills{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function cerrarSesion(){try{localStorage.removeItem('reseteo_usuario');localStorage.removeItem('reseteo_terminos_v1')}catch(e){}window.location.href='/index.html'}
function pase(){try{return JSON.parse(lsGet('reseteo_usuario')||'null')?.pase||''}catch(e){return ''}}
function normalizar(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
const INTENTOS={
  energia:['energia','cansancio','cansado','cansada','sin energia','agotado','agotada'],
  descanso_sueno:['sueno','dormir','descanso','descansar','insomnio'],
  digestion:['digestion','pesadez','hinchazon','hinchado','hinchada'],
  entrenamiento:['entrenamiento','entrenar','ejercicio','actividad fisica','actividad'],
  foco_concentracion:['foco','concentracion','concentración','atencion','atención'],
  hambre_saciedad:['hambre','saciedad','antojo','antojos'],
  recuperacion:['recuperacion','recuperación','recuperar','despues de entrenar','después de entrenar']
};
const PILLS=[
  ['⚡','Te quedás sin energía','cansancio','energia'],
  ['🌙','Dormís mal','sueño','descanso_sueno'],
  ['🌿','Pesadez después de comer','pesadez','digestion'],
  ['🎯','Te cuesta el foco','foco','foco_concentracion'],
  ['🍽️','Llegás con hambre','hambre','hambre_saciedad'],
  ['🏋️','Antes de entrenar','entrenamiento','entrenamiento'],
  ['🔄','Recuperación','recuperación','recuperacion']
];
function escalaValor(valor){return ({baja:'1',media:'3',alta:'5',mal:'1',regular:'3',bien:'5'})[valor]||''}
function suenoValor(valor){const h=Number(valor);if(!h)return '';if(h<6)return 'menos_6h';if(h<7)return '6_7h';if(h<=9)return '7_9h';return 'mas_9h'}
function hidratacionValor(valor){const l=Number(valor);if(!l)return '';if(l<1)return 'menos_1l';if(l<2)return '1_2l';if(l<=3)return '2_3l';return 'mas_3l'}
function actividadValor(valor){const m=Number(valor);if(!m)return 'sedentario';if(m<60)return 'activo';return 'muy_activo'}
function intentDeTexto(t){const n=normalizar(t);for(const [intent,terms] of Object.entries(INTENTOS)){if(terms.some(x=>n.includes(normalizar(x))))return intent}return null}
function App(){
 const [tab,setTab]=useState('descubrir'),[texto,setTexto]=useState(''),[busy,setBusy]=useState(false),[msg,setMsg]=useState(''),[resultado,setResultado]=useState(null),[entradas,setEntradas]=useState([]),[energy,setEnergy]=useState(''),[dig,setDig]=useState(''),[sleep,setSleep]=useState(''),[water,setWater]=useState(''),[activity,setActivity]=useState('');
 useEffect(()=>{if(!pase()){window.location.replace('/index.html');return}fetch('/api/data').then(r=>r.ok?r.json():Promise.reject()).then(d=>setEntradas(d.entradas||[])).catch(()=>setEntradas([]))},[]);
 function limpiar(){setTexto('');setResultado(null);setMsg('')}
 function irPill(label,query,intent){setTexto(query);setMsg('');setResultado(null);setTimeout(()=>resolverConsulta(query,intent),0)}
 function resolverConsulta(q,intentForzado){const intent=intentForzado||intentDeTexto(q);if(!intent){return false}const candidatos=entradas.filter(e=>e.intencionPrincipal===intent).sort((a,b)=>(b.prioridadBusqueda||0)-(a.prioridadBusqueda||0)||(b.orden_prioridad||0)-(a.orden_prioridad||0)).slice(0,3);if(!candidatos.length){setResultado({tipo:'vacio',titulo:'Todavía no hay contenido curado para esta consulta.',texto:'No encontramos una devolución preparada para esta situación.'});return true}setResultado({tipo:'semantico',titulo:candidatos[0].combinacion||'Hallazgo',items:candidatos});return true}
 async function registrarComida(){const t=texto.trim();if(!t)return;const intent=intentDeTexto(t);if(intent){resolverConsulta(t,intent);return}setBusy(true);setMsg('');setResultado(null);try{const r=await fetch('/api/registrar-comida',{method:'POST',headers:{'Content-Type':'application/json',...(pase()?{Authorization:'Bearer '+pase()}: {})},body:JSON.stringify({texto:t,soloVista:false})});const b=await r.json();if(!r.ok)throw Error(b.error||'No pudimos registrar esta comida ahora.');const x=b.bloqueos?.[0]||b.resueltos?.[0]||b.sugerencias?.[0]||null;const sol=x?.solucion||null;setResultado({tipo:'comida',titulo:x?.combinacion||x?.nombre||'Registro recibido',texto:x?.resultado||x?.mensaje||x?.mecanismo||x?.adaptacion||sol?.adaptacion||'La comida fue registrada correctamente.',adaptacion:x?.adaptacion||sol?.adaptacion,accion:x?.accion_usuario||sol?.accion_usuario,observacion:x?.observacion_usuario||sol?.observacion_usuario,contexto:x?.contexto_activacion||sol?.contexto_activacion,continuidad:x?.continuidad_de_soluciones||x?.continuidad||sol?.continuidad_de_soluciones||sol?.continuidad,premium:x?.invitacionPremium||b.invitacionPremium,variable:x?.variable_modificada||sol?.variable_modificada,categoria:x?.categoria||sol?.categoria});}catch(e){setMsg(e.message||'No pudimos registrar esta comida ahora.')}finally{setBusy(false)}}
 async function registrarBienestar(){const body={energia:escalaValor(energy)||undefined,digestion:escalaValor(dig)||undefined,sueno:suenoValor(sleep)||undefined,hidratacion:hidratacionValor(water)||undefined,actividad_fisica:actividadValor(activity)||undefined};if(!Object.values(body).some(v=>v!==undefined)){setMsg('Elegí al menos una señal para guardar.');return}if(!pase()){window.location.replace('/index.html');return}setBusy(true);setMsg('');try{const r=await fetch('/api/registrar-bienestar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+pase()},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo guardar');setMsg('✓ Guardado. Tu registro de hoy quedó actualizado.')}catch(e){setMsg(e.message||'No pudimos guardar la observación ahora.')}finally{setBusy(false)}}
 function renderResultado(){if(!resultado)return null;if(resultado.tipo==='vacio')return <div className="result"><div className="card"><div className="label">Todavía no hay una devolución</div><h3>{resultado.titulo}</h3><p>{resultado.texto}</p></div></div>;if(resultado.tipo==='semantico')return <div className="result"><div className="card"><div className="label">Lo que aparece detrás de esto</div><h3>{resultado.titulo}</h3>{resultado.items.map((e,i)=><div key={e.id||i} className="card"><h3>{e.combinacion}</h3>{e.contexto_activacion&&<><div className="label">Por qué importa</div><p>{e.contexto_activacion}</p></>}{(e.mecanismo||e.resultado)&&<><div className="label">Qué está pasando</div><p>{e.mecanismo||e.resultado}</p></>}{(e.accion_usuario||e.accionTexto||e.resultado)&&<><div className="label">Qué podés probar</div><p className="action">{e.accion_usuario||e.accionTexto||e.resultado}</p></>}{(e.observacion_usuario||e.observacionTexto)&&<><div className="label">Qué observar</div><p>{e.observacion_usuario||e.observacionTexto}</p></>}{(e.continuidad_de_soluciones||e.continuidad||e.continuidadTexto)&&<><div className="label">Qué hacer después</div><p>{e.continuidad_de_soluciones||e.continuidad||e.continuidadTexto}</p></>}{e.evidencia&&<p style={{fontSize:10,color:'#8fa89b'}}>Base: {e.evidencia}</p>}</div>)}</div></div>;
 return <div className="result"><div className="card"><div className="label">Tu registro</div><h3>{resultado.titulo}</h3><p>{resultado.texto}</p>{resultado.contexto&&<><div className="label">Por qué puede importar</div><p>{resultado.contexto}</p></>}{resultado.adaptacion&&<><div className="label">Cómo aplicarlo</div><p className="action">{resultado.adaptacion}</p></>}{resultado.accion&&<><div className="label">Qué podés probar</div><p className="action">{resultado.accion}</p></>}{resultado.observacion&&<><div className="label">Qué observar</div><p>{resultado.observacion}</p></>}{resultado.continuidad&&<><div className="label">Qué hacer después</div><p>{resultado.continuidad}</p></>}{resultado.variable&&<p style={{fontSize:11,color:'#8fa89b'}}>{resultado.variable}{resultado.categoria?' · '+resultado.categoria:''}</p>}{resultado.premium&&<button className="primary" onClick={()=>setTab('premium')}>✦ Ver cómo llevarlo a la práctica →</button>}</div></div>}
 return <><main className="wrap"><div className="top"><div className="brand">RESETEO PROPIO</div><div className="status">Tu espacio personal</div></div>
 {tab==='descubrir'&&<><section className="hero"><div className="eyebrow">DESCUBRIR</div><h1>Entendé qué puede estar pasando.</h1><p>Elegí una situación o contanos qué comiste. Primero entendemos el patrón; después decidís qué querés probar.</p></section><div className="search"><input value={texto} onChange={e=>{setTexto(e.target.value);setMsg('');setResultado(null)}} placeholder="Ej: milanesa con papas fritas"/><button onClick={registrarComida} disabled={busy}>{busy?'...':'Analizar'}</button></div>{texto&&<button className="secondary" style={{marginTop:8}} onClick={limpiar}>Limpiar</button>}{msg&&<div className="saved">{msg}</div>}<section className="pillbox" style={{marginTop:12}}><h3 style={{margin:'0 0 5px',fontSize:14}}>¿Qué te pasa hoy?</h3><p style={{margin:0,color:'#aab5af',fontSize:12}}>Entrá por lo que sentís y llegá directo a una devolución.</p><div className="pills">{PILLS.map(([icon,label,q,intent])=><button key={label} className="pill" onClick={()=>irPill(label,q,intent)}>{icon} {label}</button>)}</div><div className="hint">También podés escribir una comida concreta arriba.</div></section>{renderResultado()}</>}
 {tab==='mi-dia'&&<><section className="hero"><div className="eyebrow">MI DÍA</div><h1>Registrá lo que pasó.</h1><p>Convertí lo que comiste y cómo te sentiste en información útil para tu próximo día.</p></section><section className="event"><h3>Una comida que querés entender</h3><p>Escribila tal como la recordás. La devolución aparece abajo.</p><textarea value={texto} onChange={e=>{setTexto(e.target.value);setMsg('');setResultado(null)}} placeholder="Ej: arroz con pollo"></textarea><button className="primary" onClick={registrarComida} disabled={busy}>{busy?'Procesando...':'Ver mi devolución'}</button>{renderResultado()}</section><section className="event"><h3>Cómo te sentís</h3><p>Guardá una o varias señales para construir tu registro del día.</p><div className="row"><select value={energy} onChange={e=>setEnergy(e.target.value)}><option value="">Energía</option><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option></select><select value={dig} onChange={e=>setDig(e.target.value)}><option value="">Digestión</option><option value="mal">Mal</option><option value="regular">Regular</option><option value="bien">Bien</option></select></div><div className="row"><select value={sleep} onChange={e=>setSleep(e.target.value)}><option value="">Sueño</option><option value="4">4 h</option><option value="5">5 h</option><option value="6">6 h</option><option value="7">7 h</option><option value="8">8 h</option><option value="9">9 h</option><option value="10">10 h</option></select><select value={water} onChange={e=>setWater(e.target.value)}><option value="">Hidratación</option><option value="0.5">0,5 L</option><option value="1">1 L</option><option value="1.5">1,5 L</option><option value="2">2 L</option><option value="2.5">2,5 L</option><option value="3">3 L</option><option value="4">4 L</option></select></div><select value={activity} onChange={e=>setActivity(e.target.value)} style={{marginTop:8}}><option value="">Actividad física</option><option value="0">0 min</option><option value="20">20 min</option><option value="40">40 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">120 min</option></select><button className="primary" onClick={registrarBienestar} disabled={busy}>{busy?'Guardando...':'Guardar mi registro'}</button>{msg&&<div className="saved">{msg}</div>}</section></>}
 {tab==='premium'&&<section className="premium"><div className="eyebrow">PREMIUM</div><h2>Pasá de entender a experimentar.</h2><p>Tu registro te ayuda a detectar un patrón. Premium agrega el siguiente paso: una forma concreta de probar un cambio, observar la respuesta y aprender de lo que pasa con vos.</p><div className="steps"><div className="step"><b>1 · Elegí qué mover</b><span>Una variable concreta, relacionada con lo que acabás de descubrir.</span></div><div className="step"><b>2 · Probalo en contexto</b><span>Una acción simple para incorporarla a tu día sin convertirlo en una lista interminable.</span></div><div className="step"><b>3 · Observá la respuesta</b><span>Registrá qué cambia y usá esa experiencia para decidir el próximo ajuste.</span></div></div><div className="bridge"><b>Tu valor no está en acumular datos.</b><p style={{margin:'6px 0 0'}}>Está en poder convertir lo que descubrís sobre vos en una experiencia concreta que puedas repetir, comparar y ajustar.</p></div><button className="primary" onClick={()=>setTab('descubrir')}>← Volver a explorar</button></section>}
 <footer><button className="secondary" onClick={cerrarSesion}>Cerrar sesión</button><div style={{marginTop:10}}><a href="/privacidad.html">Política de privacidad</a></div></footer></main><nav className="tabs"><div className="tabs-inner"><button className={'tab '+(tab==='descubrir'?'active':'')} onClick={()=>setTab('descubrir')}>DESCUBRIR<small>Explorar</small></button><button className={'tab '+(tab==='mi-dia'?'active':'')} onClick={()=>setTab('mi-dia')}>MI DÍA<small>Registrar</small></button><button className={'tab '+(tab==='premium'?'active':'')} onClick={()=>setTab('premium')}>PREMIUM<small>Experimentar</small></button></div></nav></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
