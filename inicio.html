<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reseteo Propio — Tu punto de partida</title>
<style>
  * { box-sizing: border-box; }
  :root { --bg:#0f1715; --surface:#17211e; --surface-2:#1d2925; --text:#f2efe9; --muted:#aab5af; --accent:#c5a059; --mint:#8fa89b; --border:rgba(255,255,255,.12); }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
  button,input,textarea,select { font:inherit; } button { -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 15px 92px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; order:0; } .brand{font-weight:800;letter-spacing:.02em}.status{font-size:11px;color:var(--mint)}
  .hero{margin-bottom:16px;order:1}.eyebrow{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:7px}h1{font-size:29px;line-height:1.08;margin:0 0 8px}.hero p{color:var(--muted);line-height:1.45;margin:0;font-size:13px;max-width:560px}
  .search{display:flex;gap:8px;background:var(--surface);border:1px solid rgba(197,160,89,.48);border-radius:17px;padding:11px 12px;box-shadow:0 12px 28px rgba(0,0,0,.22);order:2;min-height:58px}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:15px}.search input::placeholder{color:#7f8b85}.search button{border:0;border-radius:12px;background:var(--accent);color:#2a1d08;padding:9px 13px;font-weight:800;cursor:pointer;white-space:nowrap}
  .section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:18px 0 7px;order:6}.hooks{display:grid;gap:7px;order:7}.hook{width:100%;text-align:left;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.07);color:var(--text);border-radius:13px;padding:10px 12px;cursor:pointer}.hook strong{display:block;font-size:12.5px;margin-bottom:2px}.hook span{color:var(--muted);font-size:10.5px;line-height:1.35}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:700;cursor:pointer}.before{margin-top:18px;background:rgba(197,160,89,.035);border:1px solid rgba(197,160,89,.20);border-radius:18px;padding:14px;order:9}.before h2{font-size:15px;margin:0 0 4px}.before p{margin:0 0 10px;color:var(--muted);font-size:11.5px;line-height:1.4}textarea{width:100%;min-height:72px;resize:vertical;background:rgba(0,0,0,.14);border:1px solid var(--border);border-radius:13px;color:var(--text);padding:10px;outline:0}.primary{width:100%;margin-top:8px;border:0;border-radius:13px;padding:11px;background:var(--accent);color:#2a1d08;font-weight:800;cursor:pointer}.secondary{width:100%;border:1px solid var(--border);border-radius:13px;padding:10px;background:transparent;color:var(--text);font-weight:700;cursor:pointer}
  .result{margin-top:12px;display:grid;gap:8px;order:3}.card{background:var(--surface-2);border:1px solid var(--border);border-radius:15px;padding:12px}.result .card:first-child{border-color:rgba(197,160,89,.30);box-shadow:0 8px 20px rgba(0,0,0,.14)}.card h3{margin:0 0 6px;font-size:13px}.card p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.48}.why{color:var(--accent)!important;font-weight:700;margin-top:7px!important}.result .card:first-child p:nth-of-type(3){margin-top:10px!important;padding:10px 11px;background:rgba(197,160,89,.08);border-left:3px solid var(--accent);border-radius:10px;color:var(--text)!important;font-size:12.5px!important}.result .card:first-child p:nth-of-type(4){padding:7px 10px;background:rgba(255,255,255,.025);border-radius:9px;font-size:12px!important}.result .card:first-child p:nth-of-type(5){color:var(--mint)!important;font-weight:700}.result .card:first-child p:nth-of-type(3){margin-top:10px!important;padding:10px 11px;background:rgba(197,160,89,.08);border-left:3px solid var(--accent);border-radius:10px;color:var(--text)!important;font-size:12.5px!important}.result .card:first-child p:nth-of-type(4){padding:7px 10px;background:rgba(255,255,255,.025);border-radius:9px;font-size:12px!important}.result .card:first-child p:nth-of-type(5){color:var(--mint)!important;font-weight:700}.empty{color:var(--muted);font-size:11.5px;line-height:1.45;padding:8px 2px}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,21,.97);border-top:1px solid var(--border);backdrop-filter:blur(12px);display:flex;justify-content:center;z-index:10}.tabs-inner{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;border:0;color:var(--muted);padding:10px 4px 11px;cursor:pointer;font-size:10px;font-weight:800}.tab.active{color:var(--text)}.tab small{display:block;font-size:8px;font-weight:500;margin-top:2px;color:var(--muted)}.notice{margin-top:10px;font-size:10.5px;color:var(--muted);line-height:1.4}.loading{color:var(--muted);font-size:12px;margin-top:10px}.event-grid{display:grid;gap:10px}.event{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px}.event h3{margin:0 0 4px;font-size:15px}.event p{color:var(--muted);font-size:12px;line-height:1.45;margin:0 0 11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}select{width:100%;background:#111a17;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px}.saved{display:block;margin-top:11px;padding:12px 13px;border:1px solid rgba(143,168,155,.32);border-radius:13px;background:rgba(143,168,155,.10);color:var(--text);font-size:12.5px;font-weight:800;line-height:1.35;text-align:center}.premium-context{margin-top:12px;background:rgba(197,160,89,.08);border:1px solid rgba(197,160,89,.24);border-radius:15px;padding:13px}.premium-context h3{margin:0 0 6px;font-size:14px}.premium-context p{margin:0 0 7px;color:var(--muted);font-size:11.5px;line-height:1.45}.premium{background:linear-gradient(180deg,rgba(143,168,155,.12),rgba(197,160,89,.06));border:1px solid rgba(143,168,155,.22);border-radius:19px;padding:15px}.premium h2{margin:0 0 7px;font-size:17px}.premium p{margin:0 0 10px;color:var(--muted);font-size:11.5px;line-height:1.45}.pill{display:inline-block;border:1px solid rgba(197,160,89,.26);color:var(--accent);border-radius:999px;padding:4px 8px;font-size:9px;margin:2px 2px 0 0}footer{margin-top:22px!important;padding-top:12px!important;order:20}@media (max-width:420px){h1{font-size:26px}.wrap{padding-left:13px;padding-right:13px}.hero p{font-size:12.5px}.search{min-height:56px}.search input{font-size:14px}.search button{padding-left:12px;padding-right:12px}}
</style>
</head>
<body><div id="root"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}} function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}} function lsRemove(k){try{localStorage.removeItem(k)}catch(e){}}
const HOOKS=[{text:"¿Te quedás sin energía durante el día?",terms:["energia","cansancio","agotamiento","fatiga","sin energia"]},{text:"¿Comés y después te sentís pesado o con sueño?",terms:["pesadez","sueño","somnolencia","digestión","pesado"]},{text:"¿Tenés hambre poco después de comer?",terms:["hambre","saciedad","antojo","picar","comer"]},{text:"¿Dormís, pero no sentís que descansás?",terms:["sueño","dormir","descanso","descansar"]},{text:"¿Te cuesta mantener el foco?",terms:["foco","concentracion","concentración","atencion","atención"]},{text:"¿Querés mejorar una comida sin dejar de comerla?",terms:["preparacion","coccion","cantidad","sustitucion","comida"]}];
const SITUACIONES_ANTES=[{label:"🍽️ Voy a comer algo",placeholder:"Ej: milanesa con papas fritas"},{label:"🥤 Voy a tomar algo",placeholder:"Ej: gaseosa, fernet con cola, mate cocido"}];
function normalize(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
const INTENT_ALIASES={energia:["energia","cansancio","fatiga","agotamiento","sin energia","sin energía","bajon","bajón"],descanso_sueno:["sueño","sueno","dormir","descanso","descansar","no descanso","duermo y no descanso"],hambre_saciedad:["hambre","quedar con hambre","me quedo con hambre","saciedad","antojo","picar"],digestion:["digestión","digestion","pesadez","pesado","hinchado","hinchazón","hinchazon","inflamación","inflamacion"],entrenamiento:["entrenar","entrenamiento","ejercicio","actividad física","actividad fisica"],recuperacion:["recuperación","recuperacion","recuperar","después de entrenar","despues de entrenar"],foco_concentracion:["foco","concentración","concentracion","atención","atencion"]};
function resolveIntent(q){const n=normalize(q);for(const [intent,aliases] of Object.entries(INTENT_ALIASES)){if(aliases.some(a=>n===normalize(a)||n.includes(normalize(a))))return intent}return null}
function scoreEntry(e,q){const n=normalize(q);if(!n)return 0;const fields=[e.combinacion,e.resultado,e.mecanismo,e.intencionPrincipal,e.familia,...(e.intencionesSecundarias||[])].map(normalize);let s=0;if(fields[0]&&fields[0].includes(n))s+=80;if(fields[1]&&fields[1].includes(n))s+=55;if(fields[2]&&fields[2].includes(n))s+=40;if(fields[3]&&fields[3].includes(n))s+=45;if(fields[4]&&fields[4].includes(n))s+=35;fields.slice(5).forEach(f=>{if(f&&f.includes(n))s+=25});n.split(/\s+/).filter(Boolean).forEach(word=>fields.forEach(f=>{if(f.includes(word))s+=4}));return s}
function explain(e,q,intent){if(intent&&normalize(e.intencionPrincipal)===normalize(intent))return `Aparece porque "${q}" corresponde directamente con esta situación.`;if(e.intencionPrincipal&&normalize(e.intencionPrincipal).includes(normalize(q)))return `Aparece porque preguntaste por "${q}" y esta ficha está vinculada directamente con esa intención.`;if(e.familia&&normalize(e.familia).includes(normalize(q)))return `Aparece porque preguntaste por "${q}" y esta ficha pertenece a una familia relacionada.`;return `Aparece porque preguntaste por "${q}" y el contenido de esta ficha tiene relación con eso.`}
function App(){
const [usuario,setUsuario]=useState(null),[data,setData]=useState(null),[tab,setTab]=useState("descubrir"),[q,setQ]=useState(""),[before,setBefore]=useState(""),[beforePlaceholder,setBeforePlaceholder]=useState("Ej: milanesa con papas fritas"),[beforeResult,setBeforeResult]=useState(null),[busy,setBusy]=useState(false),[msg,setMsg]=useState(""),[energy,setEnergy]=useState(""),[dig,setDig]=useState(""),[sleep,setSleep]=useState(""),[water,setWater]=useState(""),[activity,setActivity]=useState(""),[comidaTexto,setComidaTexto]=useState(""),[comidaBusy,setComidaBusy]=useState(false),[comidaMsg,setComidaMsg]=useState(""),[comidaResult,setComidaResult]=useState(null),[ultimoHallazgo,setUltimoHallazgo]=useState(null);
useEffect(()=>{let u=null;try{u=JSON.parse(lsGet("reseteo_usuario")||"null")}catch(e){}if(!u){window.location.href="/index.html";return}if(lsGet("reseteo_terminos_v1")!=="true"||lsGet("reseteo_onboarding_v1")!=="true"){window.location.href="/index.html";return}setUsuario(u);fetch("/api/data").then(r=>r.json()).then(d=>setData(d)).catch(()=>setData({entradas:[]}))},[]);
useEffect(()=>{function onPop(e){setTab((e.state&&e.state.tab)||"descubrir")}history.replaceState({tab:"descubrir"},"");window.addEventListener("popstate",onPop);return()=>window.removeEventListener("popstate",onPop)},[]);
function irA(t){setTab(t);history.pushState({tab:t},"")} function irAPremiumConContexto(combinacion,invitacion,experimento){setUltimoHallazgo({combinacion,invitacion,experimento});irA('premium')} function cerrarSesion(){lsRemove("reseteo_usuario");lsRemove("reseteo_terminos_v1");window.location.href="/index.html"}
const hooksOrdenados=useMemo(()=>{const obj=normalize(lsGet("reseteo_objetivo_grupo")||"");if(!obj)return HOOKS;const coincide=h=>h.terms.some(t=>obj.includes(normalize(t))||normalize(t).includes(obj));const relevantes=HOOKS.filter(coincide),resto=HOOKS.filter(h=>!coincide(h));return relevantes.length?[...relevantes,...resto]:HOOKS},[]);
const results=useMemo(()=>{if(!data)return [];const all=data.entradas||[],n=normalize(q);if(!n)return [];const intent=resolveIntent(q);if(intent){return all.filter(e=>normalize(e.intencionPrincipal)===normalize(intent)).sort((a,b)=>{const pa=Number(a.prioridadBusqueda||a.orden_prioridad||0),pb=Number(b.prioridadBusqueda||b.orden_prioridad||0);return pb-pa}).slice(0,3).map(e=>({e,s:100}));}const ranked=all.map(e=>({e,s:scoreEntry(e,q)})).filter(x=>x.s>0).sort((a,b)=>{const pa=Number(a.e.prioridadBusqueda||a.e.orden_prioridad||0),pb=Number(b.e.prioridadBusqueda||b.e.orden_prioridad||0);return b.s-a.s||pb-pa});return ranked.slice(0,3)},[data,q]);
const CONSULTAS_ANTES_NO_COMIDA=["sueno","sueño","dormir","descanso","descansar","hidratacion","hidratación","agua","energia","energía","cansancio","agotamiento","fatiga","foco","concentracion","concentración","atencion","atención","entrenar","entrenamiento","ejercicio","actividad fisica","actividad física","recuperacion","recuperación","hambre","quedar con hambre","saciedad","antojo","picar"];
function esConsultaNoComidaAntes(texto){const n=normalize(texto);return CONSULTAS_ANTES_NO_COMIDA.some(t=>n===normalize(t)||n.includes(normalize(t)))}
async function analizarAntes(){const texto=before.trim();if(!texto)return;if(esConsultaNoComidaAntes(texto)){setBeforeResult(null);setMsg("Esta consulta pertenece al Explorador, no a Antes de comer. Probá buscarla arriba para encontrar la situación correspondiente.");return}setBusy(true);setMsg("");setBeforeResult(null);try{const r=await fetch("/api/registrar-comida",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto,soloVista:true})});const b=await r.json();setBeforeResult(b)}catch(e){setMsg("No pudimos analizar esta consulta ahora.")}finally{setBusy(false)}}
function seleccionarHook(h){setQ(h.terms[0]);setMsg("");setBefore("");setBeforeResult(null);window.scrollTo({top:0,behavior:"smooth"})}
function seleccionarSituacion(s){setBefore("");setBeforeResult(null);setMsg("");setBeforePlaceholder(s.placeholder)}
async function registrarComida(){const texto=comidaTexto.trim();if(!texto)return;setComidaBusy(true);setComidaMsg("");setComidaResult(null);try{const r=await fetch("/api/registrar-comida",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto,soloVista:false})});const b=await r.json();setComidaResult(b)}catch(e){setComidaMsg("No pudimos registrar esta comida ahora.")}finally{setComidaBusy(false)}}
function registrarBienestar(){setComidaMsg("✓ Observación guardada. Mi Día ya está actualizado.")}
return <div className="wrap"><div className="top"><div className="brand">Reseteo Propio</div><div className="status">{usuario?.premium?"Premium activo":"Explorador"}</div></div><div className="hero"><div className="eyebrow">EXPLORADOR</div><h1>Entendé qué te pasa.</h1><p>Buscá lo que te pasa o lo que estás por comer. Te mostramos qué podés observar.</p></div><div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ej: cansancio, hambre, digestión..." /><button onClick={()=>{const el=document.querySelector('.result');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}}>Buscar</button></div>{msg&&<div className="notice">{msg}</div>}{q.trim()&&<div className="result">{results.length?results.map(({e,s},i)=><div className="card" key={e.id||i}><h3>{e.titulo||e.mecanismo||e.combinacion}</h3><p>{e.descripcion||e.descripcion_mecanismo||e.recomendacion||e.resultado||""}</p><p className="why">{explain(e,q,resolveIntent(q))}</p>{e.accionTexto&&<p><strong>Probá:</strong> {e.accionTexto}</p>}{e.observacionTexto&&<p><strong>Observá:</strong> {e.observacionTexto}</p>}{e.continuidadTexto&&<p>{e.continuidadTexto}</p>}{e.accionTexto&&<button className="secondary" onClick={()=>irAPremiumConContexto(e.mecanismo||e.titulo||e.combinacion,"Esto se puede experimentar de distintas maneras. ¿Querés probar el cómo? Premium te guía con una opción concreta para esta situación.",{accionUsuario:e.accionTexto,observacionUsuario:e.observacionTexto,continuidad:e.continuidadTexto})}>✦ Experimentar el cómo, en Premium →</button>}</div>):<div className="empty">No encontramos una situación suficientemente clara para esa búsqueda.</div>}</div>} {!q.trim()&&<><div className="section-title">Probá explorar por situación</div><div className="hooks">{hooksOrdenados.map((h,i)=><button className="hook" key={i} onClick={()=>seleccionarHook(h)}><strong>{h.text}</strong><span>Tocá para explorar esta situación.</span></button>)}</div></>}<div className="before"><h2>🍽️ Antes de comer o tomar algo</h2><p>Consultá una comida o bebida concreta antes de decidir. No hace falta registrarla: primero vemos qué podés experimentar.</p><div className="chips">{SITUACIONES_ANTES.map((s,i)=><button className="chip" key={i} onClick={()=>seleccionarSituacion(s)}>{s.label}</button>)}</div><textarea value={before} onChange={e=>setBefore(e.target.value)} placeholder={beforePlaceholder}></textarea><button className="primary" onClick={analizarAntes} disabled={busy}>{busy?"Analizando...":"Analizar antes de comer"}</button>{beforeResult&&<div className="result">{beforeResult.combinacion&&<div className="card"><h3>{beforeResult.combinacion}</h3><p>{beforeResult.adaptacion||beforeResult.resultado||""}</p>{beforeResult.invitacionPremium&&<button className="secondary" onClick={()=>irAPremiumConContexto(beforeResult.combinacion,beforeResult.invitacionPremium,beforeResult.solucion||null)}>✦ Experimentar el cómo, en Premium →</button>}</div>}</div>}</div><div className="tabs"><div className="tabs-inner"><button className="tab active" onClick={()=>irA("descubrir")}>Descubrir<small>Explorar</small></button><button className="tab" onClick={()=>irA("mi-dia")}>Mi Día<small>Registrar</small></button><button className="tab" onClick={()=>irA("premium")}>Premium<small>Experimentar</small></button></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
