name: Apply Intent Engine precedence

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/registrar-comida.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('    // Orden por especificidad (31/07/2026)')
          end = s.index('    const coincidenciasOrdenadas = ordenarPorPrecedencia(coincidencias);', start)
          new = '''    // INTENT ENGINE — PRECEDENCIA REAL (14/09/2026)
    // La identidad del plato se resuelve antes que los patrones transversales.
    // familia_key + prioridad_motor pasan a ser criterios reales del motor.
    const especificidad = (r) => ((r.palabras_clave || "").includes(";") ? 1 : 0);
    const prioridadMotor = (r) => Number.isFinite(Number(r.prioridad_motor)) ? Number(r.prioridad_motor) : 0;
    const tieneFamilia = (r) => Boolean((r.familia_key || "").trim());
    const longitudClave = (r) => {
      const claves = (r.palabras_clave || "").replace(/^tip:/i, "").trim().split(/[;,]/).map((k) => normalizar(k.trim())).filter(Boolean);
      let mejor = 0;
      for (const clave of claves) if (contienePalabraCompleta(textoParaMatching, clave)) mejor = Math.max(mejor, clave.length);
      return mejor;
    };
    const riesgoRank = (r) => (r.nivel_riesgo === "Alto" ? 0 : r.nivel_riesgo === "Medio" ? 1 : 2);
    function posicionMatch(r) {
      const claves = (r.palabras_clave || "").replace(/^tip:/i, "").trim().split(/[;,]/).map((k) => normalizar(k.trim())).filter(Boolean);
      let mejor = Infinity;
      for (const clave of claves) {
        const m = new RegExp(`\\\\b${escapeRegex(clave)}\\\\b`).exec(textoParaMatching);
        if (m && m.index < mejor) mejor = m.index;
      }
      return mejor;
    }
    function ordenarPorPrecedencia(lista) {
      return [...lista].sort((a, b) => {
        const familiaDiff = Number(tieneFamilia(b)) - Number(tieneFamilia(a));
        if (familiaDiff !== 0) return familiaDiff;
        const prioridadDiff = prioridadMotor(b) - prioridadMotor(a);
        if (prioridadDiff !== 0) return prioridadDiff;
        const claveDiff = longitudClave(b) - longitudClave(a);
        if (claveDiff !== 0) return claveDiff;
        const espDiff = especificidad(a) - especificidad(b);
        if (espDiff !== 0) return espDiff;
        const riesgoDiff = riesgoRank(a) - riesgoRank(b);
        if (riesgoDiff !== 0) return riesgoDiff;
        return posicionMatch(a) - posicionMatch(b);
      });
    }
'''
          s = s[:start] + new + s[end:]
          old = 'reglas?select=id,combinacion,resultado,palabras_clave,nivel_riesgo,nivel_acceso,momento_requerido,palabras_excluyentes,soluciones('
          new_select = 'reglas?select=id,combinacion,resultado,palabras_clave,nivel_riesgo,nivel_acceso,momento_requerido,palabras_excluyentes,familia_key,prioridad_motor,soluciones('
          if old not in s: raise SystemExit('SELECT esperado no encontrado')
          s = s.replace(old, new_select, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/registrar-comida.js
          git commit -m 'Apply Intent Engine precedence'
          git push
      - name: Remove migration workflow
        if: success()
        run: |
          git rm .github/workflows/apply-intent-precedence.yml
          git commit -m 'Remove one-shot Intent Engine migration workflow'
          git push
