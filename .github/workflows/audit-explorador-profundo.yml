name: Deep Explorer architecture corrections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-explorador-profundo.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deep corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Explorador data contract: classify the route without exposing Premium execution fields.
          p = Path('api/data.js')
          s = p.read_text()
          old = '''        estadoCurado: a.estado_curado || null,\n        accionTexto: a.accion_texto || null,\n        observacionTexto: a.observacion_texto || null,\n        continuidadTexto: a.continuidad_texto || null,\n'''
          new = '''        estadoCurado: a.estado_curado || null,\n        ruta: a.tipo_card === "D" ? "habito" : "comida",\n        // Estos campos siguen disponibles para el motor interno, pero el cliente del Explorador\n        // ya no debe presentarlos como si fueran la respuesta Premium completa.\n        tieneExperimento: Boolean(a.accion_texto || a.observacion_texto || a.continuidad_texto),\n'''
          if old not in s: raise SystemExit('api/data.js: expected payload fragment not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) registrar-comida: expose stable identifiers so Premium can fetch the real solution
          # without leaking its contents to Free.
          p = Path('api/registrar-comida.js')
          s = p.read_text()
          old = 'reglas?select=id,combinacion,resultado,palabras_clave,nivel_riesgo,nivel_acceso,momento_requerido,palabras_excluyentes,familia_key,prioridad_motor,soluciones(nombre_hackeo,adaptacion,variable_modificada,categoria,accion_usuario,observacion_usuario,contexto_activacion,continuidad)'
          new = 'reglas?select=id,solucion_id,combinacion,resultado,palabras_clave,nivel_riesgo,nivel_acceso,momento_requerido,palabras_excluyentes,familia_key,prioridad_motor,soluciones(nombre_hackeo,adaptacion,variable_modificada,categoria,accion_usuario,observacion_usuario,contexto_activacion,continuidad)'
          if old not in s: raise SystemExit('registrar-comida.js: select fragment not found')
          s = s.replace(old, new, 1)
          old = '''              texto: construirInvitacionPremium(),\n              variable: r.soluciones.variable_modificada || null,\n              categoria: r.soluciones.categoria || null,\n'''
          new = '''              texto: construirInvitacionPremium(),\n              variable: r.soluciones.variable_modificada || null,\n              categoria: r.soluciones.categoria || null,\n              reglaId: r.id,\n              solucionId: r.solucion_id || null,\n'''
          if old not in s: raise SystemExit('registrar-comida.js: invitation fragment not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) New protected endpoint: Premium gets the actual experiment detail by relation.
          Path('api/experimento.js').write_text(r'''import { supabaseFetch } from "./_supabase.js";\nimport { usuarioIdDesdeRequest } from "./_sesion.js";\n\nconst UUID_REGEX = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;\n\nexport default async function handler(req, res) {\n  if (req.method !== "GET") return res.status(405).json({ error: "Método no permitido." });\n  const usuarioId = usuarioIdDesdeRequest(req);\n  if (!usuarioId || !UUID_REGEX.test(usuarioId)) return res.status(401).json({ error: "Sesión inválida o vencida." });\n\n  const usuario = await supabaseFetch(`usuarios?id=eq.${usuarioId}&select=nivel_acceso,cuenta_suspendida,terminos_aceptados`);\n  if (!usuario.length || usuario[0].cuenta_suspendida === true || usuario[0].terminos_aceptados !== true) {\n    return res.status(403).json({ error: "No se puede acceder a este experimento." });\n  }\n  if ((usuario[0].nivel_acceso || "gratuito") !== "Premium") {\n    return res.status(403).json({ premium: false, error: "Este experimento requiere Premium." });\n  }\n\n  const solucionId = String(req.query?.solucionId || "");\n  if (!UUID_REGEX.test(solucionId)) return res.status(400).json({ error: "solucionId inválido." });\n\n  const rows = await supabaseFetch(\n    `soluciones?id=eq.${solucionId}&select=id,nombre_hackeo,adaptacion,variable_modificada,categoria,accion_usuario,observacion_usuario,contexto_activacion,continuidad`\n  );\n  if (!rows.length) return res.status(404).json({ error: "No encontramos el experimento solicitado." });\n\n  const s = rows[0];\n  return res.status(200).json({\n    premium: true,\n    experimento: {\n      id: s.id,\n      nombre: s.nombre_hackeo || "",\n      adaptacion: s.adaptacion || "",\n      variable: s.variable_modificada || null,\n      categoria: s.categoria || null,\n      accionUsuario: s.accion_usuario || null,\n      observacionUsuario: s.observacion_usuario || null,\n      contextoActivacion: s.contexto_activacion || null,\n      continuidad: s.continuidad || null,\n    },\n  });\n}\n''')

          # 4) inicio.html: replace the flat search with semantic intent resolution and a strict hierarchy.
          p = Path('inicio.html')
          s = p.read_text()

          old = '''function scoreEntry(e,q){\n  const n=normalize(q); if(!n)return 0;\n  const fields=[e.combinacion,e.resultado,e.mecanismo,e.intencionPrincipal,e.familia,...(e.intencionesSecundarias||[])].map(normalize);\n  let s=0;\n  if(fields[0]&&fields[0].includes(n))s+=80;\n  if(fields[1]&&fields[1].includes(n))s+=55;\n  if(fields[2]&&fields[2].includes(n))s+=40;\n  if(fields[3]&&fields[3].includes(n))s+=45;\n  if(fields[4]&&fields[4].includes(n))s+=35;\n  fields.slice(5).forEach(f=>{if(f&&f.includes(n))s+=25});\n  n.split(/\\s+/).filter(Boolean).forEach(word=>fields.forEach(f=>{if(f.includes(word))s+=4}));\n  return s;\n}\nfunction explain(e,q){\n  const n=normalize(q);\n  if(e.intencionPrincipal && normalize(e.intencionPrincipal).includes(n)) return `Aparece porque preguntaste por "${q}" y esta ficha está vinculada directamente con esa intención.`;\n  if(e.familia && normalize(e.familia).includes(n)) return `Aparece porque preguntaste por "${q}" y esta ficha pertenece a una familia relacionada.`;\n  return `Aparece porque preguntaste por "${q}" y el contenido de esta ficha tiene relación con eso.`;\n}\n'''
          new = '''const BUSQUEDA_SEMANTICA=[\n  {intencion:"energia",terminos:["energia","energía","cansancio","fatiga","agotamiento","sin energia","sin energía","bajon","bajón"]},\n  {intencion:"descanso_sueno",terminos:["sueño","dormir","descanso","descansar","no descanso","duermo y no descanso"]},\n  {intencion:"hambre_saciedad",terminos:["hambre","quedar con hambre","me quedo con hambre","saciedad","antojo","picar"]},\n  {intencion:"digestion",terminos:["digestión","digestion","pesadez","pesado","hinchado","hinchazón","inflamación"]},\n  {intencion:"entrenamiento",terminos:["entrenar","entrenamiento","ejercicio","actividad física","actividad fisica"]},\n  {intencion:"recuperacion",terminos:["recuperación","recuperacion","recuperar","después de entrenar","despues de entrenar"]},\n  {intencion:"foco_concentracion",terminos:["foco","concentración","concentracion","atención","atencion"]},\n];\nfunction resolverIntencion(q){\n  const n=normalize(q);\n  if(!n)return null;\n  let mejor=null;\n  for(const item of BUSQUEDA_SEMANTICA){\n    for(const termino of item.terminos){\n      const t=normalize(termino);\n      if(n===t || n.includes(t) || t.includes(n)){\n        const score=t.length;\n        if(!mejor || score>mejor.score)mejor={intencion:item.intencion,score};\n      }\n    }\n  }\n  return mejor?.intencion||null;\n}\nfunction scoreEntry(e,q,intencion){\n  const n=normalize(q); if(!n)return 0;\n  if(intencion && e.intencionPrincipal!==intencion)return 0;\n  const fields=[e.combinacion,e.resultado,e.mecanismo,e.intencionPrincipal,e.familia,...(e.intencionesSecundarias||[])].map(normalize);\n  let s=intencion&&e.intencionPrincipal===intencion?1000:0;\n  if(fields[0]&&fields[0].includes(n))s+=90;\n  if(fields[1]&&fields[1].includes(n))s+=50;\n  if(fields[2]&&fields[2].includes(n))s+=45;\n  if(fields[3]&&fields[3].includes(n))s+=40;\n  if(fields[4]&&fields[4].includes(n))s+=25;\n  n.split(/\\s+/).filter(Boolean).forEach(word=>fields.forEach(f=>{if(f.includes(word))s+=3}));\n  // Cuando la consulta es una intención de sueño, priorizamos primero los hábitos directos\n  // porque resuelven la pregunta sin mezclarla inmediatamente con alimentos.\n  if(intencion==="descanso_sueno" && e.ruta==="habito")s+=80;\n  return s + Number(e.prioridadBusqueda||0);\n}\nfunction explain(e,q,intencion){\n  if(intencion && e.intencionPrincipal===intencion){\n    const labels={energia:"energía y cansancio",descanso_sueno:"sueño y descanso",hambre_saciedad:"hambre y saciedad",digestion:"digestión",entrenamiento:"entrenamiento",recuperacion:"recuperación",foco_concentracion:"foco y concentración"};\n    return `La vinculamos directamente con ${labels[intencion]||q}.`;\n  }\n  if(e.familia && normalize(e.familia).includes(normalize(q))) return `La vinculamos con la familia "${e.familia}".`;\n  return `La vinculamos con el contenido que escribiste.`;\n}\n'''
          if old not in s: raise SystemExit('inicio.html: search functions fragment not found')
          s=s.replace(old,new,1)

          old='''  const results=useMemo(()=>{\n    if(!data)return []; const all=data.entradas||[]; const n=normalize(q);\n    if(!n)return [];\n    return all.map(e=>({e,s:scoreEntry(e,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,7);\n  },[data,q]);\n'''
          new='''  const intencionBusqueda=useMemo(()=>resolverIntencion(q),[q]);\n  const results=useMemo(()=>{\n    if(!data)return [];\n    const all=data.entradas||[];\n    const n=normalize(q);\n    if(!n)return [];\n    return all.map(e=>({e,s:scoreEntry(e,q,intencionBusqueda)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);\n  },[data,q,intencionBusqueda]);\n'''
          if old not in s: raise SystemExit('inicio.html: results fragment not found')
          s=s.replace(old,new,1)

          # Remove mixed-domain chips from Antes de comer.
          old='''const SITUACIONES_ANTES=[\n  {label:"🍽️ Voy a comer algo",placeholder:"Ej: milanesa con papas fritas"},\n  {label:"🥤 Voy a tomar algo",placeholder:"Ej: gaseosa, fernet con cola, mate cocido"},\n  {label:"🏋️ Antes de entrenar",placeholder:"Ej: banana con manteca de maní"},\n  {label:"😴 Antes de dormir",placeholder:"Ej: té de manzanilla con cerezas"},\n];'''
          new='''const SITUACIONES_ANTES=[\n  {label:"🍽️ Voy a comer algo",placeholder:"Ej: milanesa con papas fritas"},\n  {label:"🥤 Voy a tomar algo",placeholder:"Ej: gaseosa, mate cocido, agua con gas"},\n];'''
          if old not in s: raise SystemExit('inicio.html: before chips fragment not found')
          s=s.replace(old,new,1)

          # Search result card: Free sees observation/context, not the Premium execution recipe.
          old='''            {results.length?results.map(({e})=><div className="card" key={e.id}>\n              <h3>{e.combinacion||"Sin título"}</h3>\n              <p>{e.resultado||e.mecanismo||"Información disponible para esta situación."}</p>\n              <p className="why">{explain(e,q)}</p>\n              {e.accionTexto&&<p style={{marginTop:8,color:'var(--text)'}}><b>Probá:</b> {e.accionTexto}</p>}\n              {e.observacionTexto&&<p style={{marginTop:4,color:'var(--muted)',fontSize:'12.5px'}}><b>Observá:</b> {e.observacionTexto}</p>}\n              {e.continuidadTexto&&<p style={{marginTop:4,color:'var(--mint)',fontSize:'12px'}}>{e.continuidadTexto}</p>}\n              {e.accionTexto&&<p className="why" style={{marginTop:8,cursor:'pointer'}} onClick={()=>irAPremiumConContexto(e.combinacion,{texto:"Para esto que acabás de consultar, hay una acción concreta que podés probar.",variable:null,categoria:null},{accionUsuario:e.accionTexto,observacionUsuario:e.observacionTexto,continuidad:e.continuidadTexto})}>✦ Experimentar el cómo, en Premium →</p>}\n              {!e.accionTexto&&<p style={{marginTop:8,color:'var(--muted)',fontSize:'12px',fontStyle:'italic'}}>Todavía no tenemos un experimento puntual cargado para esto — preferimos no inventarte uno.</p>}\n              {puedeLlevarAntesDeComer(e,q)&&<button className="secondary" style={{marginTop:10}} onClick={()=>{setBefore(e.combinacion||"");setBeforeResult(null);setMsg("");irA('descubrir');setQ("")}}>Llevarlo a "Antes de comer" →</button>}\n            </div>):<div className="empty">Buscaste "{q}" y no encontramos una relación suficientemente clara todavía. Eso no significa que no exista; significa que preferimos no inventarte una respuesta. Probá con otras palabras, o registralo en Mi Día para que empecemos a ver patrones con el tiempo.</div>}\n'''
          new='''            {results.length?results.map(({e,i})=><div className="card" key={e.id}>\n              <div className="eyebrow" style={{marginBottom:5}}>{i===0?"Respuesta principal":"Otra forma de abordarlo"}</div>\n              <h3>{e.combinacion||"Sin título"}</h3>\n              <p>{e.resultado||e.mecanismo||"Información disponible para esta situación."}</p>\n              <p className="why">{explain(e,q,intencionBusqueda)}</p>\n              {e.ruta&&<p style={{marginTop:7,color:'var(--muted)',fontSize:'10.5px'}}>Enfoque: {e.ruta==='habito'?"hábito o conducta":"alimentación"}</p>}\n              {i===0&&e.tieneExperimento&&<p className="why" style={{marginTop:8,cursor:'pointer'}} onClick={()=>irAPremiumConContexto(e.combinacion,{texto:"Encontraste una alternativa que se puede experimentar de forma concreta.",variable:null,categoria:null,solucionId:null},{alternativaId:e.id})}>✦ Ver cómo experimentarlo en Premium →</p>}\n              {i===0&&!e.tieneExperimento&&<p style={{marginTop:8,color:'var(--muted)',fontSize:'12px',fontStyle:'italic'}}>Todavía no tenemos un experimento puntual cargado para esto — preferimos no inventarte uno.</p>}\n            </div>):<div className="empty">Buscaste "{q}". No encontramos contenido suficientemente preciso para esa intención todavía. Si querés, probá con una de estas situaciones: energía/cansancio, sueño/descanso, hambre/saciedad o digestión.</div>}\n'''
          if old not in s: raise SystemExit('inicio.html: search card fragment not found')
          s=s.replace(old,new,1)

          # Premium state: fetch real detail only for entitled users; no fake experiment payload.
          old='''  const [ultimoHallazgo,setUltimoHallazgo]=useState(null); // {combinacion, invitacion}\n'''
          new='''  const [ultimoHallazgo,setUltimoHallazgo]=useState(null); // {combinacion, invitacion, experimento, alternativaId}\n  const [premiumExperimento,setPremiumExperimento]=useState(null);\n  const [premiumBusy,setPremiumBusy]=useState(false);\n'''
          if old not in s: raise SystemExit('inicio.html: premium state fragment not found')
          s=s.replace(old,new,1)

          old='''  function irAPremiumConContexto(combinacion,invitacion,experimento){ setUltimoHallazgo({combinacion,invitacion,experimento}); irA('premium'); }\n'''
          new='''  function irAPremiumConContexto(combinacion,invitacion,experimento){ setPremiumExperimento(experimento||null); setUltimoHallazgo({combinacion,invitacion,experimento,alternativaId:experimento?.alternativaId||null}); irA('premium'); }\n  useEffect(()=>{\n    if(tab!=="premium" || !ultimoHallazgo?.invitacion?.solucionId || !usuario?.pase) return;\n    let cancelado=false;\n    setPremiumBusy(true);\n    fetch(`/api/experimento?solucionId=${encodeURIComponent(ultimoHallazgo.invitacion.solucionId)}`,{headers:{Authorization:`Bearer ${usuario.pase}`}})\n      .then(r=>r.json().then(d=>({ok:r.ok,d})))\n      .then(({ok,d})=>{if(!cancelado && ok && d.premium)setPremiumExperimento(d.experimento);})\n      .catch(()=>{})\n      .finally(()=>{if(!cancelado)setPremiumBusy(false)});\n    return ()=>{cancelado=true};\n  },[tab,ultimoHallazgo,usuario]);\n'''
          if old not in s: raise SystemExit('inicio.html: premium navigation fragment not found')
          s=s.replace(old,new,1)

          # Premium UI: explicit experiment workspace instead of generic presentation.
          old='''        {ultimoHallazgo&&<div className="premium-context"><h3>Tu experimento</h3>{ultimoHallazgo.experimento?.accionUsuario&&<p><b>Qué hacer:</b> {ultimoHallazgo.experimento.accionUsuario}</p>}{ultimoHallazgo.experimento?.observacionUsuario&&<p><b>Qué observar:</b> {ultimoHallazgo.experimento.observacionUsuario}</p>}{ultimoHallazgo.experimento?.contextoActivacion&&<p><b>Cuándo:</b> {ultimoHallazgo.experimento.contextoActivacion}</p>}{ultimoHallazgo.experimento?.continuidad&&<p><b>Cómo continuar:</b> {ultimoHallazgo.experimento.continuidad}</p>}{!ultimoHallazgo.experimento?.accionUsuario&&<p>Este hallazgo tiene una oportunidad Premium asociada. El detalle del experimento aparece al activarlo.</p>}</div>}\n'''
          new='''        {ultimoHallazgo&&<div className="premium-context"><h3>Experimento disponible</h3>{premiumBusy&&<p>Preparando el detalle de este experimento...</p>}{premiumExperimento?.adaptacion&&<p><b>Cómo hacerlo:</b> {premiumExperimento.adaptacion}</p>}{premiumExperimento?.accionUsuario&&<p><b>Qué hacer:</b> {premiumExperimento.accionUsuario}</p>}{premiumExperimento?.contextoActivacion&&<p><b>Cuándo aplicarlo:</b> {premiumExperimento.contextoActivacion}</p>}{premiumExperimento?.observacionUsuario&&<p><b>Qué observar:</b> {premiumExperimento.observacionUsuario}</p>}{premiumExperimento?.continuidad&&<p><b>Cómo continuar:</b> {premiumExperimento.continuidad}</p>}{!premiumBusy&&!premiumExperimento&&<p>El experimento concreto está disponible con Premium. Ahí vas a ver qué cambiar, cómo aplicarlo, qué observar y cómo continuar.</p>}{premiumExperimento&&<button className="primary" style={{marginTop:4}} onClick={()=>setMsg("Experimento listo para probar. Registrá después qué notaste en Mi Día.")}>Experimentar con esto</button>}</div>}\n'''
          if old not in s: raise SystemExit('inicio.html: premium UI fragment not found')
          s=s.replace(old,new,1)

          # Mi Día: never render an empty analysis card after a successful registration.
          old='''  const [comidaTexto,setComidaTexto]=useState(""); const [comidaBusy,setComidaBusy]=useState(false); const [comidaMsg,setComidaMsg]=useState(""); const [comidaResult,setComidaResult]=useState(null);\n'''
          new='''  const [comidaTexto,setComidaTexto]=useState(""); const [comidaBusy,setComidaBusy]=useState(false); const [comidaMsg,setComidaMsg]=useState(""); const [comidaResult,setComidaResult]=useState(null); const [comidaRegistrada,setComidaRegistrada]=useState("");\n'''
          if old not in s: raise SystemExit('inicio.html: food state fragment not found')
          s=s.replace(old,new,1)
          old='''      setComidaResult(d); setComidaTexto(""); setComidaMsg("Comida registrada. Podés sumar otra cuando quieras.");\n'''
          new='''      setComidaRegistrada(comidaTexto.trim()); setComidaResult(d); setComidaTexto(""); setComidaMsg("✓ Comida registrada en Mi Día.");\n'''
          if old not in s: raise SystemExit('inicio.html: food registration success fragment not found')
          s=s.replace(old,new,1)
          old='''<textarea value={comidaTexto} onChange={e=>setComidaTexto(e.target.value)} placeholder="Ej: milanesa con papas fritas" /><button className="primary" onClick={registrarComidaMiDia} disabled={comidaBusy}>{comidaBusy?"Guardando...":"Registrar comida"}</button>{comidaMsg&&<div className="saved">{comidaMsg}</div>}{comidaResult&&<BeforeResult data={comidaResult} original={comidaTexto} onIrPremium={irAPremiumConContexto} />}'''
          new='''<textarea value={comidaTexto} onChange={e=>setComidaTexto(e.target.value)} placeholder="Ej: milanesa con papas fritas" /><button className="primary" onClick={registrarComidaMiDia} disabled={comidaBusy}>{comidaBusy?"Guardando...":"Registrar comida"}</button>{comidaMsg&&<div className="saved">{comidaMsg}{comidaRegistrada&&<><br/><span style={{fontWeight:600,color:'var(--muted)'}}>{comidaRegistrada}</span></>}</div>}{comidaResult&&(comidaResult.bloqueos?.length>0||comidaResult.sugerencias?.length>0)&&<BeforeResult data={comidaResult} original={comidaRegistrada} onIrPremium={irAPremiumConContexto} />}'''
          if old not in s: raise SystemExit('inicio.html: Mi Día food UI fragment not found')
          s=s.replace(old,new,1)

          # Keep the explicit food boundary in the copy.
          old='<h2>🍽️ Antes de comer o hacer algo</h2>'
          new='<h2>🍽️ Antes de comer</h2>'
          if old not in s: raise SystemExit('inicio.html: before heading fragment not found')
          s=s.replace(old,new,1)
          old='<p>Consultá primero. No hace falta registrar nada: queremos ayudarte en el momento en que tomás la decisión.</p>'
          new='<p>Consultá una comida o bebida antes de consumirla. No hace falta registrar nada.</p>'
          if old not in s: raise SystemExit('inicio.html: before copy fragment not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit corrections and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/data.js api/registrar-comida.js api/experimento.js inicio.html .github/workflows/audit-explorador-profundo.yml
          git commit -m 'Deep audit: clarify Explorer, registration and Premium experiment flow'
          git push
          git rm .github/workflows/audit-explorador-profundo.yml
          git commit -m 'Remove temporary deep audit workflow'
          git push
