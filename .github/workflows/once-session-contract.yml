name: Once session contract patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch session-backed writes
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('inicio.html')
          s=p.read_text(encoding='utf-8')
          food=re.search(r'async function registrarComida\(\)\{.*?\nfunction registrarBienestar\(\)\{.*?\}',s,re.S)
          if not food:
              raise SystemExit('write functions not found')
          repl='''async function registrarComida(){const texto=comidaTexto.trim();if(!texto)return;setComidaBusy(true);setComidaMsg("");setComidaResult(null);try{const u=(()=>{try{return JSON.parse(lsGet("reseteo_usuario")||"null")}catch(e){return null}})();const pase=u?.pase||"";const r=await fetch("/api/registrar-comida",{method:"POST",headers:{"Content-Type":"application/json",...(pase?{Authorization:"Bearer "+pase}: {})},body:JSON.stringify({texto,soloVista:false})});const b=await r.json();if(!r.ok)throw Error(b.error||"No pudimos registrar esta comida ahora.");setComidaResult(b)}catch(e){setComidaMsg(e.message||"No pudimos registrar esta comida ahora.")}finally{setComidaBusy(false)}}
async function registrarBienestar(){const body={energia:energy||undefined,digestion:dig||undefined,sueno:sleep?Number(sleep):undefined,hidratacion:water?Number(water):undefined,actividad_fisica:activity?Number(activity):undefined};if(!Object.values(body).some(v=>v!==undefined)){setComidaMsg("Elegí al menos una señal para guardar.");return}const u=(()=>{try{return JSON.parse(lsGet("reseteo_usuario")||"null")}catch(e){return null}})();const pase=u?.pase||"";if(!pase){setComidaMsg("Iniciá sesión para guardar tu bienestar.");return}setComidaBusy(true);setComidaMsg("");try{const r=await fetch("/api/registrar-bienestar",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+pase},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"No se pudo guardar");setComidaMsg("✓ Observación guardada. Mi Día ya está actualizado.")}catch(e){setComidaMsg(e.message||"No pudimos guardar la observación ahora.")}finally{setComidaBusy(false)}}'''
          s=s[:food.start()]+repl+s[food.end():]
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q 'Authorization:"Bearer "+pase' inicio.html
          grep -q 'registrar-bienestar' inicio.html
          grep -q 'Iniciá sesión para guardar tu bienestar' inicio.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inicio.html
          git commit -m 'fix: session-backed food and wellbeing writes'
          git push origin HEAD:main
