name: one-shot-surgical-ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply surgical UI correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical correction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inicio.html')
          s=p.read_text(encoding='utf-8')

          # 1) Mobile hierarchy: the user's requested result must precede exploratory pills.
          old="{msg&&<div className=\"saved\">{msg}</div>}<section className=\"pillbox\""
          new="{msg&&<div className=\"saved\">{msg}</div>}{renderResultado()}<section className=\"pillbox\""
          if old not in s: raise SystemExit('HIERARCHY_ANCHOR_NOT_FOUND')
          s=s.replace(old,new,1)
          old2="</section>{renderResultado()}</>}"
          if old2 not in s: raise SystemExit('HIERARCHY_REMOVE_ANCHOR_NOT_FOUND')
          s=s.replace(old2,"</section></>}",1)

          # 2) Typed food must always reach the food engine; wellbeing intents belong to pills.
          old3="const intent=intentDeTexto(t);if(intent){resolverConsulta(t,intent);return}setBusy(true);"
          new3="setBusy(true);"
          if old3 not in s: raise SystemExit('FOOD_ENGINE_ANCHOR_NOT_FOUND')
          s=s.replace(old3,new3,1)

          # 3) Quick-pill result gets an explicit Premium bridge without exposing implementation language.
          old4="{e.evidencia&&<p style={{fontSize:10,color:'#8fa89b'}}>Base: {e.evidencia}</p>}</div>)}</div></div>;"
          new4="{e.evidencia&&<p style={{fontSize:10,color:'#8fa89b'}}>Base: {e.evidencia}</p>}<button className=\"primary\" onClick={()=>setTab('premium')}>✦ Ver cómo experimentar con esto en Premium →</button></div>)}</div></div>;"
          if old4 not in s: raise SystemExit('PILL_PREMIUM_ANCHOR_NOT_FOUND')
          s=s.replace(old4,new4,1)

          # 4) Candidate ordering for quick-pill content: curated family entries first, then priority.
          old5="const candidatos=entradas.filter(e=>e.intencionPrincipal===intent).sort((a,b)=>(b.prioridadBusqueda||0)-(a.prioridadBusqueda||0)||(b.orden_prioridad||0)-(a.orden_prioridad||0)).slice(0,3);"
          new5="const candidatos=entradas.filter(e=>e.intencionPrincipal===intent).sort((a,b)=>((b.familia?1:0)-(a.familia?1:0))||(b.prioridadBusqueda||0)-(a.prioridadBusqueda||0)||(b.orden_prioridad||0)-(a.orden_prioridad||0)).slice(0,3);"
          if old5 not in s: raise SystemExit('SEMANTIC_PRIORITY_ANCHOR_NOT_FOUND')
          s=s.replace(old5,new5,1)

          p.write_text(s,encoding='utf-8')
          PY

          git diff --check
          git diff -- inicio.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inicio.html
          git commit -m 'chore: apply surgical UI correction'
          git push

      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/one-shot-surgical-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove one-shot surgical workflow'
          git push || true
