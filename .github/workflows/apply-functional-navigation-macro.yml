name: Apply functional navigation macro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: functional-navigation-macro
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply functional navigation corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("inicio.html")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'function irA\(t\)\{setTab\(t\);history\.pushState\(\{tab:t\},""\)\}',
              'function irA(t){setTab(t);history.pushState({tab:t},"");window.scrollTo({top:0,behavior:"smooth"})}',
              s,
              count=1,
          )

          if 'aria-label="Limpiar búsqueda"' not in s:
              pattern = r'(<input value=\{q\} onChange=\{e=>setQ\(e\.target\.value\)\} placeholder="Ej: cansancio, hambre, digestión\.\.\." />)'
              replacement = r'\1{q.trim()&&<button className="secondary" aria-label="Limpiar búsqueda" style={{width:"auto",marginTop:0,padding:"8px 10px"}} onClick={()=>{setQ("");setMsg("");setBefore("");setBeforeResult(null)}}>Limpiar</button>}'
              s, n = re.subn(pattern, replacement, s, count=1)
              if n == 0:
                  raise SystemExit("No se encontró el campo de búsqueda esperado")

          # The previous correction made the bottom buttons visually active but the page
          # still rendered only Descubrir. Make the three existing tabs actual views,
          # reusing the already-present state and registrar-comida API.
          if 'tab==="mi-dia"&&<>' not in s:
              marker = '<div className="hero"><div className="eyebrow">EXPLORADOR</div>'
              if marker not in s:
                  raise SystemExit("No se encontró el inicio de la vista Explorador")
              s = s.replace(marker, '{tab==="descubrir"&&<><div className="hero"><div className="eyebrow">EXPLORADOR</div>', 1)

              marker = '</div><div className="tabs"><div className="tabs-inner">'
              if marker not in s:
                  raise SystemExit("No se encontró el cierre de la vista Explorador")

              extra = '''</div></>}{tab==="mi-dia"&&<><div className="hero"><div className="eyebrow">MI DÍA</div><h1>Registrá lo que pasó.</h1><p>Sumá una comida concreta y recibí una devolución visible. Después podés volver a Descubrir.</p></div><div className="event-grid"><div className="event"><h3>Registrar comida</h3><p>Escribí qué comiste. No hace falta describirlo perfecto.</p><textarea value={comidaTexto} onChange={e=>{setComidaTexto(e.target.value);setComidaMsg("");setComidaResult(null)}} placeholder="Ej: milanesa con papas fritas"></textarea><button className="primary" onClick={registrarComida} disabled={comidaBusy}>{comidaBusy?"Registrando...":"Registrar comida"}</button>{comidaMsg&&<div className="saved">{comidaMsg}</div>}{comidaResult&&(comidaResult.bloqueos?.length>0||comidaResult.sugerencias?.length>0)&&<div className="result">{comidaResult.combinacion&&<div className="card"><h3>{comidaResult.combinacion}</h3><p>{comidaResult.adaptacion||comidaResult.resultado||"Registro recibido."}</p>{comidaResult.invitacionPremium&&<button className="secondary" onClick={()=>irAPremiumConContexto(comidaResult.combinacion,comidaResult.invitacionPremium,comidaResult.solucion||null)}>✦ Experimentar el cómo, en Premium →</button>}</div>}</div>}</div></div></>}{tab==="premium"&&<><div className="hero"><div className="eyebrow">LABORATORIO PREMIUM</div><h1>{ultimoHallazgo?`Experimentar con "${ultimoHallazgo.combinacion}"`:"Experimentá con lo que descubrís"}</h1><p>{ultimoHallazgo?ultimoHallazgo.invitacion?.texto||"Hay una oportunidad concreta para experimentar con este hallazgo.":"Premium convierte un hallazgo concreto en una oportunidad de experimentación y comparación personal."}</p></div>{ultimoHallazgo&&<div className="premium-context"><h3>Tu oportunidad ahora</h3><p>{ultimoHallazgo.experimento?.accionUsuario||"Hay una forma concreta de experimentar con este hallazgo."}</p>{ultimoHallazgo.experimento?.observacionUsuario&&<p><strong>Observá:</strong> {ultimoHallazgo.experimento.observacionUsuario}</p>}{ultimoHallazgo.experimento?.continuidad&&<p><strong>Cómo continuar:</strong> {ultimoHallazgo.experimento.continuidad}</p>}<button className="primary" onClick={()=>{}}>Ver experimento</button></div>}<div className="premium"><h2>Aprendizaje que se acumula</h2><p>Compará lo que probás, observá qué cambia y construí patrones personales con el tiempo.</p><span className="pill">Comparación personal</span><span className="pill">Mis patrones</span><span className="pill">Experimentos</span><span className="pill">Continuidad</span></div></>}<div className="tabs"><div className="tabs-inner">'''
              s = s.replace(marker, extra, 1)

          # Make the tabs react to the current view if they are still static.
          old_tabs = '<button className="tab active" onClick={()=>irA("descubrir")}>Descubrir<small>Explorar</small></button><button className="tab" onClick={()=>irA("mi-dia")}>Mi Día<small>Registrar</small></button><button className="tab" onClick={()=>irA("premium")}>Premium<small>Experimentar</small></button>'
          new_tabs = '<button className={"tab "+(tab==="descubrir"?"active":"")} onClick={()=>irA("descubrir")}>Descubrir<small>Explorar</small></button><button className={"tab "+(tab==="mi-dia"?"active":"")} onClick={()=>irA("mi-dia")}>Mi Día<small>Registrar</small></button><button className={"tab "+(tab==="premium"?"active":"")} onClick={()=>irA("premium")}>Premium<small>Experimentar</small></button>'
          if old_tabs in s:
              s = s.replace(old_tabs, new_tabs, 1)

          p.write_text(s, encoding="utf-8")

      - name: Validate
        shell: bash
        run: |
          test -f inicio.html
          grep -q 'tab==="descubrir"&&<>' inicio.html
          grep -q 'tab==="mi-dia"&&<>' inicio.html
          grep -q 'tab==="premium"&&<>' inicio.html
          grep -q 'aria-label="Limpiar búsqueda"' inicio.html
          grep -q 'registrarComida' inicio.html
          git diff --check

      - name: Commit with remote-safe retry
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inicio.html
          if git diff --cached --quiet; then
            echo 'No changes required; workflow completed successfully.'
            exit 0
          fi
          git commit -m 'fix: make primary app tabs functional'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'Push succeeded.'
              exit 0
            fi
            echo "Push rejected; synchronizing with latest main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to push after 5 synchronized attempts.'
          exit 1
