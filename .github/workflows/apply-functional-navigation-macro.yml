name: Apply functional navigation macro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: restore functional navigation macro') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate target exists
        run: |
          test -f inicio.html
          grep -q 'function irA(t)' inicio.html
          grep -q 'registrar-comida' inicio.html

      - name: Apply functional navigation macro
        shell: python
        run: |
          from pathlib import Path
          p = Path("inicio.html")
          s = p.read_text()

          old = 'function irA(t){setTab(t);history.pushState({tab:t},"")}'
          new = 'function irA(t){setTab(t);history.pushState({tab:t},"");window.scrollTo({top:0,behavior:"smooth"})}'
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          old = '<input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ej: cansancio, hambre, digestión..." />'
          new = '<input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ej: cansancio, hambre, digestión..." />{q.trim()&&<button className="secondary" style={{width:"auto",marginTop:0,padding:"8px 10px"}} onClick={()=>{setQ("");setMsg("");setBefore("");setBeforeResult(null)}}>Limpiar</button>}'
          if old in s and 'onClick={()=>{setQ("");setMsg("");setBefore("");setBeforeResult(null)}}' not in s:
              s = s.replace(old, new, 1)

          # Make the navigation tabs reflect the actual selected tab.
          old = '<button className="tab active" onClick={()=>irA("descubrir")}>Descubrir<small>Explorar</small></button><button className="tab" onClick={()=>irA("mi-dia")}>Mi Día<small>Registrar</small></button><button className="tab" onClick={()=>irA("premium")}>Premium<small>Experimentar</small></button>'
          new = '<button className={"tab "+(tab==="descubrir"?"active":"")} onClick={()=>irA("descubrir")}>Descubrir<small>Explorar</small></button><button className={"tab "+(tab==="mi-dia"?"active":"")} onClick={()=>irA("mi-dia")}>Mi Día<small>Registrar</small></button><button className={"tab "+(tab==="premium"?"active":"")} onClick={()=>irA("premium")}>Premium<small>Experimentar</small></button>'
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Verify patch and commit
        shell: bash
        run: |
          grep -q 'setQ("");setMsg("")' inicio.html
          grep -q 'tab==="mi-dia"' inicio.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inicio.html
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'fix: restore functional navigation macro'
          git push
