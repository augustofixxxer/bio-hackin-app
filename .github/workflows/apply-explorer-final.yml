name: Apply final Explorer selector
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-explorer-final.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply semantic selector
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('inicio.html')
          s=p.read_text()
          start=s.find('function scoreEntry(e,q)')
          end=s.find('function explain(e,q)', start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontro el bloque selector original')
          block='''const BUSQUEDA_SEMANTICA=[
  {intencion:"energia",terminos:["energia","energía","cansancio","fatiga","agotamiento","sin energia","sin energía","bajon","bajón"]},
  {intencion:"descanso_sueno",terminos:["sueño","dormir","descanso","descansar","no descanso","duermo y no descanso"]},
  {intencion:"hambre_saciedad",terminos:["hambre","quedar con hambre","me quedo con hambre","saciedad","antojo","picar"]},
  {intencion:"digestion",terminos:["digestión","digestion","pesadez","pesado","hinchado","hinchazón","inflamación"]},
  {intencion:"entrenamiento",terminos:["entrenar","entrenamiento","ejercicio","actividad física","actividad fisica"]},
  {intencion:"recuperacion",terminos:["recuperación","recuperacion","recuperar","después de entrenar","despues de entrenar"]},
  {intencion:"foco_concentracion",terminos:["foco","concentración","concentracion","atención","atencion"]},
];
function resolverIntencion(q){
  const n=normalize(q); if(!n)return null;
  let mejor=null;
  for(const item of BUSQUEDA_SEMANTICA){for(const termino of item.terminos){const t=normalize(termino);if(n===t||n.includes(t)||t.includes(n)){const score=t.length;if(!mejor||score>mejor.score)mejor={intencion:item.intencion,score}}}}
  return mejor?.intencion||null;
}
function scoreEntry(e,q,intencion){
  const n=normalize(q); if(!n)return 0;
  if(intencion&&e.intencionPrincipal!==intencion)return 0;
  const fields=[e.combinacion,e.resultado,e.mecanismo,e.intencionPrincipal,e.familia,...(e.intencionesSecundarias||[])].map(normalize);
  let s=intencion&&e.intencionPrincipal===intencion?1000:0;
  if(fields[0]&&fields[0].includes(n))s+=90;if(fields[1]&&fields[1].includes(n))s+=50;if(fields[2]&&fields[2].includes(n))s+=45;if(fields[3]&&fields[3].includes(n))s+=40;if(fields[4]&&fields[4].includes(n))s+=25;
  n.split(/\s+/).filter(Boolean).forEach(word=>fields.forEach(f=>{if(f.includes(word))s+=3}));
  return s+Number(e.prioridadBusqueda||0);
}
'''
          s=s[:start]+block+s[end:]
          pat=r'const results=useMemo\(\(\)=>\{.*?\n  \},\[data,q\]\);'
          repl='''const intencionBusqueda=useMemo(()=>resolverIntencion(q),[q]);
  const results=useMemo(()=>{
    if(!data)return [];
    const all=data.entradas||[]; const n=normalize(q);
    if(!n)return [];
    const ranked=all.map(e=>({e,s:scoreEntry(e,q,intencionBusqueda)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    return ranked.slice(0,3);
  },[data,q,intencionBusqueda]);'''
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se encontro el bloque de resultados')
          p.write_text(s)
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('inicio.html').read_text()
          for x in ['BUSQUEDA_SEMANTICA','resolverIntencion(q)','scoreEntry(e,q,intencion)','slice(0,3)','intencionBusqueda']:
              assert x in s, x
          assert 'slice(0,7)' not in s
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inicio.html
          git commit -m "fix: activate semantic Explorer selector"
          git push
