name: Apply first experience P0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply single hierarchy intervention
        shell: python
        run: |
          from pathlib import Path

          p = Path("inicio.html")
          s = p.read_text(encoding="utf-8")

          old = '.before{margin-top:18px;background:rgba(197,160,89,.035);border:1px solid rgba(197,160,89,.20);border-radius:18px;padding:14px;order:4}'
          new = '.before{margin-top:18px;background:rgba(197,160,89,.035);border:1px solid rgba(197,160,89,.20);border-radius:18px;padding:14px;order:9}'

          if old not in s:
              raise SystemExit("P0 aborted: expected .before rule not found; no change made")
          if s.count(old) != 1:
              raise SystemExit("P0 aborted: expected exactly one .before rule; no change made")

          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit intervention
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inicio.html
          git diff --cached --quiet && { echo "NO-OP: no change"; exit 0; }
          git commit -m "fix: demote secondary before-food route in first experience"
          git push
