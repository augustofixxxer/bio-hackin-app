name: Apply first-result hierarchy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply first-result hierarchy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen first result action hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inicio.html')
          s=p.read_text()
          old='.why{color:var(--accent)!important;font-weight:700;margin-top:7px!important}'
          new=old+'.result .card:first-child p:nth-of-type(3){margin-top:10px!important;padding:10px 11px;background:rgba(197,160,89,.08);border-left:3px solid var(--accent);border-radius:10px;color:var(--text)!important;font-size:12.5px!important}.result .card:first-child p:nth-of-type(4){padding:7px 10px;background:rgba(255,255,255,.025);border-radius:9px;font-size:12px!important}.result .card:first-child p:nth-of-type(5){color:var(--mint)!important;font-weight:700}'
          if s.count(old)!=1: raise SystemExit('target css not found exactly once')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inicio.html .github/workflows/apply-result-hierarchy.yml
          git commit -m 'fix: apply first-result hierarchy'
          git push
