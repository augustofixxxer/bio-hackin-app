name: Apply visual hierarchy
on:
  push:
    paths:
      - '.github/workflows/apply-visual-hierarchy.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-first hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('inicio.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '  .wrap { max-width:640px; margin:0 auto; padding:24px 18px 80px; }': '  .wrap { max-width:640px; margin:0 auto; padding:20px 15px 92px; display:flex; flex-direction:column; }',
            '  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:26px; }': '  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; order:0; }',
            '  .hero { margin-bottom:22px; }': '  .hero { margin-bottom:14px; order:1; }',
            '  .eyebrow { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:8px; }': '  .eyebrow { color:var(--accent); font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:7px; }',
            '  h1 { font-size:30px; line-height:1.12; margin:0 0 10px; }': '  h1 { font-size:29px; line-height:1.08; margin:0 0 8px; }',
            '  .hero p { color:var(--muted); line-height:1.55; margin:0; font-size:14px; }': '  .hero p { color:var(--muted); line-height:1.45; margin:0; font-size:13px; max-width:560px; }',
            '  .search { display:flex; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:13px 14px; box-shadow:0 12px 30px rgba(0,0,0,.22); }': '  .search { display:flex; gap:8px; background:var(--surface); border:1px solid rgba(197,160,89,.34); border-radius:17px; padding:10px 11px; box-shadow:0 10px 24px rgba(0,0,0,.18); order:2; }',
            '  .search button { border:0; border-radius:13px; background:var(--accent); color:#2a1d08; padding:9px 13px; font-weight:800; cursor:pointer; }': '  .search button { border:0; border-radius:12px; background:var(--accent); color:#2a1d08; padding:9px 12px; font-weight:800; cursor:pointer; }',
            '  .section-title { font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800; margin:26px 0 10px; }': '  .section-title { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:800; margin:16px 0 7px; order:6; }',
            '  .hooks { display:grid; gap:9px; }': '  .hooks { display:grid; gap:7px; order:7; }',
            '  .hook { width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:17px; padding:14px 15px; cursor:pointer; }': '  .hook { width:100%; text-align:left; background:transparent; border:1px solid rgba(255,255,255,.08); color:var(--text); border-radius:13px; padding:10px 12px; cursor:pointer; }',
            '  .hook strong { display:block; font-size:14px; margin-bottom:4px; }': '  .hook strong { display:block; font-size:12.5px; margin-bottom:2px; }',
            '  .hook span { color:var(--muted); font-size:12px; line-height:1.4; }': '  .hook span { color:var(--muted); font-size:10.5px; line-height:1.35; }',
            '  .chip { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer; }': '  .chip { border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:999px; padding:5px 9px; font-size:10px; font-weight:700; cursor:pointer; }',
            '  .before { margin-top:20px; background:linear-gradient(180deg,rgba(197,160,89,.12),rgba(197,160,89,.04)); border:1px solid rgba(197,160,89,.28); border-radius:22px; padding:17px; }': '  .before { margin-top:16px; background:linear-gradient(180deg,rgba(197,160,89,.10),rgba(197,160,89,.025)); border:1px solid rgba(197,160,89,.28); border-radius:19px; padding:14px; order:4; }',
            '  .before h2 { font-size:18px; margin:0 0 5px; }': '  .before h2 { font-size:16px; margin:0 0 4px; }',
            '  .before p { margin:0 0 13px; color:var(--muted); font-size:12.5px; line-height:1.5; }': '  .before p { margin:0 0 10px; color:var(--muted); font-size:11.5px; line-height:1.4; }',
            '  textarea { width:100%; min-height:78px; resize:vertical; background:rgba(0,0,0,.16); border:1px solid var(--border); border-radius:15px; color:var(--text); padding:12px; outline:0; }': '  textarea { width:100%; min-height:72px; resize:vertical; background:rgba(0,0,0,.14); border:1px solid var(--border); border-radius:13px; color:var(--text); padding:10px; outline:0; }',
            '  .primary { width:100%; margin-top:10px; border:0; border-radius:15px; padding:12px; background:var(--accent); color:#2a1d08; font-weight:800; cursor:pointer; }': '  .primary { width:100%; margin-top:8px; border:0; border-radius:13px; padding:11px; background:var(--accent); color:#2a1d08; font-weight:800; cursor:pointer; }',
            '  .secondary { width:100%; border:1px solid var(--border); border-radius:15px; padding:11px; background:transparent; color:var(--text); font-weight:700; cursor:pointer; }': '  .secondary { width:100%; border:1px solid var(--border); border-radius:13px; padding:10px; background:transparent; color:var(--text); font-weight:700; cursor:pointer; }',
            '  .result { margin-top:13px; display:grid; gap:9px; }': '  .result { margin-top:10px; display:grid; gap:8px; order:3; }',
            '  .card { background:var(--surface-2); border:1px solid var(--border); border-radius:17px; padding:14px; }': '  .card { background:var(--surface-2); border:1px solid var(--border); border-radius:15px; padding:12px; }',
            '  .card h3 { margin:0 0 7px; font-size:14px; }': '  .card h3 { margin:0 0 6px; font-size:13px; }',
            '  .card p { margin:0; color:var(--muted); font-size:12.5px; line-height:1.55; }': '  .card p { margin:0; color:var(--muted); font-size:11.5px; line-height:1.48; }',
            '  .why { color:var(--accent)!important; font-weight:700; margin-top:8px!important; }': '  .why { color:var(--accent)!important; font-weight:700; margin-top:7px!important; }',
            '  .empty { color:var(--muted); font-size:12.5px; line-height:1.5; padding:10px 2px; }': '  .empty { color:var(--muted); font-size:11.5px; line-height:1.45; padding:8px 2px; }',
            '  .tabs { position:fixed; left:0; right:0; bottom:0; background:rgba(15,23,21,.96); border-top:1px solid var(--border); backdrop-filter:blur(12px); display:flex; justify-content:center; z-index:10; }': '  .tabs { position:fixed; left:0; right:0; bottom:0; background:rgba(15,23,21,.97); border-top:1px solid var(--border); backdrop-filter:blur(12px); display:flex; justify-content:center; z-index:10; }',
            '  .tab { background:none; border:0; color:var(--muted); padding:11px 4px 12px; cursor:pointer; font-size:11px; font-weight:800; }': '  .tab { background:none; border:0; color:var(--muted); padding:10px 4px 11px; cursor:pointer; font-size:10px; font-weight:800; }',
            '  .tab small { display:block; font-size:9px; font-weight:500; margin-top:3px; color:var(--muted); }': '  .tab small { display:block; font-size:8px; font-weight:500; margin-top:2px; color:var(--muted); }',
            '  .notice { margin-top:12px; font-size:11px; color:var(--muted); line-height:1.45; }': '  .notice { margin-top:10px; font-size:10.5px; color:var(--muted); line-height:1.4; }',
            '  .saved { color:var(--mint); font-size:12px; margin-top:9px; }': '  .saved { color:var(--mint); font-size:11px; margin-top:8px; }',
            '  .premium { background:linear-gradient(180deg,rgba(143,168,155,.14),rgba(197,160,89,.08)); border:1px solid rgba(143,168,155,.24); border-radius:22px; padding:18px; }': '  .premium { background:linear-gradient(180deg,rgba(143,168,155,.12),rgba(197,160,89,.06)); border:1px solid rgba(143,168,155,.22); border-radius:19px; padding:15px; }',
            '  .premium h2 { margin:0 0 8px; font-size:19px; }': '  .premium h2 { margin:0 0 7px; font-size:17px; }',
            '  .premium p { margin:0 0 13px; color:var(--muted); font-size:12.5px; line-height:1.55; }': '  .premium p { margin:0 0 10px; color:var(--muted); font-size:11.5px; line-height:1.45; }',
            '  .pill { display:inline-block; border:1px solid rgba(197,160,89,.3); color:var(--accent); border-radius:999px; padding:5px 9px; font-size:10px; margin:3px 3px 0 0; }': '  .pill { display:inline-block; border:1px solid rgba(197,160,89,.26); color:var(--accent); border-radius:999px; padding:4px 8px; font-size:9px; margin:2px 2px 0 0; }',
            '  @media (max-width:420px){ h1{font-size:27px;} .wrap{padding-left:15px;padding-right:15px;} }': '  footer { margin-top:22px!important; padding-top:12px!important; order:20; }\n  @media (max-width:420px){ h1{font-size:26px;} .wrap{padding-left:13px;padding-right:13px;} .hero p{font-size:12.5px;} }'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected fragment: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit visual change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-visual-hierarchy.yml
          git add inicio.html .github/workflows/apply-visual-hierarchy.yml
          git commit -m 'Apply mobile-first visual hierarchy to Inicio'
          git push
