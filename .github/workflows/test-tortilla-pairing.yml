name: Test Tortilla Pairing Before After

on:
  workflow_dispatch:
  push:
    branches:
      - continuidad-pairing-before-after-v02
    paths:
      - ".github/workflows/test-tortilla-pairing.yml"

jobs:
  test-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Check Vercel Preview access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            echo "::error::Falta configurar el secreto VERCEL_PROTECTION_BYPASS en GitHub Actions. El Preview está protegido por Vercel SSO; el test no debe desactivar esa protección."
            exit 1
          fi

      - name: Test tortilla Before and After pairing
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bio-hackin-app-git-continuidad-pairin-312d44-bio-hackin-augusto.vercel.app/api/registrar-comida"
          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE" "$HEADER_FILE"' EXIT
          STATUS="$(curl --silent --show-error --max-time 30 -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            -H 'x-vercel-set-bypass-cookie: samesitenone' \
            -d '{"texto":"tortilla de papa","soloVista":true}')"
          echo "HTTP STATUS: $STATUS"
          echo "--- REDIRECT / RESPONSE DIAGNOSTICS ---"
          grep -iE '^(HTTP/|location:|server:|x-vercel-id:|x-vercel-error:|x-matched-path:)' "$HEADER_FILE" || true
          echo "--- RAW BODY START ---"
          cat "$BODY_FILE" || echo "BODY_FILE vacío"
          echo ""
          echo "--- RAW BODY END ---"
          echo "--- BODY HEXDUMP first 500 bytes ---"
          head -c 500 "$BODY_FILE" | od -c | head -20
          echo "--- Trying jq pretty ---"
          cat "$BODY_FILE" | jq . || echo "jq pretty falló - body no es JSON válido"
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "::error::Vercel sigue bloqueando el Preview (HTTP $STATUS). Verificá que el secreto sea el Protection Bypass Secret del proyecto correcto."
            exit 1
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::La API respondió HTTP $STATUS. Ver logs RAW BODY arriba."
            exit 1
          fi
          jq -e '.soloVista == true' "$BODY_FILE" >/dev/null
          jq -e '[.bloqueos[]? | select(.cuantitativo.before.clavePlato != null and .cuantitativo.after.clavePlato != null)] | length > 0' "$BODY_FILE" >/dev/null
          echo "PASS: tortilla pairing Before+After OK con soloVista:true"

      - name: Regression of seven previous dishes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bio-hackin-app-git-continuidad-pairin-312d44-bio-hackin-augusto.vercel.app/api/registrar-comida"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          for comida in milanesa hamburguesa pastas humita locro paella ravioles; do
            echo "Testing $comida..."
            STATUS="$(curl --silent --show-error --max-time 30 -o "$BODY_FILE" -w '%{http_code}' \
              -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
              -H 'x-vercel-set-bypass-cookie: samesitenone' \
              -d "{\"texto\":\"$comida\",\"soloVista\":true}")"
            cat "$BODY_FILE" | jq .
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "::error::Vercel bloqueó $comida (HTTP $STATUS)."
              exit 1
            fi
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              echo "::error::$comida respondió HTTP $STATUS."
              exit 1
            fi
            jq -e '.soloVista == true and (.bloqueos | type == "array")' "$BODY_FILE" >/dev/null
          done
          echo "PASS: las siete comidas respondieron sin persistencia."
