const { useState, useEffect, useRef } = React;

const TOKENS = {

  ink: "#101826", inkDim: "#5B6472",
  primary: "#1F4B6E", primarySoft: "#EAF0F5",
  alto: "#2F6F62", medio: "#9C7A2E", especulativo: "#7D8590",
};

const GOOGLE_CLIENT_ID = "521828227436-s3qcdgb7ivd9aaaqifm1c20nat8ntcj1.apps.googleusercontent.com";

// Helpers de localStorage (03/08/2026 — corrección de hallazgo real): varios accesos
// directos a localStorage en el archivo NO estaban protegidos con try/catch. En
// navegadores con storage bloqueado (modo privado con política estricta, extensiones de
// privacidad, storage deshabilitado por el usuario), localStorage.getItem/setItem puede
// lanzar SecurityError — y como alguno de esos accesos vive dentro de un inicializador de
// useState, un error ahí rompe el render inicial de React entero, no solo esa función.
// Se centralizan acá los tres accesos (get/set/remove) para que TODO el archivo pase por
// un único punto ya protegido, en vez de tener try/catch repetido y potencialmente
// olvidado en algún lugar nuevo a futuro.
function lsGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { console.warn("localStorage inaccesible (get):", e); return null; }
}
function lsSet(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { console.warn("localStorage inaccesible (set):", e); }
}
function lsRemove(key) {
  try { window.localStorage.removeItem(key); } catch (e) { console.warn("localStorage inaccesible (remove):", e); }
}

// Fase 2/P0 (Marketing, 15/08/2026) — instrumentación de funnel de producto.
// Reutiliza /api/data (POST) en vez de crear un endpoint nuevo — Resolución del Fundador.
// Regla crítica: NUNCA bloquea ni condiciona el flujo funcional. No se espera (no await
// en el punto de uso), y cualquier fallo de red se descarta en silencio — un evento de
// analytics perdido nunca debe impedir una navegación, un click o un registro real.
function logEventoProducto(evento, contexto, metadata, pase) {
  try {
    fetch("/api/data", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(pase ? { Authorization: `Bearer ${pase}` } : {}) },
      body: JSON.stringify({ evento, contexto, metadata }),
    }).catch(() => {});
  } catch (e) {
    // Silencioso a propósito.
  }
}

const EVIDENCE_STYLES = {
  Alto: { color: TOKENS.alto, label: "Evidencia alta" },
  Medio: { color: TOKENS.medio, label: "Evidencia media" },
  Especulativo: { color: TOKENS.especulativo, label: "Especulativo" },
};

const CATEGORY_ICONS = {
  "Energía Sostenida en el Día": "⚡",
  "Ritmo Diario y Descanso": "🌿",
  "Bienestar Digestivo y Cocina Casera": "🌾",
  "Bienestar a Largo Plazo": "⏳",

  "perdida de peso y definición": "📉",

  "Foco y Concentración": "🎯",
  "Hábitos y Rutinas": "🕯️",
  "Sin categorizar (pendiente)": "❔",
};

function CategoryIcon({ name }) {
  const icon = CATEGORY_ICONS[name] || "•";
  return (
    <span style={{
      width: 36, height: 36, borderRadius: 8, background: TOKENS.primarySoft,
      display: "inline-flex", alignItems: "center", justifyContent: "center",
      fontSize: 17, flexShrink: 0,
    }}>{icon}</span>

}

function EvidenceStamp({ level }) {
  if (!level) return null;
  const style = EVIDENCE_STYLES[level] || { color: TOKENS.inkDim, label: level };
  return (
    <div style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      background: style.color + "14", borderRadius: 999,
      padding: "4px 10px 4px 8px", whiteSpace: "nowrap",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: style.color, flexShrink: 0 }} />
      <span style={{
        fontFamily: "'IBM Plex Mono', monospace", fontSize: "10.5px",
        letterSpacing: "0.03em", color: style.color, fontWeight: 500,
      }}>{style.label}</span>
    </div>
  );
}

function groupByCategoria(entradas) {
  const grupos = {};
  entradas.forEach((e) => {
    let claves = e.categorias && e.categorias.length ? e.categorias : null;
    if (!claves) {
      claves = [e.tipo === "protocolo" ? "Hábitos y Rutinas" : "Sin categorizar (pendiente)"];
    }
    claves.forEach((cat) => {
      if (!grupos[cat]) grupos[cat] = [];
      grupos[cat].push(e);
    });
  });
  return grupos;
}

function BloqueoCard({ b, pase, tieneCondicionMedica, onVerPremium }) {
  const requiereConsentimiento = b.nivelRiesgo && b.nivelRiesgo !== "Bajo";
  const [confirmado, setConfirmado] = useState(!requiereConsentimiento);
  const [enviando, setEnviando] = useState(false);

  // Fase 2/P0, Bloque 2 (15/08/2026) — hack_visto: punto real y definitivo, cuando el
  // usuario efectivamente ve la solución (no antes, si todavía falta confirmar riesgo).
  useEffect(() => {
    if (confirmado && b.solucion) {
      logEventoProducto("hack_visto", "bloqueo_card", { combinacion: b.combinacion, solucion: b.solucion.nombre || null }, pase);
    }
  }, [confirmado, b.solucion, b.combinacion]);

  async function confirmarRiesgo() {
    setEnviando(true);
    try {
      await fetch("/api/registrar-extra?tipo=consentimiento-riesgo", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ bloqueo: b.combinacion, nivelRiesgo: b.nivelRiesgo }),
      });
    } catch (e) {
      // no bloqueamos al usuario si falla el log; solo lo dejamos avanzar
    } finally {
      setEnviando(false);
      setConfirmado(true);
    }
  }

  return (
    <div style={{
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
      borderRadius: 20, padding: 18, boxShadow: EXPLORADOR_TOKENS.cardShadow,
    }}>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 15, fontWeight: 700, marginBottom: 8 }}>{b.combinacion}</p>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13, lineHeight: 1.6, marginBottom: (b.solucion || b.invitacionPremium) ? 12 : 0 }}>{b.resultado}</p>

      {!confirmado && (
        <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 12 }}>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.55, marginBottom: 10 }}>
            ⚠️ Este patrón tiene nivel de riesgo <b>{b.nivelRiesgo}</b>: implica más variabilidad individual, o mayor cuidado si aplica en tu caso.
            {tieneCondicionMedica && " Marcaste que tenés una condición médica preexistente — consultá con tu profesional antes de aplicar cualquier sugerencia."}
          </p>
          <button onClick={confirmarRiesgo} disabled={enviando} className={enviando ? "" : "glass-press"} style={{
            width: "100%", padding: "11px", borderRadius: 14, fontWeight: 800, fontSize: 13, cursor: enviando ? "default" : "pointer",
            fontFamily: EXPLORADOR_TOKENS.font, color: "#2A1D08",
            background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
            borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
            borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
            boxShadow: "0 6px 14px -3px rgba(0,0,0,0.55)",
          }}>
            {enviando ? "..." : "Entiendo, ver la sugerencia"}
          </button>
        </div>
      )}

      {confirmado && b.solucion && (
        <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 12 }}>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 10, color: EXPLORADOR_TOKENS.accent, marginBottom: 4, letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 700 }}>🔧 Hack</p>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 13, lineHeight: 1.6, marginBottom: 10 }}>{b.solucion.adaptacion}</p>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: EXPLORADOR_TOKENS.textSecondary, lineHeight: 1.55, marginBottom: 4 }}>
            <b style={{ color: EXPLORADOR_TOKENS.textPrimary }}>Probá:</b> la próxima vez que se repita esta situación, aplicá este cambio.
          </p>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: EXPLORADOR_TOKENS.textSecondary, lineHeight: 1.55 }}>
            <b style={{ color: EXPLORADOR_TOKENS.textPrimary }}>Observá:</b> cómo te sentís después. Con suficientes registros vas a poder ver si se repite un patrón.
          </p>
        </div>
      )}

      {confirmado && !b.solucion && b.invitacionPremium && (
        <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 12, marginTop: 4 }}>
          <div style={{ background: "rgba(197,160,89,0.12)", border: `1px solid rgba(197,160,89,0.3)`, borderRadius: 14, padding: "12px 14px" }}>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 12.5, fontWeight: 700, lineHeight: 1.6, margin: "0 0 6px" }}>
              Para esta situación existe una segunda capa de experimentación.
            </p>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 12, lineHeight: 1.55, margin: "0 0 10px" }}>
              {b.invitacionPremium}
            </p>
            <button onClick={() => onVerPremium && onVerPremium()} className="glass-press" style={{
              padding: "8px 16px", borderRadius: 12, fontWeight: 800, fontSize: 11.5, cursor: "pointer",
              fontFamily: EXPLORADOR_TOKENS.font, color: "#2A1D08", textTransform: "uppercase", letterSpacing: "0.02em",
              background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
              borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
              borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
            }}>
              Ver en Premium
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function LogMealScreen({ onBack, pase, tieneCondicionMedica, onIrABienestar, onVerPremium }) {
  const [texto, setTexto] = useState("");
  const [momento, setMomento] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);
  // Cierre de loop Comida -> Bienestar (05/08/2026): progreso pedido al mismo endpoint
  // extendido que ya usa TableroAccesos/Mis Patrones — sin IA, sin endpoint nuevo.
  const [progreso, setProgreso] = useState(null);

  const enviar = async () => {
    if (!texto.trim()) return;
    setEnviando(true);
    setError(null);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto, momento: momento || undefined }),
      });
      const data = await resp.json();
      if (data.error) {
        if (data.requiereTerminos) {
          lsRemove("reseteo_terminos_v1");
          window.location.reload();
          return;
        }
        throw new Error(data.error);
      }
      setResultado(data);
      // La comida ya quedó guardada en Supabase en el paso anterior — este fetch la cuenta.
      fetch("/api/patrones-observacionales", { headers: { Authorization: `Bearer ${pase || ""}` } })
        .then((r) => r.json())
        .then((d) => setProgreso({ comidasHoy: d.hoy?.comidasHoy ?? 1, totalRegistros: d.totalRegistros ?? 0 }))
        .catch(() => setProgreso({ comidasHoy: 1, totalRegistros: 0 }));
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  };

  if (resultado) {
    const bloqueos = resultado.bloqueos || [];
    const resueltos = resultado.resueltos || [];
    const sugerencias = resultado.sugerencias || [];
    return (
      <div className="fade-in">
        <button onClick={onBack} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>
          ← Categorías
        </button>
        <h2 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 21, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 16, letterSpacing: "-0.01em" }}>
          {bloqueos.length > 0
            ? "Esto vale la pena mirarlo"
            : resueltos.length > 0
            ? "Buena elección"
            : "Bien ahí, sin nada para ajustar"}
        </h2>
        {bloqueos.length === 0 && resueltos.length === 0 && sugerencias.length === 0 && (
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 14, lineHeight: 1.6 }}>No encontramos nada que valga la pena señalarte en lo que registraste. Igual quedó guardado en tu historial.</p>
        )}
        {resueltos.length > 0 && (
          <div style={{ display: "grid", gap: 12, marginBottom: bloqueos.length ? 16 : 0 }}>
            {resueltos.map((r, i) => (
              <div key={"resuelto-" + i} style={{
                background: "rgba(143,168,155,0.12)", border: `1px solid rgba(143,168,155,0.4)`,
                borderRadius: 18, padding: 18, boxShadow: EXPLORADOR_TOKENS.cardShadow,
              }}>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.menta, fontSize: 11, fontWeight: 800, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>✓ Hackeo ya aplicado</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{r.combinacion}</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13, lineHeight: 1.6 }}>{r.mensaje}</p>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "grid", gap: 12 }}>
          {bloqueos.map((b, i) => (
            <BloqueoCard key={i} b={b} pase={pase} tieneCondicionMedica={tieneCondicionMedica} onVerPremium={onVerPremium} />
          ))}
        </div>
        {sugerencias.length > 0 && (
          <div style={{ display: "grid", gap: 12, marginTop: bloqueos.length ? 16 : 0 }}>
            {sugerencias.map((s, i) => (
              <div key={"sugerencia-" + i} style={{
                background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
                backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
                borderRadius: 18, padding: 18, boxShadow: EXPLORADOR_TOKENS.cardShadow,
              }}>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.accent, fontSize: 11, fontWeight: 800, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>💡 Tip relacionado</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{s.nombre}</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13, lineHeight: 1.6 }}>{s.mecanismo}</p>
              </div>
            ))}
          </div>
        )}
        {/* Cierre de loop Comida -> Bienestar (05/08/2026, especificación Marketing):
            reemplaza el botón "Registrar otra comida" — el siguiente paso natural ahora es
            invitar a cerrar el círculo con Bienestar, no simplemente resetear el formulario.
            NOTA sobre "faltan X": el prompt pedía "3 - totalBienestarHistorico" (solo
            bienestar). Uso en cambio la MISMA cuenta combinada (comida+bienestar) que ya
            gatea el Estado A/B en Mis Patrones — la propia instrucción habilitaba esto
            ("si ya tenés lógica, usar esa"). Con la fórmula bienestar-only el número mostrado
            acá podía no coincidir con cuándo el usuario realmente desbloquea su primer
            patrón, mostrando una cuenta regresiva incorrecta. */}
        {progreso && (
          <div className="celebrar" style={{
            marginTop: 20, padding: "22px 20px", borderRadius: 24, textAlign: "center",
            background: "linear-gradient(180deg, rgba(197,160,89,0.18) 0%, rgba(197,160,89,0.06) 100%)",
            ...EXPLORADOR_TOKENS.cardBevel,
            backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
            boxShadow: EXPLORADOR_TOKENS.cardShadow,
          }}>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 17, color: EXPLORADOR_TOKENS.textPrimary, margin: "0 0 8px", letterSpacing: "-0.01em" }}>
              ¡Comida registrada! Hoy llevás {progreso.comidasHoy} {progreso.comidasHoy === 1 ? "comida" : "comidas"}
            </p>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: "rgba(242,239,233,0.85)", margin: "0 0 6px", lineHeight: 1.5 }}>
              ¿Querés cerrar el círculo? Registrar cómo te sentís ahora nos da tu Patrón #1 más rápido.
            </p>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, color: EXPLORADOR_TOKENS.textSecondary, margin: "0 0 18px" }}>
              {Math.max(0, 3 - progreso.totalRegistros) > 0
                ? `Te faltan ${Math.max(0, 3 - progreso.totalRegistros)} registros para tu primer patrón.`
                : "Ya tenés suficientes registros para tu primer patrón."}
            </p>
            <button onClick={() => { if (navigator.vibrate) navigator.vibrate(12); onIrABienestar && onIrABienestar(); }} className="glass-press" style={{
              width: "100%", padding: "15px", borderRadius: 18, cursor: "pointer", marginBottom: 10,
              fontWeight: 800, fontSize: 14, fontFamily: EXPLORADOR_TOKENS.font, textTransform: "uppercase", letterSpacing: "0.02em",
              color: "#2A1D08",
              background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
              borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",

function LoginScreen({ onLogin }) {
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);

  async function handleCredentialResponse(response) {
    setCargando(true);
    setError(null);
    try {
      const resp = await fetch("/api/login-google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      lsSet("reseteo_usuario", JSON.stringify(data));
      onLogin(data);
    } catch (e) {
      setError(String(e.message || e));
      setCargando(false);
    }
  }

  useEffect(() => {
    let cancelado = false;
    function intentarRenderizar() {
      if (cancelado) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(intentarRenderizar, 200);
        return;
      }
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      window.google.accounts.id.renderButton(
        document.getElementById("google-signin-button"),
        { theme: "outline", size: "large", width: 280, text: "signin_with" }
      );
    }
    intentarRenderizar();
    return () => { cancelado = true; };
  }, []);

  return (
    <div style={{ minHeight: "100vh", background: TOKENS.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ maxWidth: 340, textAlign: "center" }}>
        <h1 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 26, color: TOKENS.ink, marginBottom: 10, letterSpacing: "-0.02em" }}>
          Reseteo Propio
        </h1>
        <p style={{ color: TOKENS.inkDim, fontSize: 13.5, marginBottom: 28, lineHeight: 1.5 }}>
          Te mostramos el mapa. El camino, lo elegís vos.
        </p>
        <div id="google-signin-button" style={{ display: "flex", justifyContent: "center" }}></div>
        {cargando && <p style={{ color: TOKENS.inkDim, fontSize: 13, marginTop: 16 }}>Ingresando...</p>}
        {error && <p style={{ color: "#B3453D", fontSize: 13, marginTop: 16 }}>{error}</p>}
      </div>
    </div>
  );
}

// Tablero de accesos (30/07/2026): agrupa comida + bienestar (que ya cubre sueño,
// hidratación y actividad física) en UN solo lugar visual — no un botón suelto por cada
// cosa, ni un formulario que obligue a cargar las cuatro juntas. Cada acceso sigue siendo
// independiente puertas adentro (LogMealScreen / BienestarScreen), esto es solo la puerta
// de entrada común.
function PlanificarPanel({ pase, onVerMisPatrones, onVerPremium, prefillTexto, onPrefillConsumido }) {
  const [texto, setTexto] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);

  async function ver(textoAUsar) {
    const t = textoAUsar ?? texto;
    if (!t.trim()) return;
    setEnviando(true);
    setError(null);
    setResultado(null);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto: t, soloVista: true }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      setResultado(data);
      // Fase 2/P0, Bloque 2 — hack_visto: se ve al mismo tiempo que el resultado, acá
      // (no hace falta un useEffect aparte porque no depende del ciclo de montaje).
      (data.bloqueos || []).forEach((b) => {
        if (b.solucion) {
          logEventoProducto("hack_visto", "planificar_panel", { combinacion: b.combinacion, solucion: b.solucion.nombre || null }, pase);
        }
      });
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  }

  // Checkpoint 3A (19/08/2026) — cierra el agujero detectado: antes, la "conexión clase
  // A" desde el Explorador terminaba en una frase sin destino. Ahora, si llega con texto
  // precargado (desde EntryDetalleFase2), lo carga y corre el motor real una sola vez —
  // reutiliza el mismo endpoint/lógica que ya usa esta pantalla, sin tocar el matching.
  useEffect(() => {
    if (prefillTexto) {
      setTexto(prefillTexto);
      ver(prefillTexto);
      onPrefillConsumido && onPrefillConsumido();
    }
    // eslint-disable-next-line
  }, [prefillTexto]);

  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }
  const activo = texto.trim() && !enviando;

  return (
    <div style={{
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
      borderRadius: 20, padding: 16, marginTop: 10, boxShadow: EXPLORADOR_TOKENS.cardShadow,
    }} className="fade-in">
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textSecondary, marginBottom: 10, lineHeight: 1.5 }}>
        Escribí lo que estás por comer — esto NO se guarda en tu historial, es solo para que decidas con más info.
      </p>
      <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={2} placeholder="Ej: milanesa con papas fritas"
        style={{
          width: "100%", border: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, borderRadius: 14, padding: 10,
          background: "rgba(255,255,255,0.06)", color: EXPLORADOR_TOKENS.textPrimary,
          fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 10, resize: "vertical", outline: "none",
        }} />
      <button onClick={() => { vibrar(); ver(); }} disabled={!activo} className={activo ? "glass-press" : ""} style={{
        borderRadius: 14, padding: "10px 18px", fontWeight: 800, fontSize: 12.5, cursor: activo ? "pointer" : "not-allowed",
        fontFamily: EXPLORADOR_TOKENS.font, textTransform: "uppercase", letterSpacing: "0.02em",
        color: activo ? "#2A1D08" : "rgba(242,239,233,0.4)",
        background: activo ? `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)` : "rgba(255,255,255,0.08)",
        borderTop: activo ? "1.5px solid rgba(255,255,255,0.6)" : "1px solid rgba(255,255,255,0.1)",
        borderLeft: activo ? "1.5px solid rgba(255,255,255,0.35)" : "1px solid rgba(255,255,255,0.1)",
        borderRight: activo ? "1.5px solid rgba(120,85,20,0.5)" : "1px solid rgba(255,255,255,0.1)",
        borderBottom: activo ? "2.5px solid rgba(90,60,10,0.6)" : "1px solid rgba(255,255,255,0.1)",
        boxShadow: activo ? "0 8px 18px -4px rgba(0,0,0,0.6)" : "none",
      }}>
        {enviando ? "..." : "Ver antes de comer"}
      </button>

      {error && <p style={{ color: "#F0958A", fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, marginTop: 12 }}>{error}</p>}

      {resultado && (
        <div style={{ marginTop: 14, borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 14 }}>
          {resultado.bloqueos.length === 0 ? (
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, color: EXPLORADOR_TOKENS.textPrimary, fontWeight: 700 }}>Bien ahí, sin nada para ajustar.</p>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {resultado.bloqueos.map((b, i) => (
                <div key={i} style={{
                  background: "rgba(255,255,255,0.04)", border: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`,
                  borderRadius: 14, padding: 12,
                }}>
                  <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, fontWeight: 700, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 4 }}>{b.combinacion}</p>
                  <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textSecondary, lineHeight: 1.5, marginBottom: (b.solucion || b.invitacionPremium) ? 8 : 0 }}>{b.resultado}</p>

                  {/* Reciprocidad, no castigo (04/08/2026): siempre se muestra un hack real
                      cuando existe — nunca solo el problema sin salida. Capa Hack/Probá/
                      Observá agregada en Bloque 2 (15/08/2026) sobre la misma solución. */}
                  {b.solucion && (
                    <div style={{ background: "rgba(197,160,89,0.12)", border: `1px solid rgba(197,160,89,0.3)`, borderRadius: 12, padding: "10px 12px" }}>
                      <p style={{ color: EXPLORADOR_TOKENS.textPrimary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, lineHeight: 1.5, margin: "0 0 6px", fontWeight: 700 }}>
                        🔧 Hack: {b.solucion.adaptacion}
                      </p>
                      <p style={{ color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, lineHeight: 1.5, margin: "0 0 3px" }}>
                        <b style={{ color: EXPLORADOR_TOKENS.textPrimary }}>Probá:</b> aplicalo cuando lo prepares.
                      </p>
                      <p style={{ color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, lineHeight: 1.5, margin: 0 }}>
                        <b style={{ color: EXPLORADOR_TOKENS.textPrimary }}>Observá:</b> cuando lo registres de verdad, vas a poder ver cómo te sentiste.
                      </p>
                    </div>
                  )}

                  {/* Ajuste comercial Bloque 5 (15/08/2026): antes salía a "Mis Patrones";
                      ahora conduce al punto de conversión Premium real, con explicación
                      contextual antes — mismo dato (b.invitacionPremium), sin infraestructura
                      nueva. Copy evita "más información/datos": se comunica como una segunda
                      capa de experimentación ligada a esta situación puntual. */}
                  {!b.solucion && b.invitacionPremium && (
                    <div>
                      <div style={{ background: "rgba(197,160,89,0.12)", border: `1px solid rgba(197,160,89,0.3)`, borderRadius: 12, padding: "10px 12px", marginBottom: 8 }}>
                        <p style={{ color: EXPLORADOR_TOKENS.textPrimary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, lineHeight: 1.5, margin: "0 0 6px" }}>
                          💡 Hack 1 gratis: probá reducir la porción y sumar algo fresco al lado.
                        </p>
                        <p style={{ color: EXPLORADOR_TOKENS.textPrimary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, fontWeight: 700, lineHeight: 1.5, margin: "10px 0 4px" }}>
                          Para esta situación existe una segunda capa de experimentación.
                        </p>
                        <p style={{ color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, lineHeight: 1.5, margin: "0 0 8px" }}>
                          Vinculada a tus propios registros, no a un consejo genérico.
                        </p>
                        <p style={{ color: EXPLORADOR_TOKENS.textPrimary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, lineHeight: 1.5, margin: 0, filter: "blur(4px)", userSelect: "none" }}>
                          {b.invitacionPremium}
                        </p>
                      </div>
                      <button onClick={() => { vibrar(); onVerPremium && onVerPremium(); }} style={{
                        background: "none", border: "none", padding: 0, cursor: "pointer",
                        color: EXPLORADOR_TOKENS.accent, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, fontWeight: 700, textDecoration: "underline",
                      }}>
                        Ver en Premium →
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 10.5, textAlign: "center", lineHeight: 1.5, marginTop: 14 }}>
            Info observacional. No es consejo médico.
          </p>
        </div>
      )}
    </div>
  );

// PESTAÑA 1 (EXPLORADOR) — GLASSMORPHISM 3D BIO-HACKING (03/08/2026)
// Paleta y tokens aprobados por Augusto para esta pestaña únicamente. Deliberadamente
// NO se tocan los TOKENS globales de arriba — esta paleta oscura queda acotada a los
// componentes de Explorador (TableroAccesos, BarraBusqueda, ExploradorScreen,
// TarjetaCategoria) para no afectar Bienestar/Mis Patrones/Carga de comida, que siguen
// con el diseño claro hasta que se aprueben pestaña por pestaña.
//
// NOTA TÉCNICA (declarada por regla de cambios del DMC-D): el prompt de diseño sugería
// Lucide Icons cargados en runtime (lucide.createIcons() sobre el DOM). Se reemplazó por
// componentes SVG propios, inline, porque esta es una app React real con re-renders
// frecuentes (togglear un acordeón, tocar "Leer más", etc.) — una librería que inyecta
// SVG directo al DOM por fuera de React se pisa con la reconciliación de React en cada
// re-render, dando el mismo tipo de fragilidad que el incidente de Sprint 16. El
// resultado visual es equivalente; el riesgo de producción, cero.
// ============================================================
const EXPLORADOR_TOKENS = {
  bg: "radial-gradient(ellipse 90% 50% at 20% 100%, rgba(197,160,89,0.18), transparent 60%), linear-gradient(180deg, #182923 0%, #0F1A16 100%)",

// Dial semicircular 3D (03/08/2026, especificación técnica aprobada): reemplaza los 5
// botones cuadrados por un selector parabólico con perilla metálica bronce central.
// Estado inactivo: números en tono gris/bronce apagado. Estado activo: el segmento
// (arco + número) se ilumina en verde menta neón (#8FA89B) con resplandor interno. La
// perilla central (readout) se mantiene bronce metálica siempre, muestre o no selección.
function EscalaBienestar({ etiqueta, valor, onChange }) {
  const cx = 120, cy = 108, r = 88;
  const angleFor = (v) => 180 - ((v - 1) / 4) * 180;
  const pointAt = (deg) => {
    const rad = (deg * Math.PI) / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  };
  const start = pointAt(180);
  const end = pointAt(0);
  const trackPath = `M ${start.x} ${start.y} A ${r} ${r} 0 0 1 ${end.x} ${end.y}`;
  const progresoPath = valor
    ? `M ${start.x} ${start.y} A ${r} ${r} 0 0 1 ${pointAt(angleFor(valor)).x} ${pointAt(angleFor(valor)).y}`
    : null;
  const puntaAguja = valor ? (() => {
    const rad = (angleFor(valor) * Math.PI) / 180;
    const largoAguja = r - 22;
    return { x: cx + largoAguja * Math.cos(rad), y: cy - largoAguja * Math.sin(rad) };
  })() : null;

  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }

  return (
    <div style={{
      marginBottom: 16, padding: "18px 16px 12px", borderRadius: 24,
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
      boxShadow: EXPLORADOR_TOKENS.cardShadow,
    }}>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, fontWeight: 700, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 4, textAlign: "center" }}>
        {etiqueta}
      </p>
      <div style={{ position: "relative", width: "100%", maxWidth: 260, margin: "0 auto" }}>
        <svg viewBox="0 0 240 130" style={{ width: "100%", display: "block", aspectRatio: "240 / 130" }}>
          <path d={trackPath} fill="none" stroke="rgba(255,255,255,0.10)" strokeWidth="13" strokeLinecap="round" />
          {progresoPath && (
            <path d={progresoPath} fill="none" stroke={EXPLORADOR_TOKENS.menta} strokeWidth="13" strokeLinecap="round"
              style={{ filter: `drop-shadow(0 0 6px rgba(143,168,155,0.4))` }} />
          )}
          {puntaAguja && (
            <g style={{ filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.5))" }}>
              <line x1={cx} y1={cy} x2={puntaAguja.x} y2={puntaAguja.y} stroke="#C5A059" strokeWidth="4" strokeLinecap="round" />
              <circle cx={cx} cy={cy} r="7" fill="#C5A059" stroke="#F2EFE9" strokeWidth="1.5" />
            </g>
          )}
        </svg>
        {[1, 2, 3, 4, 5].map((n) => {
          const p = pointAt(angleFor(n));
          const activo = valor === n;
          return (
            <button key={n} onClick={() => { vibrar(); onChange(activo ? null : n); }} className="glass-press" style={{
              position: "absolute", left: `${(p.x / 240) * 100}%`, top: `${(p.y / 130) * 100}%`,
              transform: "translate(-50%, -50%)", width: 26, height: 26, borderRadius: "50%",
              border: "none", cursor: "pointer",
              background: activo ? EXPLORADOR_TOKENS.menta : "transparent",
              boxShadow: activo ? "0 0 10px 2px rgba(143,168,155,0.4)" : "none",
              color: activo ? "#0F1A16" : "rgba(197,160,89,0.55)",
              fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 700, fontSize: 12,
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>{n}</button>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "center", marginTop: -32, marginBottom: 6 }}>
        <div style={{
          width: 54, height: 54, borderRadius: "50%", position: "relative", zIndex: 2,
          background: `radial-gradient(circle at 32% 28%, rgba(255,240,210,0.9), rgba(197,160,89,0.55) 35%, rgba(197,160,89,0.12) 75%)`,
          borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
          borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 21, color: "#2A1D08",
          boxShadow: "0 6px 14px rgba(0,0,0,0.5)",
        }}>{valor ?? "–"}</div>
      </div>
    </div>
  );
}

    fetch("/api/patrones-observacionales", { headers: { Authorization: `Bearer ${pase || ""}` } })
      .then((r) => r.json())
      .then((d) => setTotalRegistros(typeof d.totalRegistros === "number" ? d.totalRegistros : 0))
      .catch(() => setTotalRegistros(0));
  }, []);

  // N = campos del formulario actual con dato cargado (0 a 5) — distinto de totalRegistros
  // (que cuenta registros guardados en otros días). Nunca exige todos los 5: alcanza con 1.
  const campos = [energia, digestion, sueno, hidratacion, actividadFisica];
  const n = campos.filter(Boolean).length;
  const pctFormulario = n * 20;

  function pctLaboratorio(total) {
    return Math.min(100, Math.round(((total || 0) / 3) * 100));
  }

  async function enviar() {
    if (n === 0) return; // botón nunca se deshabilita visualmente, pero sin datos no hay nada que guardar
    setEnviando(true);
    setError(null);
    setResultado(null);
    const prevTotal = totalRegistros || 0;
    try {
      const resp = await fetch("/api/registrar-bienestar", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({
          energia: energia || undefined,
          digestion: digestion || undefined,
          sueno: sueno || undefined,
          hidratacion: hidratacion || undefined,
          actividad_fisica: actividadFisica || undefined,
        }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "Error al guardar");
      const nuevoTotal = prevTotal + 1;
      setTotalRegistros(nuevoTotal);
      setResultado({ n, prevPct: pctLaboratorio(prevTotal), nuevoPct: pctLaboratorio(nuevoTotal), faltan: Math.max(0, 3 - nuevoTotal) });
      // Fase 2/P0, Bloque 3 (15/08/2026) — feedback_realizado: registrar "cómo te sentís"
      // es, en el circuito de P0, el paso de feedback posterior a la comida.
      logEventoProducto("feedback_realizado", "bienestar_screen", { n, nuevoTotal }, pase);

      // Hallazgo A: consulta al motor real. No bloquea el guardado (ya terminó arriba) ni
      // condiciona el flujo principal — solo decide qué mensaje/CTA de continuidad mostrar.
      setPatronReal(null);
      fetch("/api/generar-insights", { headers: { Authorization: `Bearer ${pase || ""}` } })
        .then((r) => r.json())
        .then((d) => setPatronReal({
          disponible: Boolean(d.estado) && d.estado !== "insuficiente",
          diasRegistrados: typeof d.diasRegistrados === "number" ? d.diasRegistrados : null,
        }))
        .catch(() => setPatronReal({ disponible: false, diasRegistrados: null }));

      setEnergia(null);
      setDigestion(null);
      setSueno(null);
      setHidratacion(null);
      setActividadFisica(null);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  }

  return (
    <div className="fade-in">
      <button onClick={onBack} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>
        ← Categorías
      </button>

      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: "rgba(242,239,233,0.85)", marginBottom: 14, lineHeight: 1.55 }}>
        Cada dato afina tu laboratorio. Con 1 ya sirve. Hoy llevás {n}/5.
      </p>

      {/* Barra de progreso del formulario actual (0-100%, 20% por campo cargado) */}
      <div style={{ marginBottom: 20 }}>
        <div style={{ width: "100%", height: 8, borderRadius: 999, overflow: "hidden", background: "rgba(255,255,255,0.12)", marginBottom: 6 }}>
          <div style={{ width: `${pctFormulario}%`, height: "100%", background: EXPLORADOR_TOKENS.menta, boxShadow: pctFormulario > 0 ? "0 0 8px rgba(143,168,155,0.5)" : "none", transition: "width 0.25s ease" }} />
        </div>
        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.textSecondary, letterSpacing: "0.03em", margin: 0 }}>
          {n}/5 datos de hoy
        </p>
      </div>

      <EscalaBienestar etiqueta="Energía (1 = muy baja · 5 = muy alta)" valor={energia} onChange={setEnergia} />
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.textSecondary, textAlign: "center", marginTop: -10, marginBottom: 16 }}>
        Tocá para elegir 1 a 5
      </p>
      <EscalaBienestar etiqueta="Digestión (1 = muy mala · 5 = muy buena)" valor={digestion} onChange={setDigestion} />
      <SelectorCategoria etiqueta="Horas de sueño anoche" opciones={OPCIONES_SUENO} valor={sueno} onChange={setSueno} />
      <SelectorCategoria etiqueta="Agua que tomaste hoy (sin contar gaseosas, café, alcohol)" opciones={OPCIONES_HIDRATACION} valor={hidratacion} onChange={setHidratacion} />
      <SelectorCategoria etiqueta="Actividad física esta semana" opciones={OPCIONES_ACTIVIDAD} valor={actividadFisica} onChange={setActividadFisica} />

      {/* Botón guardar (04/08/2026, fix crítico de Marketing/UX): NUNCA se deshabilita ni
          se pone gris — eso empujaba a completar los 5 campos para "desbloquear" el botón,
          exactamente lo contrario de lo que queremos (1 solo dato ya es útil y guardable).
          Con 0 campos, el botón sigue dorado pero el texto invita a elegir uno; el clic no
          dispara guardado vacío (no hay endpoint que llamar sin datos). */}
      <button
        onClick={() => { if (n > 0 && !enviando) { if (navigator.vibrate) navigator.vibrate(12); enviar(); } }}
        className={n > 0 && !enviando ? "glass-press" : ""}
        style={{
          width: "100%", padding: "17px 0", borderRadius: 20, cursor: n > 0 ? "pointer" : "default",
          fontWeight: 800, fontSize: 16, marginTop: 10, fontFamily: EXPLORADOR_TOKENS.font,
          textTransform: "uppercase", letterSpacing: "0.04em",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          color: "#2A1D08",
          background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
          borderTop: "2px solid rgba(255,255,255,0.65)", borderLeft: "2px solid rgba(255,255,255,0.4)",
          borderRight: "2px solid rgba(120,85,20,0.55)", borderBottom: "3px solid rgba(90,60,10,0.65)",
          boxShadow: "0 14px 28px -6px rgba(0,0,0,0.65)",
        }}
      >
        {n > 0 && <IconoGuardar size={19} />}
        {enviando ? "Guardando..." : n === 0 ? "Elegí al menos 1 dato" : `Guardar registro - ${n}/5`}
      </button>

      {resultado && (
        <div className="celebrar" style={{
          marginTop: 18, padding: "22px 20px", borderRadius: 24, textAlign: "center",
          background: "linear-gradient(180deg, rgba(197,160,89,0.18) 0%, rgba(197,160,89,0.06) 100%)",
          ...EXPLORADOR_TOKENS.cardBevel,
          backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
          boxShadow: EXPLORADOR_TOKENS.cardShadow,
        }}>
          <div className="brillo-suave" style={{
            width: 64, height: 64, borderRadius: "50%", margin: "0 auto 14px",
            background: `radial-gradient(circle at 32% 28%, rgba(255,240,210,0.95), rgba(197,160,89,0.7) 45%, rgba(197,160,89,0.2) 80%)`,
            borderTop: "2px solid rgba(255,255,255,0.65)", borderLeft: "2px solid rgba(255,255,255,0.4)",
            borderRight: "2px solid rgba(120,85,20,0.55)", borderBottom: "3px solid rgba(90,60,10,0.65)",
            display: "flex", alignItems: "center", justifyContent: "center", color: "#2A1D08",
          }}>
            <IconoGuardar size={30} />
          </div>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 18, color: EXPLORADOR_TOKENS.textPrimary, margin: "0 0 6px", letterSpacing: "-0.01em" }}>
            ¡Dato guardado! {resultado.n}/5
          </p>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: "rgba(242,239,233,0.85)", margin: "0 0 12px", lineHeight: 1.5 }}>
            Laboratorio: {resultado.prevPct}% → {resultado.nuevoPct}%.
          </p>

          {/* Hallazgo A: mensaje/CTA de patrón, 100% desacoplado del % de laboratorio de
              arriba. Mientras patronReal es null, no se afirma nada (evita prometer de más
              mientras se confirma con el motor real). */}
          {patronReal && (
            patronReal.disponible ? (
              <React.Fragment>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: "rgba(242,239,233,0.85)", margin: "0 0 16px", lineHeight: 1.5 }}>
                  Ya tenés suficientes días registrados para ver tu primer patrón.
                </p>
                {onVerMisPatrones && (
                  <button onClick={() => { if (navigator.vibrate) navigator.vibrate(12); onVerMisPatrones(); }} className="glass-press" style={{
                    width: "100%", padding: "13px", borderRadius: 16, fontWeight: 800, fontSize: 13, cursor: "pointer",
                    fontFamily: EXPLORADOR_TOKENS.font, marginBottom: 12, color: "#2A1D08",
                    background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
                    borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
                    borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
                    boxShadow: "0 8px 18px -4px rgba(0,0,0,0.55)",
                  }}>
                    Ver mi primer patrón
                  </button>
                )}
              </React.Fragment>
            ) : (
              <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: "rgba(242,239,233,0.85)", margin: "0 0 16px", lineHeight: 1.5 }}>
                {typeof patronReal.diasRegistrados === "number"
                  ? `Vas ${patronReal.diasRegistrados}/10 días con comida y bienestar cruzados. Seguí registrando para tu primer patrón.`
                  : "Seguí registrando — con suficientes días cruzados vas a poder ver tu primer patrón."}
              </p>
            )
          )}
          <button onClick={() => { setResultado(null); setPatronReal(null); }} style={{
            background: "none", border: "none", color: EXPLORADOR_TOKENS.menta,
            fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 700, fontSize: 13, cursor: "pointer", padding: 0,
          }}>
            Seguir sumando
          </button>
        </div>
      )}
      {error && <p style={{ color: "#F0958A", fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginTop: 14 }}>{error}</p>}
    </div>
  );
}

function BarraProgreso({ actual, total }) {
  const pct = Math.min(100, Math.round((actual / total) * 100));
  return (
    <div style={{ marginTop: 16 }}>
      <div style={{ display: "flex", width: "100%", height: 8, borderRadius: 999, overflow: "hidden", background: "rgba(255,255,255,0.12)", marginBottom: 8 }}>
        <div style={{ width: `${pct}%`, background: EXPLORADOR_TOKENS.menta, boxShadow: "0 0 8px rgba(143,168,155,0.5)", transition: "width 0.3s ease" }} />
      </div>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.textSecondary, letterSpacing: "0.03em" }}>
        {actual} de {total} días con registro cruzado
      </p>
    </div>
  );
}

        {insight.metrica}
      </p>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14, lineHeight: 1.65, margin: 0 }}>{insight.frase}</p>
    </div>
  );
}

// Fase 2/P0, Bloque 3 (15/08/2026) — Caso C: "apareció una observación". Componente propio
// (no inline en PatronesScreen) para que patron_visto se dispare una vez por resultado real,
// no en cada re-render de la pantalla contenedora (ej. al tipear el email de lista de espera).
function PatronOkBlock({ resultado, onRecalcular, onIrABienestar, pase }) {

    logEventoProducto("patron_visto", "patrones_screen", { cantidadInsights: (resultado.insights || []).length }, pase);
  }, [resultado]);

  return (

        Información observacional basada en tus registros. No reemplaza consejo médico profesional.
      </p>
      <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
        <button onClick={onRecalcular} className="glass-press" style={{
          flex: 1, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.15)",
          borderRadius: 16, padding: "12px", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font,
          fontWeight: 700, fontSize: 13, cursor: "pointer",
        }}>
          Recalcular
        </button>
        {onIrABienestar && (
          <button onClick={() => { if (navigator.vibrate) navigator.vibrate(12); onIrABienestar(); }} className="glass-press" style={{
            flex: 1, borderRadius: 16, padding: "12px", fontWeight: 800, fontSize: 13, cursor: "pointer",
            fontFamily: EXPLORADOR_TOKENS.font, color: "#2A1D08",
            background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
            borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
            borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
          }}>
            Seguir comprobando
          </button>
        )}
      </div>
    </div>
  );
}

function PatronesScreen({ onBack, pase, onIrABienestar }) {
  const [estado, setEstado] = useState("idle"); // idle | cargando | listo | error
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);
  const [teaser, setTeaser] = useState(null);
  const [historialGratis, setHistorialGratis] = useState(null); // { historial, racha } | null mientras carga
  const [email, setEmail] = useState("");
  const [emailEnviado, setEmailEnviado] = useState(false);
  const [emailEnviando, setEmailEnviando] = useState(false);
  const planesRef = useRef(null);

  async function verPatrones() {
    setEstado("cargando");
    setError(null);
    try {
      const resp = await fetch("/api/generar-insights", {
        headers: { Authorization: `Bearer ${pase || ""}` },
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "Error al calcular patrones");
      setResultado(data);
      setEstado("listo");
    } catch (e) {
      setError(String(e.message || e));
      setEstado("error");
    }
  }

  // Teaser del paywall con valor demostrado (04/08/2026): endpoint separado y liviano,
  // sin LLM — solo cuenta y compara registros existentes.
  // FASE 7 (10/08/2026): ya NO se dispara por "resultado.estado === 'bloqueado'" (ese estado
  // no existe más — Gratis ahora calcula patrones reales limitados). Se dispara únicamente
  // cuando ya sabemos, por historialGratis, que el usuario tiene 0 registros reales todavía
  // — ahí sí tiene sentido el paywall grande con ejemplo. Con datos reales, aunque sean pocos,
  // se muestra el historial real (ver bloque más abajo), no un ejemplo.
  useEffect(() => {
    if (estado === "listo" && resultado?.limitado14dias && historialGratis && historialGratis.historial.length === 0 && !teaser) {
      fetch("/api/patrones-observacionales", { headers: { Authorization: `Bearer ${pase || ""}` } })
        .then((r) => r.json())
        .then((d) => setTeaser(d))
        .catch(() => setTeaser({ estado: "A", totalRegistros: 0, patron: null }));
    }
  }, [estado, resultado, historialGratis]);

  // FASE 7 (10/08/2026): trae el historial real de 14 días para Gratis (gráfico/lista +
  // racha) — generar-insights.js solo devuelve la frase del patrón, nunca los datos crudos.
  useEffect(() => {
    if (estado === "listo" && resultado?.limitado14dias && !historialGratis) {
      fetch("/api/generar-insights?vista=historial", { headers: { Authorization: `Bearer ${pase || ""}` } })
        .then((r) => r.json())
        .then((d) => setHistorialGratis(d))
        .catch(() => setHistorialGratis({ historial: [], racha: 0 }));
    }
  }, [estado, resultado]);

  async function activarListaEspera() {
    if (!email.trim()) return;
    setEmailEnviando(true);
    try {
      await fetch("/api/premium?ruta=lista-espera", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ email: email.trim() }),
      });
    } catch (e) {
      // no bloqueamos al usuario si falla el registro del email
    } finally {
      setEmailEnviando(false);
      setEmailEnviado(true);
    }
  }

  const botonOscuroEstilo = (activo) => ({
    width: "100%", padding: "14px", borderRadius: 18, cursor: activo ? "pointer" : "not-allowed",
    fontWeight: 800, fontSize: 14, fontFamily: EXPLORADOR_TOKENS.font, textTransform: "uppercase", letterSpacing: "0.03em",
    color: activo ? "#2A1D08" : "rgba(242,239,233,0.45)",
    background: activo ? `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)` : "rgba(255,255,255,0.08)",
    borderTop: activo ? "1.5px solid rgba(255,255,255,0.6)" : "1px solid rgba(255,255,255,0.1)",
    borderLeft: activo ? "1.5px solid rgba(255,255,255,0.35)" : "1px solid rgba(255,255,255,0.1)",
    borderRight: activo ? "1.5px solid rgba(120,85,20,0.5)" : "1px solid rgba(255,255,255,0.1)",
    borderBottom: activo ? "2.5px solid rgba(90,60,10,0.6)" : "1px solid rgba(255,255,255,0.1)",
    boxShadow: activo ? "0 10px 22px -6px rgba(0,0,0,0.6)" : "none",
  });

  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }

  return (
    <div className="fade-in">
      <button onClick={onBack} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>
        ← Categorías
      </button>

      {estado === "idle" && (
        <button onClick={() => { vibrar(); verPatrones(); }} className="glass-press" style={botonOscuroEstilo(true)}>
          Ver mis patrones
        </button>
      )}

      {estado === "cargando" && (
        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13.5 }}>Cruzando tus registros...</p>
      )}

      {estado === "error" && (
        <div>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: "#F0958A", fontSize: 13, marginBottom: 12 }}>{error}</p>
          <button onClick={() => { vibrar(); verPatrones(); }} className="glass-press" style={botonOscuroEstilo(true)}>
            Reintentar
          </button>
        </div>
      )}

      {/* Paywall con valor demostrado (04/08/2026, especificación de Marketing/Psicología del
          Consumidor — reemplaza el panel de candado anterior). Estado A/B se resuelve en un
          endpoint nuevo y separado (/api/patrones-observacionales), sin LLM, solo cuenta y
          compara registros existentes — no comparte motor con generar-insights.js a propósito,
          para no meter costo de IA en la pantalla de venta. PENDIENTE DE CONECTAR: necesito
          api/_sesion.js + un archivo api/*.js existente como referencia antes de escribir ese
          endpoint (protocolo NO LO SÉ — no voy a inventar el patrón de sesión/Supabase que usa
          el resto del proyecto). Mientras tanto este bloque ya queda listo del lado visual. */}
      {estado === "listo" && resultado.limitado14dias && historialGratis && historialGratis.historial.length === 0 && (
        <div>
          {!teaser && (
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13.5 }}>Cargando tu laboratorio...</p>
          )}

          {teaser && teaser.estado === "A" && (
            <div style={{
              background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
              backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
              borderRadius: 22, padding: 22, boxShadow: EXPLORADOR_TOKENS.cardShadow, marginBottom: 18,
            }}>
              <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 16, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 10 }}>
                Laboratorio en calentamiento (1/3)
              </p>
              <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13.5, lineHeight: 1.6, marginBottom: 18 }}>
                Registrá 2 veces más "Cómo te sentís" para que podamos cruzar tu comida con tu energía. Ya tenés {teaser.totalRegistros} registros.
              </p>
              <button onClick={onIrABienestar} className="glass-press" style={botonOscuroEstilo(true)}>
                Registrar cómo me siento
              </button>
            </div>
          )}

          {teaser && teaser.estado === "B" && (
            <div>
              {/* Card 1 — dato real, sin blur */}
              <div style={{
                background: "rgba(143,168,155,0.12)", border: `1px solid rgba(143,168,155,0.4)`,
                borderRadius: 22, padding: 20, boxShadow: EXPLORADOR_TOKENS.cardShadow, marginBottom: 12,
              }}>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 14.5, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 8 }}>
                  Patrón #1 detectado — Basado en tus datos

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error atrapado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "'IBM Plex Sans', sans-serif" }}>
          <p style={{ color: "#B3453D", fontWeight: 700, fontSize: 15, marginBottom: 10 }}>Error real en la app:</p>
          <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: 12, color: "#101826", background: "#FFFFFF", border: "1px solid #E2E6EB", borderRadius: 8, padding: 14, lineHeight: 1.5 }}>
            {String((this.state.error && (this.state.error.stack || this.state.error.message)) || this.state.error)}
          </pre>
          <p style={{ fontSize: 12, color: "#5B6472", marginTop: 12 }}>Mandale este texto completo a Claude para resolverlo.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

function TerminosGate({ pase, onAceptar }) {
  const [checkTerminos, setCheckTerminos] = useState(false);
  const [condicionMedica, setCondicionMedica] = useState(null); // null | true | false
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState(null);

  const puedeContinuar = checkTerminos && condicionMedica !== null;

  async function confirmar() {
    if (!puedeContinuar) return;
    setEnviando(true);
    setError(null);
    try {
      const resp = await fetch("/api/aceptar-terminos", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ condicionMedica }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "No se pudo registrar la aceptación.");
      lsSet("reseteo_condicion_medica", condicionMedica ? "true" : "false");
      onAceptar();

      setError(String(e.message || e));
    } finally {
      setEnviando(false);

  // pantalla), no una única vez por sesión: mantiene la instrumentación simple, sin

  useEffect(() => {
    logEventoProducto("exploracion_iniciada", "explorador", { grupoElegido: grupoElegido?.val || null }, pase);
  }, []);

  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }

    <div className="fade-in">

      <div style={{ display: "grid", gap: 12 }}>
        {GRUPOS_OBJETIVO.map((g) => {

            <div key={g.val} style={{
              borderTop: "2px solid rgba(255,255,255,0.22)", borderLeft: "1.5px solid rgba(255,255,255,0.12)",

// Pantalla de detalle de una Alternativa + los 3 CTAs de Fase 2 (10/08/2026).
// Separada en componente propio (antes era JSX inline en App()) porque ahora necesita
// su propio estado: la reacción guardada (para CTA1 mostrar el toggle activo y CTA3
// leerla) y si el modal de CTA3 está abierto.
// Panel admin mínimo (Fase 8, 10/08/2026). El bloqueo real está en /api/premium.js (?ruta=admin)
// (chequea ADMIN_USER_ID server-side) — esta pantalla asume que si el fetch devuelve 401,
// simplemente no sos vos, y lo muestra tal cual sin dar pistas extra.
function AdminPremiumScreen({ pase }) {
  const [pendientes, setPendientes] = useState(undefined); // undefined = cargando
  const [error, setError] = useState(null);
  const [procesando, setProcesando] = useState(null); // id de la solicitud en curso

  function cargar() {
    setPendientes(undefined);
    fetch("/api/premium?ruta=admin", { headers: { Authorization: `Bearer ${pase || ""}` } })
      .then((r) => {
        if (r.status === 401) { setError("No autorizado."); setPendientes([]); return null; }
        return r.json();
      })
      .then((d) => { if (d) setPendientes(d.pendientes || []); })
      .catch(() => { setError("Error cargando pendientes."); setPendientes([]); });
  }
  useEffect(() => { cargar(); }, [pase]);

  async function procesar(id, accion) {
    setProcesando(id);
    try {
      await fetch("/api/premium?ruta=admin", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ solicitudId: id, accion }),
      });
      cargar();
    } catch (e) {
      setError("No se pudo procesar. Reintentá.");
    } finally {
      setProcesando(null);
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: EXPLORADOR_TOKENS.bg, padding: "24px 18px" }}>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 18, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 16 }}>
        Premium — solicitudes pendientes
      </p>
      {error && <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, color: "#D97757" }}>{error}</p>}
      {pendientes === undefined && <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, color: EXPLORADOR_TOKENS.textSecondary }}>Cargando...</p>}
      {pendientes && pendientes.length === 0 && !error && (
        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, color: EXPLORADOR_TOKENS.textSecondary }}>No hay nada pendiente ahora.</p>
      )}
      <div style={{ display: "grid", gap: 12 }}>
        {(pendientes || []).map((s) => (
          <div key={s.id} style={{
            background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel, borderRadius: 16,
            backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
            padding: 14, boxShadow: EXPLORADOR_TOKENS.cardShadow,
          }}>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, color: EXPLORADOR_TOKENS.textPrimary, fontWeight: 700, margin: 0 }}>
              {s.usuarios?.nombre_alias || s.usuarios?.email || s.user_id}
            </p>
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: EXPLORADOR_TOKENS.textSecondary, margin: "4px 0 10px" }}>
              {s.metodo === "alias" ? "Transferencia" : "Mercado Pago"} — ${s.monto} — {new Date(s.created_at).toLocaleString("es-AR")}
            </p>
            {s.comprobanteSignedUrl && (
              <a href={s.comprobanteSignedUrl} target="_blank" rel="noopener noreferrer" style={{ display: "block", marginBottom: 10 }}>
                {s.comprobante_url && s.comprobante_url.toLowerCase().endsWith(".pdf") ? (
                  <span style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: EXPLORADOR_TOKENS.accent }}>📄 Ver comprobante (PDF) ↗</span>
                ) : (
                  <React.Fragment>
                    <img src={s.comprobanteSignedUrl} alt="Comprobante" style={{ width: "100%", maxHeight: 220, objectFit: "contain", borderRadius: 10, border: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, background: "rgba(0,0,0,0.2)" }}
                      onError={(e) => { e.target.style.display = "none"; }} />
                    <span style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.accent }}>Ver comprobante completo ↗</span>
                  </React.Fragment>
                )}
              </a>
            )}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => procesar(s.id, "aprobar")} disabled={procesando === s.id} className="glass-press" style={{
                flex: 1, borderRadius: 10, padding: "9px", fontWeight: 700, fontSize: 12.5, fontFamily: EXPLORADOR_TOKENS.font,
                cursor: "pointer", color: "#2A1D08", background: EXPLORADOR_TOKENS.accent, border: "none",
              }}>Aprobar</button>
              <button onClick={() => procesar(s.id, "rechazar")} disabled={procesando === s.id} className="glass-press" style={{
                flex: 1, borderRadius: 10, padding: "9px", fontWeight: 700, fontSize: 12.5, fontFamily: EXPLORADOR_TOKENS.font,
                cursor: "pointer", color: EXPLORADOR_TOKENS.textSecondary, background: "rgba(255,255,255,0.06)", border: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`,
              }}>Rechazar</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Opción 1 — Transferencia por alias (Fase 8, 10/08/2026). Sube el comprobante como
// base64 (sin librerías de multipart, coherente con el stack zero-build) y queda
// pendiente de aprobación manual — nunca se activa Premium solo desde acá.
const ALIAS_MP = "tu.alias.mp"; // TODO Augusto: reemplazar por el alias real antes de deployar.
function TarjetaPagoAlias({ pase }) {
  const [estado, setEstado] = useState("idle"); // idle | subiendo | enviado | error | yaPendiente
  const inputRef = useRef(null);

  function elegirArchivo() {
    inputRef.current?.click();
  }

  function archivoElegido(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { setEstado("error"); return; }
    setEstado("subiendo");
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(",")[1];
      fetch("/api/premium?ruta=activar-alias", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ archivoBase64: base64, mimeType: file.type }),
      })
        .then((r) => {
          if (r.status === 409) { setEstado("yaPendiente"); return null; }
          if (!r.ok) throw new Error("fallo");
          return r.json();
        })
        .then((d) => { if (d) setEstado("enviado"); })
        .catch(() => setEstado("error"));
    };
    reader.onerror = () => setEstado("error");
    reader.readAsDataURL(file);
  }

  return (
    <div style={{
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel, borderRadius: 18,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
      boxShadow: EXPLORADOR_TOKENS.cardShadow, padding: 16,
    }}>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 14.5, color: EXPLORADOR_TOKENS.textPrimary, margin: 0 }}>$10.000</p>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: EXPLORADOR_TOKENS.textSecondary, margin: "2px 0 10px" }}>Transferencia directa — Activación en el día</p>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 12 }}>
        Alias: <strong style={{ userSelect: "all" }}>{ALIAS_MP}</strong>
      </p>

      {estado === "enviado" ? (
        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.menta, margin: 0 }}>
          ✓ Comprobante recibido. Lo revisamos y activamos en el día.
        </p>
      ) : estado === "yaPendiente" ? (
        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textSecondary, margin: 0 }}>
          Ya tenés un comprobante en revisión.
        </p>
      ) : (
        <React.Fragment>
          <input ref={inputRef} type="file" accept="image/*,application/pdf" onChange={archivoElegido} style={{ display: "none" }} />
          <button onClick={elegirArchivo} disabled={estado === "subiendo"} className="glass-press" style={{
            width: "100%", borderRadius: 14, padding: "11px", fontWeight: 700, fontSize: 13,
            fontFamily: EXPLORADOR_TOKENS.font, cursor: "pointer", color: "#2A1D08",
            background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
            border: "none",
          }}>
            {estado === "subiendo" ? "Subiendo..." : "Ya transferí — subir comprobante"}
          </button>
          {estado === "error" && (
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, color: "#D97757", marginTop: 8, marginBottom: 0 }}>
              No se pudo subir (¿el archivo pesa más de 8MB?). Probá de nuevo.
            </p>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

// Opción 2 — Mercado Pago (Fase 8, 10/08/2026). Crea la preferencia y redirige al

function TarjetaPagoMP({ pase }) {
  const [cargando, setCargando] = useState(false);

        if (!d.initPoint) throw new Error("sin init point");
        window.location.href = d.initPoint;

      .catch(() => { setError("No se pudo iniciar el pago. Probá de nuevo."); setCargando(false); });

  return (
    <div style={{

      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,

// CTA1 "¿Cómo te cae?" (Fase 2, 10/08/2026) — 2 toggles independientes, upsert vía
// /api/registrar-extra?tipo=reaccion. Cada toggle guarda apenas se toca (no espera un botón
// "Guardar" aparte, mismo espíritu de fricción mínima que el resto de Fase 2).
function CTAComoTeCae({ entry, pase, reaccion, onGuardada }) {
  const [guardando, setGuardando] = useState(null); // "frioCalor" | "livianoPesado" | null
  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }

  async function marcar(campo, valor) {
    setGuardando(campo);
    vibrar();
    try {
      const body = { alternativaId: entry.id };
      if (campo === "frioCalor") body.frioCalor = valor; else body.livianoPesado = valor;
      const resp = await fetch("/api/registrar-extra?tipo=reaccion", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error("No se pudo guardar");
      const data = await resp.json();
      onGuardada(data.reaccion);
    } catch (e) {
      // silencioso a propósito: no es un flujo crítico, el usuario puede reintentar tocando de nuevo.
    } finally {
      setGuardando(null);
    }
  }

  function Toggle({ campo, opciones }) {
    const valorActual = campo === "frioCalor" ? reaccion?.frio_calor : reaccion?.liviano_pesado;
    return (
      <div style={{ display: "flex", gap: 8 }}>
        {opciones.map((op) => {
          const activo = valorActual === op;
          return (
            <button key={op} onClick={() => marcar(campo, op)} disabled={guardando === campo} className="glass-press"
              style={{
                flex: 1, borderRadius: 12, padding: "9px 10px", fontFamily: EXPLORADOR_TOKENS.font,
                fontSize: 12.5, fontWeight: 700, cursor: "pointer",
                color: activo ? "#2A1D08" : EXPLORADOR_TOKENS.textSecondary,
                background: activo ? EXPLORADOR_TOKENS.accent : "rgba(255,255,255,0.06)",
                border: `1px solid ${activo ? EXPLORADOR_TOKENS.accent : EXPLORADOR_TOKENS.cardBorder}`,
              }}>{op}</button>
          );
        })}
      </div>
    );
  }

  return (
    <div>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.accent, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 700 }}>¿Cómo te cae?</p>
      <div style={{ display: "grid", gap: 8 }}>
        <Toggle campo="frioCalor" opciones={VALORES_FRIO_CALOR} />
        <Toggle campo="livianoPesado" opciones={VALORES_LIVIANO_PESADO} />
      </div>
    </div>
  );
}

// usa LogMealScreen (mismo header Authorization Bearer pase). Loguea entry.combinacion,
// no entry.resultado (ver nota en view.screen === "entry").
function CTASumarDia({ entry, pase }) {
  const [estado, setEstado] = useState("idle"); // idle | cargando | ok | error
  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }
  async function sumar() {
    if (estado === "cargando" || estado === "ok") return;
    setEstado("cargando");
    vibrar();
    // Fase 2/P0 — probar_click: se loguea al iniciar la acción, no al confirmar éxito
    // (mide intención de probar, distinto de registro_realizado que se loguea en el
    // backend solo si el registro efectivamente se creó).
    logEventoProducto("probar_click", "entry_detalle", { alternativaId: entry.id }, pase);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto: entry.combinacion, alternativaId: entry.id }),
      });
      if (!resp.ok) throw new Error("No se pudo guardar");
      setEstado("ok");
    } catch (e) {
      setEstado("error");
    }
  }
  return (
    <div>
      <button onClick={sumar} disabled={estado === "cargando" || estado === "ok"} className={estado === "cargando" || estado === "ok" ? "" : "glass-press"}
        style={{
          width: "100%", borderRadius: 16, padding: "13px", fontWeight: 800, fontSize: 13.5,
          fontFamily: EXPLORADOR_TOKENS.font, cursor: estado === "idle" || estado === "error" ? "pointer" : "default",
          color: estado === "ok" ? EXPLORADOR_TOKENS.menta : "#2A1D08",
          background: estado === "ok" ? "rgba(143,168,155,0.14)" : `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
          border: estado === "ok" ? `1px solid ${EXPLORADOR_TOKENS.menta}55` : "none",
          boxShadow: estado === "ok" ? "none" : "0 10px 22px -6px rgba(0,0,0,0.6)",
        }}>
        {estado === "ok" ? "✓ Sumado a tu día" : estado === "cargando" ? "Sumando..." : "Sumar a mi día"}
      </button>
      {estado === "error" && (
        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, color: "#D97757", marginTop: 8, marginBottom: 0 }}>

const VARIABLES_FUERTES = new Set(["Preparación", "Sustitución de producto", "Momento", "Cantidad", "Frecuencia"]);

function detectarVariable(entry) {
  const tecnica = ((entry.mecanismo || "") + " " + (entry.resultado || "")).toLowerCase();
  const frecuencia = (entry.frecuencia || "").toLowerCase();
  if (TECNICA_KW.some((k) => tecnica.includes(k))) return "Preparación";
  if (SUSTITUCION_KW.some((k) => tecnica.includes(k))) return "Sustitución de producto";
  if (MOMENTO_KW.some((k) => frecuencia.includes(k))) return "Momento";
  if (tecnica.includes("ventana")) return "Momento";
  if (CANTIDAD_KW.some((k) => frecuencia.includes(k))) return "Cantidad";
  if (/\d+\s*(?:-|a)\s*\d+\s*veces\s*por\s*semana/i.test(frecuencia)) return "Frecuencia";
  if (entry.frecuencia) return "Frecuencia de consumo (variable débil)";
  return "Ninguna identificada";
}

function clasificarEntrada(entry) {
  const variable = detectarVariable(entry);
  const tc = entry.tipo_card;
  let funcion;
  if (tc === "B" || tc === "D") funcion = "HACK";
  else if (tc === "A") funcion = VARIABLES_FUERTES.has(variable) ? "HERO" : "CONTEXTO";
  else if (tc === "C") {
    if (VARIABLES_FUERTES.has(variable)) funcion = "HACK";
    else if (entry.evidencia === "Especulativo" && variable === "Ninguna identificada") funcion = "ARCHIVO";
    else funcion = "CONTEXTO";
  } else funcion = "CONTEXTO";

  let prioridad;
  if ((funcion === "HERO" || funcion === "HACK") && (entry.evidencia === "Alto" || entry.evidencia === "Medio") && VARIABLES_FUERTES.has(variable)) prioridad = "A";
  else if (funcion === "HERO" || funcion === "HACK") prioridad = "B";
  else if (funcion === "CONTEXTO" && (entry.evidencia === "Alto" || entry.evidencia === "Medio")) prioridad = "C";
  else prioridad = "D";

  return { funcion, variable, prioridad, accionable: funcion === "HERO" || funcion === "HACK" };
}

    if (nombreLimpio) {

      try {
        await fetch("/api/perfil?campo=nombre", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
          body: JSON.stringify({ nombreAlias: nombreLimpio }),
        });
      } catch (e) {
        // No bloquea el onboarding si falla — el nombre es un detalle de personalización,
        // no una condición de acceso (mismo criterio que emitirEvento: no intrusivo).
        console.error("No se pudo guardar el nombre:", e);
      } finally {
        setGuardando(false);

    setPaso(2);
