  ink: "#101826", inkDim: "#5B6472",

};

const GOOGLE_CLIENT_ID = "521828227436-s3qcdgb7ivd9aaaqifm1c20nat8ntcj1.apps.googleusercontent.com";

// Helpers de localStorage (03/08/2026 — corrección de hallazgo real): varios accesos
// directos a localStorage en el archivo NO estaban protegidos con try/catch. En
// navegadores con storage bloqueado (modo privado con política estricta, extensiones de
// privacidad, storage deshabilitado por el usuario), localStorage.getItem/setItem puede
// lanzar SecurityError — y como alguno de esos accesos vive dentro de un inicializador de
// useState, un error ahí rompe el render inicial de React entero, no solo esa función.
// Se centralizan acá los tres accesos (get/set/remove) para que TODO el archivo pase por
// un único punto ya protegido, en vez de tener try/catch repetido y potencialmente
// olvidado en algún lugar nuevo a futuro.
function lsGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { console.warn("localStorage inaccesible (get):", e); return null; }
}
function lsSet(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { console.warn("localStorage inaccesible (set):", e); }
}
function lsRemove(key) {
  try { window.localStorage.removeItem(key); } catch (e) { console.warn("localStorage inaccesible (remove):", e); }
}

function EvidenceStamp({ level }) {

  const style = EVIDENCE_STYLES[level] || { color: TOKENS.inkDim, label: level };

}

function groupByCategoria(entradas) {
  const grupos = {};
  entradas.forEach((e) => {
    let claves = e.categorias && e.categorias.length ? e.categorias : null;
    if (!claves) {
      claves = [e.tipo === "protocolo" ? "Hábitos y Rutinas" : "Sin categorizar (pendiente)"];
    }
    claves.forEach((cat) => {
      if (!grupos[cat]) grupos[cat] = [];
      grupos[cat].push(e);
    });
  });
  return grupos;
}

function BloqueoCard({ b, pase, tieneCondicionMedica }) {
  const requiereConsentimiento = b.nivelRiesgo && b.nivelRiesgo !== "Bajo";

      await fetch("/api/registrar-consentimiento-riesgo", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ bloqueo: b.combinacion, nivelRiesgo: b.nivelRiesgo }),
      });
    } catch (e) {
      // no bloqueamos al usuario si falla el log; solo lo dejamos avanzar
    } finally {
      setEnviando(false);
      setConfirmado(true);
    }
  }

  return (
    <div style={{
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,

      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 15, fontWeight: 700, marginBottom: 8 }}>{b.combinacion}</p>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13, lineHeight: 1.6, marginBottom: (b.solucion || b.invitacionPremium) ? 12 : 0 }}>{b.resultado}</p>

      {!confirmado && (
        <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 12 }}>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.55, marginBottom: 10 }}>
            ⚠️ Este patrón tiene nivel de riesgo <b>{b.nivelRiesgo}</b>: implica más variabilidad individual, o mayor cuidado si aplica en tu caso.
            {tieneCondicionMedica && " Marcaste que tenés una condición médica preexistente — consultá con tu profesional antes de aplicar cualquier sugerencia."}
          </p>
          <button onClick={confirmarRiesgo} disabled={enviando} className={enviando ? "" : "glass-press"} style={{
            width: "100%", padding: "11px", borderRadius: 14, fontWeight: 800, fontSize: 13, cursor: enviando ? "default" : "pointer",
            fontFamily: EXPLORADOR_TOKENS.font, color: "#2A1D08",
            background: `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
            borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
            borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
            boxShadow: "0 6px 14px -3px rgba(0,0,0,0.55)",
          }}>
            {enviando ? "..." : "Entiendo, ver la sugerencia"}
          </button>
        </div>
      )}

      {confirmado && b.solucion && (
        <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 12 }}>
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 10, color: EXPLORADOR_TOKENS.accent, marginBottom: 4, letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 700 }}>Solución</p>

        </div>
      )}

      {confirmado && !b.solucion && b.invitacionPremium && (
        <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 12, marginTop: 4 }}>

}

function LogMealScreen({ onBack, pase, tieneCondicionMedica }) {
  const [texto, setTexto] = useState("");
  const [momento, setMomento] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);

  const enviar = async () => {
    if (!texto.trim()) return;
    setEnviando(true);
    setError(null);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto, momento: momento || undefined }),
      });
      const data = await resp.json();
      if (data.error) {
        if (data.requiereTerminos) {
          lsRemove("reseteo_terminos_v1");
          window.location.reload();
          return;
        }
        throw new Error(data.error);
      }
      setResultado(data);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  };

  if (resultado) {
    const bloqueos = resultado.bloqueos || [];
    const resueltos = resultado.resueltos || [];
    const sugerencias = resultado.sugerencias || [];

      <div className="fade-in">
        <button onClick={onBack} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>
          ← Categorías
        </button>
        <h2 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 21, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 16, letterSpacing: "-0.01em" }}>

            : resueltos.length > 0

        {bloqueos.length === 0 && resueltos.length === 0 && sugerencias.length === 0 && (
          <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 14, lineHeight: 1.6 }}>No encontramos nada que valga la pena señalarte en lo que registraste. Igual quedó guardado en tu historial.</p>

              <div key={"resuelto-" + i} style={{

                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{r.combinacion}</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13, lineHeight: 1.6 }}>{r.mensaje}</p>
              </div>

          {bloqueos.map((b, i) => (
            <BloqueoCard key={i} b={b} pase={pase} tieneCondicionMedica={tieneCondicionMedica} />
          ))}
        </div>
        {sugerencias.length > 0 && (

                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.accent, fontSize: 11, fontWeight: 800, letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 6 }}>💡 Tip relacionado</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{s.nombre}</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 13, lineHeight: 1.6 }}>{s.mecanismo}</p>
              </div>

        {/* PUNTO DE INTEGRACIÓN — Primer Recorrido del Usuario (Sprint 9):

            componente independiente y reutilizable — solo falta decidir, con la Especificación
            Funcional de Arquitectura, si se renderiza inline acá o se navega a él. No implementado
            todavía por instrucción explícita del Sprint. */}
        <button onClick={() => { setResultado(null); setTexto(""); setMomento(""); }} className="glass-press" style={{
          marginTop: 20, width: "100%", padding: "15px", borderRadius: 18, cursor: "pointer",

          boxShadow: "0 10px 22px -6px rgba(0,0,0,0.6)",

  }

  return (
    <div className="fade-in">
      <button onClick={onBack} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>

        <option value="Almuerzo" style={{ color: "#101826" }}>Almuerzo</option>
        <option value="Cena" style={{ color: "#101826" }}>Cena</option>
        <option value="Snack" style={{ color: "#101826" }}>Snack</option>

      {error && <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: "#F0958A", fontSize: 13, marginBottom: 12 }}>{error}</p>}
      <button onClick={enviar} disabled={enviando || !texto.trim()} className={enviando || !texto.trim() ? "" : "glass-press"} style={{
        width: "100%", padding: "15px", borderRadius: 18, cursor: enviando ? "default" : "pointer",
        fontWeight: 800, fontSize: 14, fontFamily: EXPLORADOR_TOKENS.font, textTransform: "uppercase", letterSpacing: "0.03em",
        color: enviando || !texto.trim() ? "rgba(242,239,233,0.45)" : "#2A1D08",

        borderTop: enviando || !texto.trim() ? "1px solid rgba(255,255,255,0.1)" : "1.5px solid rgba(255,255,255,0.6)",
        borderLeft: enviando || !texto.trim() ? "1px solid rgba(255,255,255,0.1)" : "1.5px solid rgba(255,255,255,0.35)",
        borderRight: enviando || !texto.trim() ? "1px solid rgba(255,255,255,0.1)" : "1.5px solid rgba(120,85,20,0.5)",
        borderBottom: enviando || !texto.trim() ? "1px solid rgba(255,255,255,0.1)" : "2.5px solid rgba(90,60,10,0.6)",
        boxShadow: enviando || !texto.trim() ? "none" : "0 10px 22px -6px rgba(0,0,0,0.6)",
      }}>
        {enviando ? "Buscando bloqueos..." : "Registrar comida"}
      </button>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);

  async function handleCredentialResponse(response) {
    setCargando(true);
    setError(null);
    try {
      const resp = await fetch("/api/login-google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      lsSet("reseteo_usuario", JSON.stringify(data));
      onLogin(data);
    } catch (e) {
      setError(String(e.message || e));
      setCargando(false);
    }
  }

  useEffect(() => {
    let cancelado = false;
    function intentarRenderizar() {
      if (cancelado) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(intentarRenderizar, 200);
        return;
      }
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      window.google.accounts.id.renderButton(
        document.getElementById("google-signin-button"),
        { theme: "outline", size: "large", width: 280, text: "signin_with" }
      );
    }
    intentarRenderizar();
    return () => { cancelado = true; };
  }, []);

  return (

}

// Tablero de accesos (30/07/2026): agrupa comida + bienestar (que ya cubre sueño,
// hidratación y actividad física) en UN solo lugar visual — no un botón suelto por cada
// cosa, ni un formulario que obligue a cargar las cuatro juntas. Cada acceso sigue siendo
// independiente puertas adentro (LogMealScreen / BienestarScreen), esto es solo la puerta
// de entrada común.
function PlanificarPanel({ pase }) {
  const [texto, setTexto] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);

  async function ver() {
    if (!texto.trim()) return;
    setEnviando(true);
    setError(null);
    setResultado(null);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto, soloVista: true }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      setResultado(data);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  }

  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }
  const activo = texto.trim() && !enviando;

  return (
    <div style={{
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
      borderRadius: 20, padding: 16, marginTop: 10, boxShadow: EXPLORADOR_TOKENS.cardShadow,
    }} className="fade-in">
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textSecondary, marginBottom: 10, lineHeight: 1.5 }}>
        Escribí lo que estás por comer — esto NO se guarda en tu historial, es solo para que decidas con más info.
      </p>
      <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={2} placeholder="Ej: milanesa con papas fritas"
        style={{
          width: "100%", border: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, borderRadius: 14, padding: 10,
          background: "rgba(255,255,255,0.06)", color: EXPLORADOR_TOKENS.textPrimary,
          fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 10, resize: "vertical", outline: "none",
        }} />
      <button onClick={() => { vibrar(); ver(); }} disabled={!activo} className={activo ? "glass-press" : ""} style={{
        borderRadius: 14, padding: "10px 18px", fontWeight: 800, fontSize: 12.5, cursor: activo ? "pointer" : "not-allowed",
        fontFamily: EXPLORADOR_TOKENS.font, textTransform: "uppercase", letterSpacing: "0.02em",
        color: activo ? "#2A1D08" : "rgba(242,239,233,0.4)",
        background: activo ? `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)` : "rgba(255,255,255,0.08)",
        borderTop: activo ? "1.5px solid rgba(255,255,255,0.6)" : "1px solid rgba(255,255,255,0.1)",
        borderLeft: activo ? "1.5px solid rgba(255,255,255,0.35)" : "1px solid rgba(255,255,255,0.1)",
        borderRight: activo ? "1.5px solid rgba(120,85,20,0.5)" : "1px solid rgba(255,255,255,0.1)",
        borderBottom: activo ? "2.5px solid rgba(90,60,10,0.6)" : "1px solid rgba(255,255,255,0.1)",
        boxShadow: activo ? "0 8px 18px -4px rgba(0,0,0,0.6)" : "none",
      }}>
        {enviando ? "..." : "Ver antes de comer"}
      </button>

      {error && <p style={{ color: "#F0958A", fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, marginTop: 12 }}>{error}</p>}

      {resultado && (
        <div style={{ marginTop: 14, borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 14 }}>
          {resultado.bloqueos.length === 0 ? (
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, color: EXPLORADOR_TOKENS.textPrimary, fontWeight: 700 }}>Bien ahí, sin nada para ajustar.</p>
          ) : (
            resultado.bloqueos.map((b, i) => (
              <div key={i} style={{ marginBottom: i === resultado.bloqueos.length - 1 ? 0 : 14 }}>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, fontWeight: 700, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 4 }}>{b.combinacion}</p>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textSecondary, lineHeight: 1.5, marginBottom: (b.solucion || b.invitacionPremium) ? 8 : 0 }}>{b.resultado}</p>
                {b.solucion && (
                  <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12.5, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.5 }}>{b.solucion.adaptacion}</p>
                )}
                {!b.solucion && b.invitacionPremium && (
                  <div style={{ background: "rgba(197,160,89,0.12)", border: `1px solid rgba(197,160,89,0.3)`, borderRadius: 12, padding: "10px 12px", marginTop: 4 }}>
                    <p style={{ color: EXPLORADOR_TOKENS.textPrimary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, lineHeight: 1.5, margin: 0 }}>💡 {b.invitacionPremium}</p>
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      )}
    </div>
  );
}

// Dial semicircular 3D (03/08/2026, especificación técnica aprobada): reemplaza los 5
// botones cuadrados por un selector parabólico con perilla metálica bronce central.
// Estado inactivo: números en tono gris/bronce apagado. Estado activo: el segmento
// (arco + número) se ilumina en verde menta neón (#8FA89B) con resplandor interno. La
// perilla central (readout) se mantiene bronce metálica siempre, muestre o no selección.
function EscalaBienestar({ etiqueta, valor, onChange }) {
  const cx = 120, cy = 108, r = 88;
  const angleFor = (v) => 180 - ((v - 1) / 4) * 180;
  const pointAt = (deg) => {
    const rad = (deg * Math.PI) / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  };
  const start = pointAt(180);
  const end = pointAt(0);
  const trackPath = `M ${start.x} ${start.y} A ${r} ${r} 0 0 1 ${end.x} ${end.y}`;
  const progresoPath = valor
    ? `M ${start.x} ${start.y} A ${r} ${r} 0 0 1 ${pointAt(angleFor(valor)).x} ${pointAt(angleFor(valor)).y}`
    : null;
  const puntaAguja = valor ? (() => {
    const rad = (angleFor(valor) * Math.PI) / 180;
    const largoAguja = r - 22;
    return { x: cx + largoAguja * Math.cos(rad), y: cy - largoAguja * Math.sin(rad) };
  })() : null;

  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }

  return (
    <div style={{
      marginBottom: 16, padding: "18px 16px 12px", borderRadius: 24,
      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
      boxShadow: EXPLORADOR_TOKENS.cardShadow,
    }}>
      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, fontWeight: 700, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 4, textAlign: "center" }}>
        {etiqueta}
      </p>
      <div style={{ position: "relative", width: "100%", maxWidth: 260, margin: "0 auto" }}>
        <svg viewBox="0 0 240 130" style={{ width: "100%", display: "block", aspectRatio: "240 / 130" }}>
          <path d={trackPath} fill="none" stroke="rgba(255,255,255,0.10)" strokeWidth="13" strokeLinecap="round" />
          {progresoPath && (
            <path d={progresoPath} fill="none" stroke={EXPLORADOR_TOKENS.menta} strokeWidth="13" strokeLinecap="round"
              style={{ filter: `drop-shadow(0 0 6px rgba(143,168,155,0.4))` }} />
          )}
          {puntaAguja && (
            <g style={{ filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.5))" }}>
              <line x1={cx} y1={cy} x2={puntaAguja.x} y2={puntaAguja.y} stroke="#C5A059" strokeWidth="4" strokeLinecap="round" />
              <circle cx={cx} cy={cy} r="7" fill="#C5A059" stroke="#F2EFE9" strokeWidth="1.5" />
            </g>
          )}
        </svg>
        {[1, 2, 3, 4, 5].map((n) => {
          const p = pointAt(angleFor(n));
          const activo = valor === n;
          return (
            <button key={n} onClick={() => { vibrar(); onChange(activo ? null : n); }} className="glass-press" style={{
              position: "absolute", left: `${(p.x / 240) * 100}%`, top: `${(p.y / 130) * 100}%`,
              transform: "translate(-50%, -50%)", width: 26, height: 26, borderRadius: "50%",
              border: "none", cursor: "pointer",
              background: activo ? EXPLORADOR_TOKENS.menta : "transparent",
              boxShadow: activo ? "0 0 10px 2px rgba(143,168,155,0.4)" : "none",
              color: activo ? "#0F1A16" : "rgba(197,160,89,0.55)",
              fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 700, fontSize: 12,
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>{n}</button>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "center", marginTop: -32, marginBottom: 6 }}>
        <div style={{
          width: 54, height: 54, borderRadius: "50%", position: "relative", zIndex: 2,
          background: `radial-gradient(circle at 32% 28%, rgba(255,240,210,0.9), rgba(197,160,89,0.55) 35%, rgba(197,160,89,0.12) 75%)`,
          borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
          borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 21, color: "#2A1D08",
          boxShadow: "0 6px 14px rgba(0,0,0,0.5)",
        }}>{valor ?? "–"}</div>
      </div>
    </div>
  );
}

  const [error, setError] = useState(null);

      setEnergia(null);
      setDigestion(null);
      setSueno(null);
      setHidratacion(null);

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error atrapado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "'IBM Plex Sans', sans-serif" }}>
          <p style={{ color: "#B3453D", fontWeight: 700, fontSize: 15, marginBottom: 10 }}>Error real en la app:</p>
          <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: 12, color: "#101826", background: "#FFFFFF", border: "1px solid #E2E6EB", borderRadius: 8, padding: 14, lineHeight: 1.5 }}>
            {String((this.state.error && (this.state.error.stack || this.state.error.message)) || this.state.error)}
          </pre>
          <p style={{ fontSize: 12, color: "#5B6472", marginTop: 12 }}>Mandale este texto completo a Claude para resolverlo.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

function TerminosGate({ pase, onAceptar }) {
  const [checkTerminos, setCheckTerminos] = useState(false);
  const [condicionMedica, setCondicionMedica] = useState(null); // null | true | false
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState(null);

  const puedeContinuar = checkTerminos && condicionMedica !== null;

  async function confirmar() {
    if (!puedeContinuar) return;
    setEnviando(true);
    setError(null);
    try {
      const resp = await fetch("/api/aceptar-terminos", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ condicionMedica }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "No se pudo registrar la aceptación.");
      lsSet("reseteo_condicion_medica", condicionMedica ? "true" : "false");
      onAceptar();
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  }

  return (
    <div style={{
      position: "relative", overflow: "hidden", minHeight: "100vh", display: "flex",
      alignItems: "center", justifyContent: "center", padding: 24, background: EXPLORADOR_TOKENS.bg,

      <HojasDecorativas zIndex={0} />
      <div style={{
        position: "relative", zIndex: 1, maxWidth: 440, width: "100%",
        background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
        backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
        borderRadius: 26, padding: 28, boxShadow: EXPLORADOR_TOKENS.cardShadow,
      }}>
        <h1 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 22, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 12, letterSpacing: "-0.01em" }}>
          Antes de arrancar

        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: "rgba(242,239,233,0.85)", fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 }}>
          Reseteo Propio es una herramienta de auto-observación de patrones alimentarios. <b style={{ color: EXPLORADOR_TOKENS.textPrimary }}>No diagnostica ni trata condiciones médicas</b>, y no reemplaza la consulta con un profesional de la salud.
        </p>

        <label style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 18, cursor: "pointer" }}>
          <input type="checkbox" checked={checkTerminos} onChange={(e) => setCheckTerminos(e.target.checked)} style={{ marginTop: 3, width: 18, height: 18, flexShrink: 0, accentColor: EXPLORADOR_TOKENS.accent }} />
          <span style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.5 }}>
            Leí y acepto los <a href="/privacidad.html" target="_blank" style={{ color: EXPLORADOR_TOKENS.accent }}>Términos y la Política de Privacidad</a>. Entiendo que las sugerencias de la app son informativas, no médicas.
          </span>
        </label>

        <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 10, fontWeight: 700 }}>
          ¿Tenés algún diagnóstico médico preexistente (ej. diabetes, hipotiroidismo, patologías cardíacas, renales, etc.)?
        </p>
        <div style={{ display: "flex", gap: 10, marginBottom: 22 }}>
          {[{ label: "No", val: false }, { label: "Sí", val: true }].map((op) => {
            const activo = condicionMedica === op.val;
            return (
              <button key={op.label} onClick={() => setCondicionMedica(op.val)} className="glass-press" style={{

                border: `1.5px solid ${activo ? EXPLORADOR_TOKENS.menta : "rgba(255,255,255,0.15)"}`,
                boxShadow: activo ? "inset 0 1px 1px 0 rgba(255,255,255,0.4), 0 0 14px 1px rgba(143,168,155,0.55)" : "none",
                color: activo ? "#0F1A16" : EXPLORADOR_TOKENS.textPrimary,

          borderBottom: puedeContinuar && !enviando ? "2.5px solid rgba(90,60,10,0.6)" : "1px solid rgba(255,255,255,0.1)",

  if (buscando) {
    return (

  const nombresAgrupados = new Set(GRUPOS_OBJETIVO.flatMap((g) => g.objetivos));

    <div className="fade-in">

        {GRUPOS_OBJETIVO.map((g) => {

            <div key={g.val} style={{

            }}>
              <button onClick={() => { setGrupoAbierto(abierto ? null : g.val); vibrar(); }} className="glass-press" style={{
                width: "100%", textAlign: "left", display: "flex", alignItems: "center", gap: 14,

              }}>
                <span style={{
                  width: 46, height: 46, borderRadius: "50%", flexShrink: 0,

                  borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
                  borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",

      }}>{CATEGORY_ICONS[cat.name] || "•"}</span>

      </span>
    </button>
  );
}

// Home orientado a objetivo (30/07/2026) — reemplaza al viejo ONBOARDING_INTERESES
// (Paso 2 anterior: preguntaba por energía/digestión/sueño/ánimo, se guardaba en
// localStorage y nunca lo leía nadie más — no llegaba a persistirse en Supabase ni
// a influir en ninguna pantalla). Este mapeo sí se persiste (usuarios.objetivo_grupo,

}

function OnboardingBotonPrimario({ children, onClick, disabled }) {
  function vibrar() { if (navigator.vibrate) navigator.vibrate(12); }
  return (
    <button onClick={() => { if (!disabled) { vibrar(); onClick(); } }} disabled={disabled} className={disabled ? "" : "glass-press"} style={{
      width: "100%", borderRadius: 18, padding: "14px", fontWeight: 800, fontSize: 14,
      color: disabled ? "rgba(242,239,233,0.4)" : "#2A1D08", cursor: disabled ? "not-allowed" : "pointer", marginBottom: 10,
      background: disabled ? "rgba(255,255,255,0.08)" : `radial-gradient(circle at 30% 20%, rgba(255,240,210,0.95), rgba(197,160,89,0.85) 60%)`,
      borderTop: disabled ? "1px solid rgba(255,255,255,0.1)" : "1.5px solid rgba(255,255,255,0.6)",
      borderLeft: disabled ? "1px solid rgba(255,255,255,0.1)" : "1.5px solid rgba(255,255,255,0.35)",
      borderRight: disabled ? "1px solid rgba(255,255,255,0.1)" : "1.5px solid rgba(120,85,20,0.5)",
      borderBottom: disabled ? "1px solid rgba(255,255,255,0.1)" : "2.5px solid rgba(90,60,10,0.6)",

}

function OnboardingBotonFantasma({ children, onClick }) {
  return (
    <button onClick={onClick} style={{
      width: "100%", background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary,
      fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, cursor: "pointer", padding: "6px", textAlign: "center",
    }}>{children}</button>
  );
}

function OnboardingFlow({ pase, onCompletar }) {
  const [paso, setPaso] = useState(1);
  const [nombre, setNombre] = useState("");
  const [objetivoGrupo, setObjetivoGrupo] = useState(null);
  const [guardando, setGuardando] = useState(false);

  async function guardarNombreYAvanzar() {
    const nombreLimpio = nombre.trim();
    if (nombreLimpio) {
      setGuardando(true);
      try {
        await fetch("/api/actualizar-nombre", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
          body: JSON.stringify({ nombreAlias: nombreLimpio }),
        });
      } catch (e) {
        // No bloquea el onboarding si falla — el nombre es un detalle de personalización,
        // no una condición de acceso (mismo criterio que emitirEvento: no intrusivo).
        console.error("No se pudo guardar el nombre:", e);
      } finally {
        setGuardando(false);
      }
    }
    setPaso(2);
  }

  async function guardarObjetivoYAvanzar() {
    if (objetivoGrupo) {
      try {
        lsSet("reseteo_objetivo_grupo", objetivoGrupo);
      } catch (e) {}
      try {
        await fetch("/api/actualizar-objetivo", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
          body: JSON.stringify({ objetivoGrupo }),
        });
      } catch (e) {
        // Mismo criterio que el nombre: no bloquea el onboarding si falla.
        console.error("No se pudo guardar el objetivo:", e);
      }
    }
    setPaso(3);
  }

  function completarOnboarding() {
    try {
      lsSet("reseteo_onboarding_v1", "true");
    } catch (e) {}
    onCompletar();
  }

  const cardStyle = {
    position: "relative", zIndex: 1, maxWidth: 440, width: "100%",
    background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
    backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
    borderRadius: 26, padding: 28, boxShadow: EXPLORADOR_TOKENS.cardShadow,
  };
  const wrapStyle = {
    position: "relative", overflow: "hidden", minHeight: "100vh", display: "flex",
    alignItems: "center", justifyContent: "center", padding: 24, background: EXPLORADOR_TOKENS.bg,
  };
  const h1Style = {
    fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 22,
    color: EXPLORADOR_TOKENS.textPrimary, marginBottom: 10, letterSpacing: "-0.01em",
  };
  const pStyle = { color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 };
  const inputStyle = {
    width: "100%", padding: "13px 14px", borderRadius: 16, marginBottom: 18,
    border: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, background: "rgba(255,255,255,0.06)",
    fontFamily: EXPLORADOR_TOKENS.font, fontSize: 14, color: EXPLORADOR_TOKENS.textPrimary, outline: "none",
  };

  if (paso === 1) {
    return (
      <div style={wrapStyle} className="fade-in">
        <HojasDecorativas zIndex={0} />
        <div style={cardStyle}>
          <OnboardingProgreso paso={1} />
          <OnboardingEyebrow>Reseteo Propio · Paso 1 de 3</OnboardingEyebrow>
          <h1 style={h1Style}>¿Cómo querés que te llamemos?</h1>
          <p style={pStyle}>Nada de formularios largos. Esto es tuyo: un espacio para observar cómo responde tu cuerpo a tus propios hábitos, a tu ritmo.</p>
          <input
            style={inputStyle} placeholder="Ej: Augusto, Gustavo, Tucumanito..."
            value={nombre} onChange={(e) => setNombre(e.target.value)}
          />
          <OnboardingBotonPrimario onClick={guardarNombreYAvanzar} disabled={guardando}>
            {guardando ? "Guardando..." : "Continuar"}
          </OnboardingBotonPrimario>
          <OnboardingBotonFantasma onClick={() => setPaso(2)}>Prefiero omitir esto por ahora</OnboardingBotonFantasma>
        </div>
      </div>
    );
  }

  if (paso === 2) {
    return (
      <div style={wrapStyle} className="fade-in">
        <HojasDecorativas zIndex={0} />
        <div style={cardStyle}>
          <OnboardingProgreso paso={2} />
          <OnboardingEyebrow>Reseteo Propio · Paso 2 de 3</OnboardingEyebrow>
          <h1 style={h1Style}>¿Qué objetivo le das a Reseteo Propio?</h1>
          <p style={pStyle}>No hay respuesta incorrecta. Con esto ordenamos lo que ves primero — podés cambiarlo cuando quieras.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 22 }}>
            {GRUPOS_OBJETIVO.map((op) => {
              const seleccionado = objetivoGrupo === op.val;
              const IconoOp = GRUPO_ICONOS[op.val] || IconoEnergia;
              return (
                <button key={op.val} onClick={() => setObjetivoGrupo(op.val)} className="glass-press" style={{
                  padding: "14px 14px", borderRadius: 18, cursor: "pointer", textAlign: "left",
                  border: `1.5px solid ${seleccionado ? EXPLORADOR_TOKENS.accent : "rgba(255,255,255,0.15)"}`,
                  background: seleccionado ? "rgba(197,160,89,0.14)" : "rgba(255,255,255,0.05)",
                  boxShadow: seleccionado ? "0 0 0 1px rgba(197,160,89,0.4), 0 8px 18px rgba(0,0,0,0.35)" : "none",
                  display: "flex", alignItems: "flex-start", gap: 12,
                }}>
                  <span style={{
                    width: 38, height: 38, borderRadius: "50%", flexShrink: 0,
                    background: seleccionado
                      ? `radial-gradient(circle at 32% 28%, rgba(255,240,210,0.9), rgba(197,160,89,0.55) 35%, rgba(197,160,89,0.12) 75%)`
                      : "rgba(255,255,255,0.08)",
                    border: `1.5px solid ${seleccionado ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.18)"}`,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    color: seleccionado ? "#3A2A0F" : EXPLORADOR_TOKENS.textSecondary,
                  }}><IconoOp size={18} /></span>
                  <span>
                    <span style={{ display: "block", fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13.5, fontWeight: 700, color: EXPLORADOR_TOKENS.textPrimary }}>{op.label}</span>
                    <span style={{ display: "block", fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: EXPLORADOR_TOKENS.textSecondary, marginTop: 2, lineHeight: 1.4 }}>{op.detalle}</span>
                  </span>
                </button>
              );
            })}
          </div>
          <OnboardingBotonPrimario onClick={guardarObjetivoYAvanzar} disabled={!objetivoGrupo}>Continuar</OnboardingBotonPrimario>
          <OnboardingBotonFantasma onClick={() => setPaso(3)}>Prefiero verlo yo mismo, todavía no sé</OnboardingBotonFantasma>
        </div>
      </div>
    );
  }

  if (paso === 3) {
    return (
      <div style={wrapStyle} className="fade-in">
        <HojasDecorativas zIndex={0} />
        <div style={cardStyle}>
          <OnboardingProgreso paso={3} />
          <OnboardingEyebrow>Reseteo Propio · Paso 3 de 3</OnboardingEyebrow>
          <h1 style={h1Style}>Así funciona un "hackeo"</h1>
          <p style={pStyle}>No te vamos a decir qué no comer. Te mostramos cómo mejorar lo que ya elegiste.</p>
          <div style={{
            background: "rgba(197,160,89,0.10)", border: `1px solid rgba(197,160,89,0.3)`,
            borderRadius: 18, padding: 16, marginBottom: 22, display: "flex", gap: 12, alignItems: "flex-start",
          }}>
            <span style={{
              width: 36, height: 36, borderRadius: "50%", flexShrink: 0,
              background: `radial-gradient(circle at 32% 28%, rgba(255,240,210,0.9), rgba(197,160,89,0.55) 35%, rgba(197,160,89,0.12) 75%)`,
              borderTop: "1.5px solid rgba(255,255,255,0.6)", borderLeft: "1.5px solid rgba(255,255,255,0.35)",
              borderRight: "1.5px solid rgba(120,85,20,0.5)", borderBottom: "2px solid rgba(90,60,10,0.6)",
              display: "flex", alignItems: "center", justifyContent: "center", color: "#3A2A0F",
            }}><IconoHackeo size={18} /></span>
            <p style={{ margin: 0, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, lineHeight: 1.55, color: EXPLORADOR_TOKENS.textPrimary }}>
              Registrás <b>"arroz con pollo"</b> → te contamos que si comés el arroz que sobra frío al otro día (por ejemplo en una ensalada), tu cuerpo lo procesa distinto y le hace mejor a tu flora intestinal. Mismo arroz, mejor resultado.
            </p>
          </div>
          <OnboardingBotonPrimario onClick={completarOnboarding}>Entendido, quiero probar</OnboardingBotonPrimario>
        </div>
      </div>
    );
  }
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  // PUNTO DE INTEGRACIÓN — Primer Recorrido del Usuario (Sprint 9): RESUELTO (25/07/2026).
  // No se tocó el valor por defecto de "view" ni ExploradorScreen. En cambio, se agregó
  // un gate independiente (OnboardingFlow, más abajo) con el mismo patrón que TerminosGate:
  // se muestra ANTES de llegar a este árbol de pantallas, y una vez completado deja pasar
  // a "categories" como siempre. ExploradorScreen queda intacto y reutilizable.
  const [view, setView] = useState({ screen: "categories" });
  const [query, setQuery] = useState("");
  const [portadaLeerMas, setPortadaLeerMas] = useState(false);
  const [usuario, setUsuario] = useState(() => {
    try {
      const guardado = lsGet("reseteo_usuario");
      return guardado ? JSON.parse(guardado) : null;
    } catch (e) {
      return null;
    }
  });
  const [terminosAceptados, setTerminosAceptados] = useState(
    () => lsGet("reseteo_terminos_v1") === "true"
  );
  const [onboardingCompletado, setOnboardingCompletado] = useState(
    () => lsGet("reseteo_onboarding_v1") === "true"
  );

  const [objetivoGrupo] = useState(() => {
    return lsGet("reseteo_objetivo_grupo");
  });

  useEffect(() => {
    fetch("/api/data")
      .then((r) => r.json())
      .then((json) => {
        if (json.error) { setError(json.error); return; }
        setData(json);
      })
      .catch((e) => setError(String(e)));
  }, []);

  if (error) {
    return (
      <div style={{ padding: 24, color: TOKENS.ink, fontFamily: "'IBM Plex Sans', sans-serif" }}>
        <p style={{ color: "#B3453D" }}>Error cargando datos: {error}</p>
        <p style={{ color: TOKENS.inkDim, fontSize: 13 }}>
          Revisá que la variable de entorno AIRTABLE_API_KEY esté configurada en Vercel.
        </p>
      </div>
    );
  }

  if (!data) {
    return <div style={{ padding: 24, color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif" }}>Cargando...</div>;
  }

  if (!usuario) {
    return <LoginScreen onLogin={setUsuario} />;
  }

  if (!terminosAceptados) {
    return <TerminosGate pase={usuario.pase} onAceptar={() => {
      lsSet("reseteo_terminos_v1", "true");
      setTerminosAceptados(true);
    }} />;
  }

  if (!onboardingCompletado) {
    return <OnboardingFlow pase={usuario.pase} onCompletar={() => setOnboardingCompletado(true)} />;
  }

  const grupos = groupByCategoria(data.entradas);
  const grupoElegido = GRUPOS_OBJETIVO.find((g) => g.val === objetivoGrupo);
  const categoriasPrioritarias = grupoElegido
    ? grupoElegido.objetivos.filter((o) => grupos[o])
    : [];
  const categorias = [
    ...categoriasPrioritarias,
    ...Object.keys(grupos).filter((c) => !categoriasPrioritarias.includes(c)).sort(),
  ];

  const filteredCats = categorias
    .map((cat) => ({
      name: cat,
      entries: grupos[cat].filter((e) => e.combinacion.toLowerCase().includes(query.toLowerCase())),
    }))
    .filter((c) => query === "" || c.entries.length > 0);

  const temaOscuro = view.screen === "categories" || view.screen === "bienestar" || view.screen === "patrones"
    || view.screen === "log" || view.screen === "category" || view.screen === "entry";

  return (
    <div style={{ minHeight: "100vh", background: TOKENS.bg }}>
      <div style={{ position: "relative", background: temaOscuro ? EXPLORADOR_TOKENS.bg : "transparent", overflow: "hidden" }}>
        {/* Textura de fondo (03/08/2026, corrección técnica #2): el primer intento envolvía
            HojasDecorativas en un div extra con su propio position:absolute — quedaba un
            absolute-dentro-de-absolute con altura "auto" en ambos niveles, que algunos
            navegadores no resuelven bien (la textura terminaba con altura 0 en la práctica,
            visible solo donde por casualidad coincidía con la altura de la Portada). Se saca
            el div intermedio: HojasDecorativas ahora se posiciona directo contra el wrapper
            con position:relative (mismo patrón que ya funcionaba dentro de PortadaBanner). */}
        {temaOscuro && <HojasDecorativas zIndex={0} />}
        {view.screen === "categories" && (
          <PortadaBanner abierto={portadaLeerMas} onToggle={() => setPortadaLeerMas((v) => !v)} />
        )}
        <div style={{ position: "relative", zIndex: 1, maxWidth: 640, margin: "0 auto", padding: temaOscuro ? "20px 20px 60px" : "28px 20px 60px" }}>
        <header style={{ marginBottom: 24, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
          <div>
            <p style={{
              fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace",
              fontSize: 11, color: temaOscuro ? EXPLORADOR_TOKENS.accent : TOKENS.primary,
              letterSpacing: "0.08em", marginBottom: 6, textTransform: "uppercase", fontWeight: temaOscuro ? 600 : 400,
            }}>
              Comida real · Dato verificable · Sincronizado {new Date(data.actualizado).toLocaleString("es-AR")}
            </p>
            {view.screen === "categories" && grupoElegido ? (
              <React.Fragment>
                <h1 style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 26, color: temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.2, letterSpacing: "-0.02em", margin: 0 }}>
                  {grupoElegido.icon} Tu objetivo: {grupoElegido.label}
                </h1>
                <p style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Sans', sans-serif", fontSize: 13, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, marginTop: 6, marginBottom: 0, lineHeight: 1.5 }}>
                  {grupoElegido.detalle} Empezamos por acá — el resto sigue disponible cuando quieras.
                </p>
              </React.Fragment>
            ) : view.screen === "bienestar" ? (
              <h1 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 26, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.15, letterSpacing: "-0.01em", margin: 0 }}>
                ¿Cómo te sentís hoy?
              </h1>
            ) : view.screen === "patrones" ? (
              <React.Fragment>
                <h1 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 24, color: "#F2F5F3", lineHeight: 1.2, letterSpacing: "0.01em", margin: 0, textTransform: "uppercase" }}>
                  Mis patrones
                </h1>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, color: "rgba(143,168,155,0.85)", marginTop: 6, marginBottom: 0, lineHeight: 1.5, letterSpacing: "0.02em", textTransform: "uppercase" }}>
                  Cruzamos tu alimentación y bienestar para revelar tus patrones biológicos
                </p>
              </React.Fragment>
            ) : (
              <h1 style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 28, color: temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.15, letterSpacing: "-0.02em", margin: 0 }}>
                Explorador por problemática
              </h1>
            )}
          </div>
        </header>

        <nav style={{ display: "flex", gap: 20, marginBottom: 24, borderBottom: `1px solid ${temaOscuro ? "rgba(255,255,255,0.15)" : TOKENS.border}` }}>
          <button onClick={() => setView({ screen: "categories" })}
            style={{
              background: "none", border: "none", cursor: "pointer", padding: "0 0 10px 0",
              fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.04em", fontWeight: 600,
              color: (view.screen === "categories" || view.screen === "category" || view.screen === "entry" || view.screen === "log")
                ? (temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink)
                : (temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim),
              borderBottom: (view.screen === "categories" || view.screen === "category" || view.screen === "entry" || view.screen === "log")
                ? `2px solid ${temaOscuro ? EXPLORADOR_TOKENS.accent : TOKENS.primary}` : "2px solid transparent",
              marginBottom: -1,
            }}>
            EXPLORADOR
          </button>
          <button onClick={() => setView({ screen: "patrones" })}
            style={{
              background: "none", border: "none", cursor: "pointer", padding: "0 0 10px 0",
              fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.04em", fontWeight: 600,
              color: view.screen === "patrones"
                ? (temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink)
                : (temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim),
              borderBottom: view.screen === "patrones"
                ? `2px solid ${temaOscuro ? EXPLORADOR_TOKENS.menta : TOKENS.primary}` : "2px solid transparent",
              marginBottom: -1,
            }}>
            MIS PATRONES
          </button>
        </nav>

        {view.screen === "bienestar" && (
          <BienestarScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase} />
        )}

        {view.screen === "patrones" && (
          <PatronesScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase} onIrABienestar={() => setView({ screen: "bienestar" })} />
        )}

        {view.screen === "categories" && (
          <React.Fragment>
            <TableroAccesos
              onCargarComida={() => setView({ screen: "log" })}
              onRegistrarBienestar={() => setView({ screen: "bienestar" })}
              pase={usuario.pase}
            />
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: "rgba(242,239,233,0.85)", letterSpacing: "0.06em", marginBottom: 12, textTransform: "uppercase", fontWeight: 700 }}>
              Explora y descubre
            </p>
            <ExploradorScreen
              data={data}
              query={query}
              setQuery={setQuery}
              filteredCats={filteredCats}
              onSelectCategory={(name) => setView({ screen: "category", name })}
              grupoElegido={grupoElegido}
            />
          </React.Fragment>
        )}

        {view.screen === "log" && (
          <LogMealScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase}
            tieneCondicionMedica={lsGet("reseteo_condicion_medica") === "true"} />
        )}

        {view.screen === "category" && (() => {
          const cat = grupos[view.name] || [];
          return (
            <div className="fade-in">
              <button onClick={() => setView({ screen: "categories" })} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>
                ← Categorías
              </button>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
                <CategoryIcon name={view.name} />
                <h2 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 22, color: EXPLORADOR_TOKENS.textPrimary, letterSpacing: "-0.01em", margin: 0 }}>{view.name}</h2>
              </div>
              <div style={{ display: "grid", gap: 10 }}>
                {cat.map((entry) => (
                  <button key={entry.id} onClick={() => setView({ screen: "entry", id: entry.id, catName: view.name })} className="glass-press"
                    style={{
                      textAlign: "left", width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12,
                      background: EXPLORADOR_TOKENS.cardBg, ...EXPLORADOR_TOKENS.cardBevel,
                      backdropFilter: EXPLORADOR_TOKENS.cardBlur, WebkitBackdropFilter: EXPLORADOR_TOKENS.cardBlur,
                      borderRadius: 18, padding: 16, cursor: "pointer", boxShadow: EXPLORADOR_TOKENS.cardShadow,
                    }}>
                    <span style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14, fontWeight: 600 }}>{entry.combinacion}</span>
                    <EvidenceStamp level={entry.evidencia} />
                  </button>
                ))}
              </div>
            </div>
          );
        })()}

        {view.screen === "entry" && (() => {
          const cat = grupos[view.catName] || [];
          const entry = cat.find((e) => e.id === view.id);
          if (!entry) return null;
          const esPremium = usuario.nivelAcceso === "Premium";
          return (
            <div className="fade-in">
              <button onClick={() => setView({ screen: "category", name: view.catName })} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 20, cursor: "pointer", padding: 0 }}>
                ← Volver
              </button>
              <h2 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 25, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.2, marginBottom: 14, letterSpacing: "-0.01em" }}>{entry.combinacion}</h2>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
                <EvidenceStamp level={entry.evidencia} />
              </div>
              {esPremium ? (
                <React.Fragment>
                  <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 18 }}>
                    {entry.mecanismo && <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.textSecondary, marginBottom: 10, letterSpacing: "0.03em" }}>{entry.mecanismo}</p>}
                    <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textSecondary, fontSize: 14, lineHeight: 1.65 }}>{entry.resultado}</p>
                  </div>
                  {entry.frecuencia && (
                    <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 18, marginTop: 18 }}>
                      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.accent, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 700 }}>Frecuencia</p>
                      <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 14 }}>{entry.frecuencia}</p>
                    </div>
                  )}
                </React.Fragment>
              ) : (
                <div style={{ borderTop: `1px solid ${EXPLORADOR_TOKENS.cardBorder}`, paddingTop: 18 }}>
                  <div style={{ background: "rgba(197,160,89,0.12)", border: `1px solid rgba(197,160,89,0.3)`, borderRadius: 14, padding: "12px 14px" }}>
                    <p style={{ fontFamily: EXPLORADOR_TOKENS.font, color: EXPLORADOR_TOKENS.textPrimary, fontSize: 12.5, lineHeight: 1.6, margin: 0 }}>
                      💡 Esta herramienta sí tiene una forma concreta de aplicarse. Te mostramos el paso a paso en la sección Premium.
                    </p>
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        <footer style={{ marginTop: 40, paddingTop: 16, borderTop: `1px solid ${temaOscuro ? "rgba(255,255,255,0.18)" : TOKENS.border}`, textAlign: "center" }}>
          <a href="privacidad.html" style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 11, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, textDecoration: "none" }}>
            Política de privacidad
          </a>
          <span style={{ margin: "0 8px", color: temaOscuro ? "rgba(255,255,255,0.25)" : TOKENS.border }}>·</span>
          <button
            onClick={() => { lsRemove("reseteo_usuario"); lsRemove("reseteo_terminos_v1"); setUsuario(null); }}
            style={{ background: "none", border: "none", fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 11, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, cursor: "pointer", padding: 0 }}
          >
            Cerrar sesión ({usuario.email})
          </button>
        </footer>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
document.getElementById("diagnostico").style.display = "none";

</script>

<script>
(function () {
  try {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, { presets: ["react"] }).code;
    var run = new Function("React", "ReactDOM", output);
    run(React, ReactDOM);
  } catch (err) {
    var d = document.getElementById("diagnostico");
    d.style.display = "block";
    d.innerText = "ERROR REAL DETECTADO:\n" + ((err && (err.stack || err.message)) || err) +
      "\n\nMandale esta captura completa a Claude para resolverlo.";
  }
})();
</script>
</body>
</html>
