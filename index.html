  useEffect(() => {
    if (!usuario) return;
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get("payment_id");
    if (!paymentId) return;
    fetch("/api/premium?ruta=confirmar-mp", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${usuario.pase || ""}` },
      body: JSON.stringify({ paymentId }),
    })
      .then((r) => r.json())
      .then((d) => setResultadoMP(d))
      .catch(() => setResultadoMP({ ok: false }))
      .finally(() => {
        // Limpia el payment_id de la URL para que un refresh no vuelva a disparar esto.
        window.history.replaceState({}, "", window.location.pathname);
      });
  }, [usuario]);

  useEffect(() => {
    fetch("/api/data")
      .then((r) => r.json())
      .then((json) => {
        if (json.error) { setError(json.error); return; }
        setData(json);
      })
      .catch((e) => setError(String(e)));
  }, []);

  if (error) {
    return (
      <div style={{ padding: 24, color: TOKENS.ink, fontFamily: "'IBM Plex Sans', sans-serif" }}>
        <p style={{ color: "#B3453D" }}>Error cargando datos: {error}</p>
        <p style={{ color: TOKENS.inkDim, fontSize: 13 }}>
          Revisá que la variable de entorno AIRTABLE_API_KEY esté configurada en Vercel.
        </p>
      </div>
    );
  }

  if (!data) {
    return <div style={{ padding: 24, color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif" }}>Cargando...</div>;
  }

  if (!usuario) {
    return <LoginScreen onLogin={setUsuario} />;
  }

  if (esRutaAdmin) {
    return <AdminPremiumScreen pase={usuario.pase} />;
  }

  if (resultadoMP) {
    return <ConfirmacionMPScreen resultado={resultadoMP} onContinuar={() => setResultadoMP(null)} />;
  }

  if (!terminosAceptados) {
    return <TerminosGate pase={usuario.pase} onAceptar={() => {
      lsSet("reseteo_terminos_v1", "true");
      setTerminosAceptados(true);
    }} />;
  }

  if (!onboardingCompletado) {
    return <OnboardingFlow pase={usuario.pase} onCompletar={() => setOnboardingCompletado(true)} />;
  }

  const grupos = groupByCategoria(data.entradas);
  const grupoElegido = GRUPOS_OBJETIVO.find((g) => g.val === objetivoGrupo);
  const categoriasPrioritarias = grupoElegido
    ? grupoElegido.objetivos.filter((o) => grupos[o])
    : [];
  const categorias = [
    ...categoriasPrioritarias,
    ...Object.keys(grupos).filter((c) => !categoriasPrioritarias.includes(c)).sort(),
  ];

  const filteredCats = categorias
    .map((cat) => ({
      name: cat,
     entries: grupos[cat].filter((e) => {
  const SINONIMOS_SITUACION = {
    "cansancio": "energ", "cansado": "energ", "cansada": "energ", "bajón": "energ", "bajon": "energ",
    "pesadez": "digest", "pesado": "digest", "pesada": "digest",
    "sueño": "dormir", "sueno": "dormir", "somnolencia": "dormir",
    "hambre": "saciedad", "picoteo": "saciedad", "picotear": "saciedad",
    "recuperacion": "entren", "recuperación": "entren", "recupero": "entren", "actividad fisica": "entren", "actividad física": "entren",
  };
  const q = query.toLowerCase();
  const terminos = [q];
  for (const [clave, mapeo] of Object.entries(SINONIMOS_SITUACION)) {
    if (q.includes(clave)) terminos.push(mapeo);
  }
  const texto = (e.combinacion + " " + (e.mecanismo || "") + " " + (e.resultado || "")).toLowerCase();
  return terminos.some((t) => texto.includes(t));
}), 
    }))
    .filter((c) => query === "" || c.entries.length > 0);

  const temaOscuro = view.screen === "categories" || view.screen === "bienestar" || view.screen === "patrones"
    || view.screen === "log" || view.screen === "category" || view.screen === "entry" || view.screen === "premium";

  return (
    <div style={{ minHeight: "100vh", background: TOKENS.bg }}>
      <div style={{ position: "relative", background: temaOscuro ? EXPLORADOR_TOKENS.bg : "transparent", overflow: "hidden" }}>
        {/* Textura de fondo (03/08/2026, corrección técnica #2): el primer intento envolvía
            HojasDecorativas en un div extra con su propio position:absolute — quedaba un
            absolute-dentro-de-absolute con altura "auto" en ambos niveles, que algunos
            navegadores no resuelven bien (la textura terminaba con altura 0 en la práctica,
            visible solo donde por casualidad coincidía con la altura de la Portada). Se saca
            el div intermedio: HojasDecorativas ahora se posiciona directo contra el wrapper
            con position:relative (mismo patrón que ya funcionaba dentro de PortadaBanner). */}
        {temaOscuro && <HojasDecorativas zIndex={0} />}
        {view.screen === "categories" && (
          <PortadaBanner abierto={portadaLeerMas} onToggle={() => setPortadaLeerMas((v) => !v)} />
        )}
        <div style={{ position: "relative", zIndex: 1, maxWidth: 640, margin: "0 auto", padding: temaOscuro ? "20px 20px 60px" : "28px 20px 60px" }}>
        <header style={{ marginBottom: 24, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
          <div>
            <p style={{
              fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace",
              fontSize: 11, color: temaOscuro ? EXPLORADOR_TOKENS.accent : TOKENS.primary,
              letterSpacing: "0.08em", marginBottom: 6, textTransform: "uppercase", fontWeight: temaOscuro ? 600 : 400,
            }}>
              Comida real · Dato verificable · Sincronizado {new Date(data.actualizado).toLocaleString("es-AR")}
            </p>
            {view.screen === "categories" && grupoElegido ? (
              <React.Fragment>
                <h1 style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 26, color: temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.2, letterSpacing: "-0.02em", margin: 0 }}>
                  {grupoElegido.icon} Tu objetivo: {grupoElegido.label}
                </h1>
                <p style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Sans', sans-serif", fontSize: 13, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, marginTop: 6, marginBottom: 0, lineHeight: 1.5 }}>
                  {grupoElegido.detalle} Empezamos por acá — el resto sigue disponible cuando quieras.
                </p>
              </React.Fragment>
            ) : view.screen === "bienestar" ? (
              <h1 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 26, color: EXPLORADOR_TOKENS.textPrimary, lineHeight: 1.15, letterSpacing: "-0.01em", margin: 0 }}>
                ¿Cómo te sentís hoy?
              </h1>
            ) : view.screen === "patrones" ? (
              <React.Fragment>
                <h1 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 24, color: "#F2F5F3", lineHeight: 1.2, letterSpacing: "0.01em", margin: 0, textTransform: "uppercase" }}>
                  Mis patrones
                </h1>
                <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11.5, color: "rgba(143,168,155,0.85)", marginTop: 6, marginBottom: 0, lineHeight: 1.5, letterSpacing: "0.02em", textTransform: "uppercase" }}>
                  Cruzamos tu alimentación y bienestar para revelar tus patrones biológicos
                </p>
              </React.Fragment>
            ) : view.screen === "categories" ? (
              // P0.1 (Marketing, Fase 2) — reencuadre del Explorador como "puerta de
              // entrada" en vez de biblioteca. No toca la agrupación por objetivo
              // (GRUPOS_OBJETIVO/onboarding, ya aprobada) — es solo el mensaje de
              // bienvenida para quien todavía no eligió un objetivo.
              <React.Fragment>
                <h1 style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 28, color: temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.15, letterSpacing: "-0.02em", margin: 0 }}>
                  ¿Qué querés explorar hoy?
                </h1>
                <p style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Sans', sans-serif", fontSize: 13, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, marginTop: 6, marginBottom: 0, lineHeight: 1.5 }}>
                  Elegí algo que te interese y descubrí qué podés probar en tu propio contexto.
                </p>
              </React.Fragment>
            ) : (
              <h1 style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 28, color: temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.15, letterSpacing: "-0.02em", margin: 0 }}>
                Explorador por problemática
              </h1>
            )}
          </div>
        </header>

        <nav style={{ display: "flex", gap: 20, marginBottom: 24, borderBottom: `1px solid ${temaOscuro ? "rgba(255,255,255,0.15)" : TOKENS.border}` }}>
          <button onClick={() => setView({ screen: "categories" })}
            style={{
              background: "none", border: "none", cursor: "pointer", padding: "0 0 10px 0",
              fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.04em", fontWeight: 600,
              color: (view.screen === "categories" || view.screen === "category" || view.screen === "entry" || view.screen === "log")
                ? (temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink)
                : (temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim),
              borderBottom: (view.screen === "categories" || view.screen === "category" || view.screen === "entry" || view.screen === "log")
                ? `2px solid ${temaOscuro ? EXPLORADOR_TOKENS.accent : TOKENS.primary}` : "2px solid transparent",
              marginBottom: -1,
            }}>
            EXPLORADOR
          </button>
          <button onClick={() => setView({ screen: "patrones" })}
            style={{
              background: "none", border: "none", cursor: "pointer", padding: "0 0 10px 0",
              fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.04em", fontWeight: 600,
              color: view.screen === "patrones"
                ? (temaOscuro ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink)
                : (temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim),
              borderBottom: view.screen === "patrones"
                ? `2px solid ${temaOscuro ? EXPLORADOR_TOKENS.menta : TOKENS.primary}` : "2px solid transparent",
              marginBottom: -1,
            }}>
            MIS PATRONES
          </button>
        </nav>

        {view.screen === "bienestar" && (
          <BienestarScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase} onVerMisPatrones={() => setView({ screen: "patrones" })} />
        )}

        {view.screen === "patrones" && (
          <PatronesScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase} onIrABienestar={() => setView({ screen: "bienestar" })} />
        )}

        {view.screen === "categories" && (
          <React.Fragment>
            <TableroAccesos
              onCargarComida={() => setView({ screen: "log" })}
              onRegistrarBienestar={() => setView({ screen: "bienestar" })}
              onVerMisPatrones={() => setView({ screen: "patrones" })}
              onVerPremium={() => setView({ screen: "premium" })}
              pase={usuario.pase}
              prefillPlanificar={view.prefillPlanificar}
              onPrefillConsumido={() => setView((v) => ({ ...v, prefillPlanificar: undefined }))}
            />
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 12, color: "rgba(242,239,233,0.85)", letterSpacing: "0.06em", marginBottom: 12, textTransform: "uppercase", fontWeight: 700 }}>
              Explora y descubre
            </p>
            <ExploradorScreen
              data={data}
              query={query}
              setQuery={setQuery}
              filteredCats={filteredCats}
              onSelectCategory={(name) => setView({ screen: "category", name })}
              grupoElegido={grupoElegido}
              pase={usuario.pase}
            />
          </React.Fragment>
        )}

        {view.screen === "log" && (
          <LogMealScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase}
            tieneCondicionMedica={lsGet("reseteo_condicion_medica") === "true"}
            onIrABienestar={() => setView({ screen: "bienestar" })}
            onVerPremium={() => setView({ screen: "premium" })} />
        )}

        {view.screen === "category" && (() => {
          const cat = grupos[view.name] || [];
          return (
            <div className="fade-in">
              <button onClick={() => setView({ screen: "categories" })} style={{ background: "none", border: "none", color: EXPLORADOR_TOKENS.textSecondary, fontFamily: EXPLORADOR_TOKENS.font, fontSize: 13, marginBottom: 16, cursor: "pointer", padding: 0 }}>
                ← Categorías
              </button>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
                <CategoryIcon name={view.name} />
                <h2 style={{ fontFamily: EXPLORADOR_TOKENS.font, fontWeight: 800, fontSize: 22, color: EXPLORADOR_TOKENS.textPrimary, letterSpacing: "-0.01em", margin: 0 }}>{view.name}</h2>
              </div>
              <div style={{ display: "grid", gap: 10 }}>
                {[...cat].sort((a, b) => {
                  const pa = clasificarEntrada(a).prioridad;
                  const pb = clasificarEntrada(b).prioridad;
                  if (pa !== pb) return pa.localeCompare(pb);
                  return (a.orden_prioridad ?? Infinity) - (b.orden_prioridad ?? Infinity);
                }).map((entry) => (
                  <CardExploraV2 key={entry.id} entry={entry} onClick={() => setView({ screen: "entry", id: entry.id, catName: view.name })} />
                ))}
              </div>
            </div>
          );
        })()}

        {view.screen === "entry" && (() => {
          const cat = grupos[view.catName] || [];
          const entry = cat.find((e) => e.id === view.id);
          if (!entry) return null;
          const esPremium = usuario.nivelAcceso === "Premium";
          return (
            <EntryDetalleFase2 entry={entry} esPremium={esPremium} pase={usuario.pase}
              onVolver={() => setView({ screen: "category", name: view.catName })}
              onVerPremium={() => setView({ screen: "premium", origen: "entry", id: entry.id, catName: view.catName })}
              onVerEnPlanificar={(texto) => setView({ screen: "categories", prefillPlanificar: texto })} />
          );
        })()}

        {view.screen === "premium" && (
          <PremiumScreen pase={usuario.pase} onVolver={() => setView(view.origen === "entry" ? { screen: "entry", id: view.id, catName: view.catName } : { screen: "categories" })} />
        )}

        <footer style={{ marginTop: 40, paddingTop: 16, borderTop: `1px solid ${temaOscuro ? "rgba(255,255,255,0.18)" : TOKENS.border}`, textAlign: "center" }}>
          <a href="privacidad.html" style={{ fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 11, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, textDecoration: "none" }}>
            Política de privacidad
          </a>
          <span style={{ margin: "0 8px", color: temaOscuro ? "rgba(255,255,255,0.25)" : TOKENS.border }}>·</span>
          <button
            onClick={() => { lsRemove("reseteo_usuario"); lsRemove("reseteo_terminos_v1"); setUsuario(null); }}
            style={{ background: "none", border: "none", fontFamily: temaOscuro ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 11, color: temaOscuro ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, cursor: "pointer", padding: 0 }}
          >
            Cerrar sesión ({usuario.email})
          </button>
        </footer>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
document.getElementById("diagnostico").style.display = "none";

</script>

<script>
(function () {
  try {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, { presets: ["react"] }).code;
    var run = new Function("React", "ReactDOM", output);
    run(React, ReactDOM);
  } catch (err) {
    var d = document.getElementById("diagnostico");
    d.style.display = "block";
    d.innerText = "ERROR REAL DETECTADO:\n" + ((err && (err.stack || err.message)) || err) +
      "\n\nMandale esta captura completa a Claude para resolverlo.";
  }
})();
</script>
</body>
</html>
