// Helpers de localStorage (03/08/2026 — corrección de hallazgo real): varios accesos
// directos a localStorage en el archivo NO estaban protegidos con try/catch. En
// navegadores con storage bloqueado (modo privado con política estricta, extensiones de
// privacidad, storage deshabilitado por el usuario), localStorage.getItem/setItem puede
// lanzar SecurityError — y como alguno de esos accesos vive dentro de un inicializador de
// useState, un error ahí rompe el render inicial de React entero, no solo esa función.
// Se centralizan acá los tres accesos (get/set/remove) para que TODO el archivo pase por
// un único punto ya protegido, en vez de tener try/catch repetido y potencialmente
// olvidado en algún lugar nuevo a futuro.
function lsGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { console.warn("localStorage inaccesible (get):", e); return null; }
}
function lsSet(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { console.warn("localStorage inaccesible (set):", e); }
}
function lsRemove(key) {
  try { window.localStorage.removeItem(key); } catch (e) { console.warn("localStorage inaccesible (remove):", e); }
}

function groupByCategoria(entradas) {
  const grupos = {};
  entradas.forEach((e) => {
    let claves = e.categorias && e.categorias.length ? e.categorias : null;
    if (!claves) {
      claves = [e.tipo === "protocolo" ? "Hábitos y Rutinas" : "Sin categorizar (pendiente)"];
    }
    claves.forEach((cat) => {
      if (!grupos[cat]) grupos[cat] = [];
      grupos[cat].push(e);
    });
  });
  return grupos;
}

function BloqueoCard({ b, pase, tieneCondicionMedica }) {
  const requiereConsentimiento = b.nivelRiesgo && b.nivelRiesgo !== "Bajo";
  const [confirmado, setConfirmado] = useState(!requiereConsentimiento);
  const [enviando, setEnviando] = useState(false);

  async function confirmarRiesgo() {
    setEnviando(true);
    try {
      await fetch("/api/registrar-consentimiento-riesgo", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ bloqueo: b.combinacion, nivelRiesgo: b.nivelRiesgo }),
      });
    } catch (e) {
      // no bloqueamos al usuario si falla el log; solo lo dejamos avanzar
    } finally {
      setEnviando(false);
      setConfirmado(true);
    }
  }

  return (
    <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 18 }}>
      <p style={{ color: TOKENS.ink, fontSize: 15, fontWeight: 600, marginBottom: 8 }}>{b.combinacion}</p>
      <p style={{ color: TOKENS.inkDim, fontSize: 13, lineHeight: 1.6, marginBottom: (b.solucion || b.invitacionPremium) ? 12 : 0 }}>{b.resultado}</p>

      {!confirmado && (
        <div style={{ borderTop: `1px solid ${TOKENS.border}`, paddingTop: 12 }}>
          <p style={{ fontSize: 12.5, color: TOKENS.ink, lineHeight: 1.55, marginBottom: 10 }}>
            ⚠️ Este patrón tiene nivel de riesgo <b>{b.nivelRiesgo}</b>: implica más variabilidad individual, o mayor cuidado si aplica en tu caso.
            {tieneCondicionMedica && " Marcaste que tenés una condición médica preexistente — consultá con tu profesional antes de aplicar cualquier sugerencia."}
          </p>
          <button onClick={confirmarRiesgo} disabled={enviando}
            style={{ width: "100%", background: TOKENS.primary, border: "none", borderRadius: 8, padding: "10px", color: "#FFFFFF", fontWeight: 600, fontSize: 13, cursor: "pointer" }}>
            {enviando ? "..." : "Entiendo, ver la sugerencia"}
          </button>
        </div>
      )}

      {confirmado && b.solucion && (
        <div style={{ borderTop: `1px solid ${TOKENS.border}`, paddingTop: 12 }}>
          <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: TOKENS.primary, marginBottom: 4, letterSpacing: "0.05em", textTransform: "uppercase" }}>Solución</p>
          <p style={{ color: TOKENS.ink, fontSize: 13, lineHeight: 1.6 }}>{b.solucion.adaptacion}</p>
        </div>
      )}

      {confirmado && !b.solucion && b.invitacionPremium && (
        <div style={{ borderTop: `1px solid ${TOKENS.border}`, paddingTop: 12, marginTop: 4 }}>
          <div style={{ background: TOKENS.primarySoft, borderRadius: 8, padding: "12px 14px" }}>
            <p style={{ color: TOKENS.ink, fontSize: 12.5, lineHeight: 1.6, margin: 0 }}>
              💡 {b.invitacionPremium}
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

function LogMealScreen({ onBack, pase, tieneCondicionMedica }) {
  const [texto, setTexto] = useState("");
  const [momento, setMomento] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);

  const enviar = async () => {
    if (!texto.trim()) return;
    setEnviando(true);
    setError(null);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto, momento: momento || undefined }),
      });
      const data = await resp.json();
      if (data.error) {
        if (data.requiereTerminos) {
          lsRemove("reseteo_terminos_v1");
          window.location.reload();
          return;
        }
        throw new Error(data.error);
      }
      setResultado(data);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  };

  if (resultado) {
    const bloqueos = resultado.bloqueos || [];
    const resueltos = resultado.resueltos || [];
    const sugerencias = resultado.sugerencias || [];
    return (
      <div className="fade-in">
        <button onClick={onBack} style={{ background: "none", border: "none", color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, marginBottom: 20, cursor: "pointer", padding: 0 }}>
          ← Categorías
        </button>
        <h2 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 700, fontSize: 21, color: TOKENS.ink, marginBottom: 16, letterSpacing: "-0.01em" }}>
          {bloqueos.length > 0
            ? "Esto vale la pena mirarlo"
            : resueltos.length > 0
            ? "Buena elección"
            : "Bien ahí, sin nada para ajustar"}
        </h2>
        {bloqueos.length === 0 && resueltos.length === 0 && sugerencias.length === 0 && (
          <p style={{ color: TOKENS.inkDim, fontSize: 14, lineHeight: 1.6 }}>No encontramos nada que valga la pena señalarte en lo que registraste. Igual quedó guardado en tu historial.</p>
        )}
        {resueltos.length > 0 && (
          <div style={{ display: "grid", gap: 12, marginBottom: bloqueos.length ? 16 : 0 }}>
            {resueltos.map((r, i) => (
              <div key={"resuelto-" + i} style={{ background: TOKENS.alto + "0D", border: `1px solid ${TOKENS.alto}55`, borderRadius: 8, padding: 18 }}>
                <p style={{ color: TOKENS.alto, fontSize: 12, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", marginBottom: 6 }}>✓ Hackeo ya aplicado</p>
                <p style={{ color: TOKENS.ink, fontSize: 14, fontWeight: 600, marginBottom: 6 }}>{r.combinacion}</p>
                <p style={{ color: TOKENS.inkDim, fontSize: 13, lineHeight: 1.6 }}>{r.mensaje}</p>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "grid", gap: 12 }}>
          {bloqueos.map((b, i) => (
            <BloqueoCard key={i} b={b} pase={pase} tieneCondicionMedica={tieneCondicionMedica} />
          ))}
        </div>
        {sugerencias.length > 0 && (
          <div style={{ display: "grid", gap: 12, marginTop: bloqueos.length ? 16 : 0 }}>
            {sugerencias.map((s, i) => (
              <div key={"sugerencia-" + i} style={{ background: TOKENS.primarySoft, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 18 }}>
                <p style={{ color: TOKENS.primary, fontSize: 12, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", marginBottom: 6 }}>💡 Tip relacionado</p>
                <p style={{ color: TOKENS.ink, fontSize: 14, fontWeight: 600, marginBottom: 6 }}>{s.nombre}</p>
                <p style={{ color: TOKENS.inkDim, fontSize: 13, lineHeight: 1.6 }}>{s.mecanismo}</p>
              </div>
            ))}
          </div>
        )}
        {/* PUNTO DE INTEGRACIÓN — Primer Recorrido del Usuario (Sprint 9):
            Acá, inmediatamente después de mostrar el resultado del primer registro de comida,
            podrá insertarse la invitación opcional a registrar bienestar (energía, digestión,
            sueño, hidratación, actividad física — actualizado 30/07/2026, ver BienestarScreen)
            sin rehacer este flujo. BienestarScreen ya existe como
            componente independiente y reutilizable — solo falta decidir, con la Especificación
            Funcional de Arquitectura, si se renderiza inline acá o se navega a él. No implementado
            todavía por instrucción explícita del Sprint. */}
        <button onClick={() => { setResultado(null); setTexto(""); setMomento(""); }}
          style={{ marginTop: 20, width: "100%", background: TOKENS.primary, border: "none", borderRadius: 8, padding: "13px", color: "#FFFFFF", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
          Registrar otra comida
        </button>
      </div>
    );
  }

  return (
    <div className="fade-in">
      <button onClick={onBack} style={{ background: "none", border: "none", color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, marginBottom: 20, cursor: "pointer", padding: 0 }}>
        ← Categorías
      </button>
      <h2 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 700, fontSize: 23, color: TOKENS.ink, marginBottom: 8, letterSpacing: "-0.01em" }}>
        Cargar comida
      </h2>
      <p style={{ color: TOKENS.inkDim, fontSize: 13, marginBottom: 20, lineHeight: 1.5 }}>
        Contanos qué comiste, en tus palabras. Buscamos combinaciones conocidas automáticamente.
      </p>
      <textarea
        value={texto}
        onChange={(e) => setTexto(e.target.value)}
        placeholder="Ej: fideos con salsa de carne y queso rallado"
        rows={4}
        style={{ width: "100%", background: TOKENS.surface, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 14, color: TOKENS.ink, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, marginBottom: 14, resize: "vertical" }}
      />
      <select
        value={momento}
        onChange={(e) => setMomento(e.target.value)}
        style={{ width: "100%", background: TOKENS.surface, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 12, color: TOKENS.ink, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, marginBottom: 16 }}
      >
        <option value="">Momento del día (opcional)</option>
        <option value="Desayuno">Desayuno</option>
        <option value="Almuerzo">Almuerzo</option>
        <option value="Cena">Cena</option>
        <option value="Snack">Snack</option>
      </select>
      {error && <p style={{ color: "#B3453D", fontSize: 13, marginBottom: 12 }}>{error}</p>}
      <button onClick={enviar} disabled={enviando || !texto.trim()}
        style={{ width: "100%", background: enviando || !texto.trim() ? TOKENS.borderStrong : TOKENS.primary, border: "none", borderRadius: 8, padding: "13px", color: "#FFFFFF", fontWeight: 600, fontSize: 14, cursor: enviando ? "default" : "pointer" }}>
        {enviando ? "Buscando bloqueos..." : "Registrar comida"}
      </button>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);

  async function handleCredentialResponse(response) {
    setCargando(true);
    setError(null);
    try {
      const resp = await fetch("/api/login-google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      lsSet("reseteo_usuario", JSON.stringify(data));
      onLogin(data);
    } catch (e) {
      setError(String(e.message || e));
      setCargando(false);
    }
  }

  useEffect(() => {
    let cancelado = false;
    function intentarRenderizar() {
      if (cancelado) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(intentarRenderizar, 200);
        return;
      }
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      window.google.accounts.id.renderButton(
        document.getElementById("google-signin-button"),
        { theme: "outline", size: "large", width: 280, text: "signin_with" }
      );
    }
    intentarRenderizar();
    return () => { cancelado = true; };
  }, []);

  return (
    <div style={{ minHeight: "100vh", background: TOKENS.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ maxWidth: 340, textAlign: "center" }}>
        <h1 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 26, color: TOKENS.ink, marginBottom: 10, letterSpacing: "-0.02em" }}>
          Reseteo Propio
        </h1>
        <p style={{ color: TOKENS.inkDim, fontSize: 13.5, marginBottom: 28, lineHeight: 1.5 }}>
          Te mostramos el mapa. El camino, lo elegís vos.
        </p>
        <div id="google-signin-button" style={{ display: "flex", justifyContent: "center" }}></div>
        {cargando && <p style={{ color: TOKENS.inkDim, fontSize: 13, marginTop: 16 }}>Ingresando...</p>}
        {error && <p style={{ color: "#B3453D", fontSize: 13, marginTop: 16 }}>{error}</p>}
      </div>
    </div>
  );
}

// Tablero de accesos (30/07/2026): agrupa comida + bienestar (que ya cubre sueño,
// hidratación y actividad física) en UN solo lugar visual — no un botón suelto por cada
// cosa, ni un formulario que obligue a cargar las cuatro juntas. Cada acceso sigue siendo
// independiente puertas adentro (LogMealScreen / BienestarScreen), esto es solo la puerta
// de entrada común.
function PlanificarPanel({ pase }) {
  const [texto, setTexto] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);

  async function ver() {
    if (!texto.trim()) return;
    setEnviando(true);
    setError(null);
    setResultado(null);
    try {
      const resp = await fetch("/api/registrar-comida", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ texto, soloVista: true }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      setResultado(data);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  }

  return (
    <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.border}`, borderRadius: 10, padding: 16, marginTop: 10 }} className="fade-in">
      <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: TOKENS.inkDim, marginBottom: 10, lineHeight: 1.5 }}>
        Escribí lo que estás por comer — esto NO se guarda en tu historial, es solo para que decidas con más info.
      </p>
      <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={2} placeholder="Ej: milanesa con papas fritas"
        style={{ width: "100%", border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 10, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, marginBottom: 10, resize: "vertical" }} />
      <button onClick={ver} disabled={!texto.trim() || enviando}
        style={{ background: TOKENS.primary, border: "none", borderRadius: 8, padding: "9px 16px", color: "#FFFFFF", fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
        {enviando ? "..." : "Ver antes de comer"}
      </button>

      {error && <p style={{ color: "#B3453D", fontSize: 12.5, marginTop: 12 }}>{error}</p>}

      {resultado && (
        <div style={{ marginTop: 14, borderTop: `1px solid ${TOKENS.border}`, paddingTop: 14 }}>
          {resultado.bloqueos.length === 0 ? (
            <p style={{ fontSize: 13, color: TOKENS.ink, fontWeight: 600 }}>Bien ahí, sin nada para ajustar.</p>
          ) : (
            resultado.bloqueos.map((b, i) => (
              <div key={i} style={{ marginBottom: i === resultado.bloqueos.length - 1 ? 0 : 14 }}>
                <p style={{ fontSize: 13, fontWeight: 600, color: TOKENS.ink, marginBottom: 4 }}>{b.combinacion}</p>
                <p style={{ fontSize: 12.5, color: TOKENS.inkDim, lineHeight: 1.5, marginBottom: (b.solucion || b.invitacionPremium) ? 8 : 0 }}>{b.resultado}</p>
                {b.solucion && (
                  <p style={{ fontSize: 12.5, color: TOKENS.ink, lineHeight: 1.5 }}>{b.solucion.adaptacion}</p>
                )}
                {!b.solucion && b.invitacionPremium && (
                  <div style={{ background: TOKENS.primarySoft, borderRadius: 8, padding: "10px 12px", marginTop: 4 }}>
                    <p style={{ color: TOKENS.ink, fontSize: 12, lineHeight: 1.5, margin: 0 }}>💡 {b.invitacionPremium}</p>
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error atrapado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "'IBM Plex Sans', sans-serif" }}>
          <p style={{ color: "#B3453D", fontWeight: 700, fontSize: 15, marginBottom: 10 }}>Error real en la app:</p>
          <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: 12, color: "#101826", background: "#FFFFFF", border: "1px solid #E2E6EB", borderRadius: 8, padding: 14, lineHeight: 1.5 }}>
            {String((this.state.error && (this.state.error.stack || this.state.error.message)) || this.state.error)}
          </pre>
          <p style={{ fontSize: 12, color: "#5B6472", marginTop: 12 }}>Mandale este texto completo a Claude para resolverlo.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

function TerminosGate({ pase, onAceptar }) {
  const [checkTerminos, setCheckTerminos] = useState(false);
  const [condicionMedica, setCondicionMedica] = useState(null); // null | true | false
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState(null);

  const puedeContinuar = checkTerminos && condicionMedica !== null;

  async function confirmar() {
    if (!puedeContinuar) return;
    setEnviando(true);
    setError(null);
    try {
      const resp = await fetch("/api/aceptar-terminos", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
        body: JSON.stringify({ condicionMedica }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "No se pudo registrar la aceptación.");
      lsSet("reseteo_condicion_medica", condicionMedica ? "true" : "false");
      onAceptar();
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setEnviando(false);
    }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, background: TOKENS.bg }}>
      <div style={{ maxWidth: 440, width: "100%" }}>
        <h1 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 22, color: TOKENS.ink, marginBottom: 12, letterSpacing: "-0.02em" }}>
          Antes de arrancar
        </h1>
        <p style={{ color: TOKENS.inkDim, fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 }}>
          Reseteo Propio es una herramienta de auto-observación de patrones alimentarios. <b>No diagnostica ni trata condiciones médicas</b>, y no reemplaza la consulta con un profesional de la salud.
        </p>

        <label style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 18, cursor: "pointer" }}>
          <input type="checkbox" checked={checkTerminos} onChange={(e) => setCheckTerminos(e.target.checked)} style={{ marginTop: 3, width: 18, height: 18, flexShrink: 0 }} />
          <span style={{ fontSize: 13.5, color: TOKENS.ink, lineHeight: 1.5 }}>
            Leí y acepto los <a href="/privacidad.html" target="_blank" style={{ color: TOKENS.primary }}>Términos y la Política de Privacidad</a>. Entiendo que las sugerencias de la app son informativas, no médicas.
          </span>
        </label>

        <p style={{ fontSize: 13.5, color: TOKENS.ink, marginBottom: 10, fontWeight: 600 }}>
          ¿Tenés algún diagnóstico médico preexistente (ej. diabetes, hipotiroidismo, patologías cardíacas, renales, etc.)?
        </p>
        <div style={{ display: "flex", gap: 10, marginBottom: 22 }}>
          {[{ label: "No", val: false }, { label: "Sí", val: true }].map((op) => (
            <button key={op.label} onClick={() => setCondicionMedica(op.val)}
              style={{
                flex: 1, padding: "12px", borderRadius: 8, cursor: "pointer",
                border: `1.5px solid ${condicionMedica === op.val ? TOKENS.primary : TOKENS.border}`,
                background: condicionMedica === op.val ? TOKENS.primarySoft : TOKENS.surface,
                color: TOKENS.ink, fontWeight: 600, fontSize: 14,
              }}>
              {op.label}
            </button>
          ))}
        </div>

        {condicionMedica === true && (
          <div style={{ background: TOKENS.primarySoft, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 14, marginBottom: 18 }}>
            <p style={{ fontSize: 13, color: TOKENS.ink, lineHeight: 1.5, margin: 0 }}>
              Por seguridad, te vamos a mostrar una confirmación extra cada vez que aparezca una sugerencia que amerite más cuidado en tu caso. Igual, consultá siempre con tu profesional antes de aplicar cambios.
            </p>
          </div>
        )}

        {error && <p style={{ color: "#B3453D", fontSize: 13, marginBottom: 12 }}>{error}</p>}

        <button onClick={confirmar} disabled={!puedeContinuar || enviando}
          style={{
            width: "100%", border: "none", borderRadius: 8, padding: "13px", fontWeight: 600, fontSize: 14,
            color: "#FFFFFF", cursor: puedeContinuar && !enviando ? "pointer" : "not-allowed",
            background: puedeContinuar && !enviando ? TOKENS.primary : TOKENS.borderStrong,
          }}>
          {enviando ? "Guardando..." : "Continuar"}
        </button>
      </div>
    </div>
  );
}

function OnboardingFlow({ pase, onCompletar }) {
  const [paso, setPaso] = useState(1);
  const [nombre, setNombre] = useState("");
  const [objetivoGrupo, setObjetivoGrupo] = useState(null);
  const [guardando, setGuardando] = useState(false);

  async function guardarNombreYAvanzar() {
    const nombreLimpio = nombre.trim();
    if (nombreLimpio) {
      setGuardando(true);
      try {
        await fetch("/api/actualizar-nombre", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
          body: JSON.stringify({ nombreAlias: nombreLimpio }),
        });
      } catch (e) {
        // No bloquea el onboarding si falla — el nombre es un detalle de personalización,
        // no una condición de acceso (mismo criterio que emitirEvento: no intrusivo).
        console.error("No se pudo guardar el nombre:", e);
      } finally {
        setGuardando(false);
      }
    }
    setPaso(2);
  }

  async function guardarObjetivoYAvanzar() {
    if (objetivoGrupo) {
      try {
        lsSet("reseteo_objetivo_grupo", objetivoGrupo);
      } catch (e) {}
      try {
        await fetch("/api/actualizar-objetivo", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${pase || ""}` },
          body: JSON.stringify({ objetivoGrupo }),
        });
      } catch (e) {
        // Mismo criterio que el nombre: no bloquea el onboarding si falla.
        console.error("No se pudo guardar el objetivo:", e);
      }
    }
    setPaso(3);
  }

  function completarOnboarding() {
    try {
      lsSet("reseteo_onboarding_v1", "true");
    } catch (e) {}
    onCompletar();
  }

  const cardStyle = {
    maxWidth: 440, width: "100%", background: TOKENS.surface,
    border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 28,
  };
  const wrapStyle = {
    minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
    padding: 24, background: TOKENS.bg,
  };
  const h1Style = {
    fontFamily: "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 22,
    color: TOKENS.ink, marginBottom: 10, letterSpacing: "-0.02em",
  };
  const pStyle = { color: TOKENS.inkDim, fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 };
  const inputStyle = {
    width: "100%", padding: "12px 14px", borderRadius: 8, marginBottom: 18,
    border: `1.5px solid ${TOKENS.border}`, fontFamily: "'IBM Plex Sans', sans-serif",
    fontSize: 14, color: TOKENS.ink, outline: "none",
  };

  if (paso === 1) {
    return (
      <div style={wrapStyle} className="fade-in">
        <div style={cardStyle}>
          <OnboardingProgreso paso={1} />
          <OnboardingEyebrow>Reseteo Propio · Paso 1 de 3</OnboardingEyebrow>
          <h1 style={h1Style}>¿Cómo querés que te llamemos?</h1>
          <p style={pStyle}>Nada de formularios largos. Esto es tuyo: un espacio para observar cómo responde tu cuerpo a tus propios hábitos, a tu ritmo.</p>
          <input
            style={inputStyle} placeholder="Ej: Augusto, Gustavo, Tucumanito..."
            value={nombre} onChange={(e) => setNombre(e.target.value)}
          />
          <OnboardingBotonPrimario onClick={guardarNombreYAvanzar} disabled={guardando}>
            {guardando ? "Guardando..." : "Continuar"}
          </OnboardingBotonPrimario>
          <OnboardingBotonFantasma onClick={() => setPaso(2)}>Prefiero omitir esto por ahora</OnboardingBotonFantasma>
        </div>
      </div>
    );
  }

  if (paso === 2) {
    return (
      <div style={wrapStyle} className="fade-in">
        <div style={cardStyle}>
          <OnboardingProgreso paso={2} />
          <OnboardingEyebrow>Reseteo Propio · Paso 2 de 3</OnboardingEyebrow>
          <h1 style={h1Style}>¿Qué objetivo le das a Reseteo Propio?</h1>
          <p style={pStyle}>No hay respuesta incorrecta. Con esto ordenamos lo que ves primero — podés cambiarlo cuando quieras.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 22 }}>
            {GRUPOS_OBJETIVO.map((op) => (
              <button key={op.val} onClick={() => setObjetivoGrupo(op.val)} style={{
                padding: "14px 14px", borderRadius: 8, cursor: "pointer", textAlign: "left",
                border: `1.5px solid ${objetivoGrupo === op.val ? TOKENS.primary : TOKENS.border}`,
                background: objetivoGrupo === op.val ? TOKENS.primarySoft : TOKENS.surface,
                display: "flex", alignItems: "flex-start", gap: 12,
              }}>
                <span style={{ fontSize: 20, lineHeight: 1.3 }}>{op.icon}</span>
                <span>
                  <span style={{ display: "block", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, fontWeight: 600, color: TOKENS.ink }}>{op.label}</span>
                  <span style={{ display: "block", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: TOKENS.inkDim, marginTop: 2, lineHeight: 1.4 }}>{op.detalle}</span>
                </span>
              </button>
            ))}
          </div>
          <OnboardingBotonPrimario onClick={guardarObjetivoYAvanzar} disabled={!objetivoGrupo}>Continuar</OnboardingBotonPrimario>
          <OnboardingBotonFantasma onClick={() => setPaso(3)}>Prefiero verlo yo mismo, todavía no sé</OnboardingBotonFantasma>
        </div>
      </div>
    );
  }

  if (paso === 3) {
    return (
      <div style={wrapStyle} className="fade-in">
        <div style={cardStyle}>
          <OnboardingProgreso paso={3} />
          <OnboardingEyebrow>Reseteo Propio · Paso 3 de 3</OnboardingEyebrow>
          <h1 style={h1Style}>Así funciona un "hackeo"</h1>
          <p style={pStyle}>No te vamos a decir qué no comer. Te mostramos cómo mejorar lo que ya elegiste.</p>
          <div style={{ background: TOKENS.primarySoft, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 14, marginBottom: 22, display: "flex", gap: 12, alignItems: "flex-start" }}>
            <span style={{ fontSize: 20 }}>🍚</span>
            <p style={{ margin: 0, fontSize: 13, lineHeight: 1.55, color: TOKENS.ink }}>
              Registrás <b>"arroz con pollo"</b> → te contamos que si comés el arroz que sobra frío al otro día (por ejemplo en una ensalada), tu cuerpo lo procesa distinto y le hace mejor a tu flora intestinal. Mismo arroz, mejor resultado.
            </p>
          </div>
          <OnboardingBotonPrimario onClick={completarOnboarding}>Entendido, quiero probar</OnboardingBotonPrimario>
        </div>
      </div>
    );
  }
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  // PUNTO DE INTEGRACIÓN — Primer Recorrido del Usuario (Sprint 9): RESUELTO (25/07/2026).
  // No se tocó el valor por defecto de "view" ni ExploradorScreen. En cambio, se agregó
  // un gate independiente (OnboardingFlow, más abajo) con el mismo patrón que TerminosGate:
  // se muestra ANTES de llegar a este árbol de pantallas, y una vez completado deja pasar
  // a "categories" como siempre. ExploradorScreen queda intacto y reutilizable.
  const [view, setView] = useState({ screen: "categories" });
  const [query, setQuery] = useState("");
  const [portadaLeerMas, setPortadaLeerMas] = useState(false);
  const [usuario, setUsuario] = useState(() => {
    try {
      const guardado = lsGet("reseteo_usuario");
      return guardado ? JSON.parse(guardado) : null;
    } catch (e) {
      return null;
    }
  });
  const [terminosAceptados, setTerminosAceptados] = useState(
    () => lsGet("reseteo_terminos_v1") === "true"
  );
  const [onboardingCompletado, setOnboardingCompletado] = useState(
    () => lsGet("reseteo_onboarding_v1") === "true"
  );

  const [objetivoGrupo] = useState(() => {
    return lsGet("reseteo_objetivo_grupo");
  });

  useEffect(() => {
    fetch("/api/data")
      .then((r) => r.json())
      .then((json) => {
        if (json.error) { setError(json.error); return; }
        setData(json);
      })
      .catch((e) => setError(String(e)));
  }, []);

  if (error) {
    return (
      <div style={{ padding: 24, color: TOKENS.ink, fontFamily: "'IBM Plex Sans', sans-serif" }}>
        <p style={{ color: "#B3453D" }}>Error cargando datos: {error}</p>
        <p style={{ color: TOKENS.inkDim, fontSize: 13 }}>
          Revisá que la variable de entorno AIRTABLE_API_KEY esté configurada en Vercel.
        </p>
      </div>
    );
  }

  if (!data) {
    return <div style={{ padding: 24, color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif" }}>Cargando...</div>;
  }

  if (!usuario) {
    return <LoginScreen onLogin={setUsuario} />;
  }

  if (!terminosAceptados) {
    return <TerminosGate pase={usuario.pase} onAceptar={() => {
      lsSet("reseteo_terminos_v1", "true");
      setTerminosAceptados(true);
    }} />;
  }

  if (!onboardingCompletado) {
    return <OnboardingFlow pase={usuario.pase} onCompletar={() => setOnboardingCompletado(true)} />;
  }

  const grupos = groupByCategoria(data.entradas);
  const grupoElegido = GRUPOS_OBJETIVO.find((g) => g.val === objetivoGrupo);
  const categoriasPrioritarias = grupoElegido
    ? grupoElegido.objetivos.filter((o) => grupos[o])
    : [];
  const categorias = [
    ...categoriasPrioritarias,
    ...Object.keys(grupos).filter((c) => !categoriasPrioritarias.includes(c)).sort(),
  ];

  const filteredCats = categorias
    .map((cat) => ({
      name: cat,
      entries: grupos[cat].filter((e) => e.combinacion.toLowerCase().includes(query.toLowerCase())),
    }))
    .filter((c) => query === "" || c.entries.length > 0);

  const enExplorador = view.screen === "categories";

  return (
    <div style={{ minHeight: "100vh", background: TOKENS.bg }}>
      <div style={{ position: "relative", background: enExplorador ? EXPLORADOR_TOKENS.bg : "transparent", overflow: "hidden" }}>
        {/* Textura de fondo (03/08/2026, corrección técnica #2): el primer intento envolvía
            HojasDecorativas en un div extra con su propio position:absolute — quedaba un
            absolute-dentro-de-absolute con altura "auto" en ambos niveles, que algunos
            navegadores no resuelven bien (la textura terminaba con altura 0 en la práctica,
            visible solo donde por casualidad coincidía con la altura de la Portada). Se saca
            el div intermedio: HojasDecorativas ahora se posiciona directo contra el wrapper
            con position:relative (mismo patrón que ya funcionaba dentro de PortadaBanner). */}
        {enExplorador && <HojasDecorativas zIndex={0} />}
        {enExplorador && (
          <PortadaBanner abierto={portadaLeerMas} onToggle={() => setPortadaLeerMas((v) => !v)} />
        )}
        <div style={{ position: "relative", zIndex: 1, maxWidth: 640, margin: "0 auto", padding: enExplorador ? "20px 20px 60px" : "28px 20px 60px" }}>
        <header style={{ marginBottom: 24, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
          <div>
            <p style={{
              fontFamily: enExplorador ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace",
              fontSize: 11, color: enExplorador ? EXPLORADOR_TOKENS.accent : TOKENS.primary,
              letterSpacing: "0.08em", marginBottom: 6, textTransform: "uppercase", fontWeight: enExplorador ? 600 : 400,
            }}>
              Comida real · Dato verificable · Sincronizado {new Date(data.actualizado).toLocaleString("es-AR")}
            </p>
            {view.screen === "categories" && grupoElegido ? (
              <React.Fragment>
                <h1 style={{ fontFamily: enExplorador ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 26, color: enExplorador ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.2, letterSpacing: "-0.02em", margin: 0 }}>
                  {grupoElegido.icon} Tu objetivo: {grupoElegido.label}
                </h1>
                <p style={{ fontFamily: enExplorador ? EXPLORADOR_TOKENS.font : "'IBM Plex Sans', sans-serif", fontSize: 13, color: enExplorador ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim, marginTop: 6, marginBottom: 0, lineHeight: 1.5 }}>
                  {grupoElegido.detalle} Empezamos por acá — el resto sigue disponible cuando quieras.
                </p>
              </React.Fragment>
            ) : (
              <h1 style={{ fontFamily: enExplorador ? EXPLORADOR_TOKENS.font : "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 28, color: enExplorador ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink, lineHeight: 1.15, letterSpacing: "-0.02em", margin: 0 }}>
                Explorador por problemática
              </h1>
            )}
          </div>
        </header>

        <nav style={{ display: "flex", gap: 20, marginBottom: 24, borderBottom: `1px solid ${enExplorador ? "rgba(255,255,255,0.15)" : TOKENS.border}` }}>
          <button onClick={() => setView({ screen: "categories" })}
            style={{
              background: "none", border: "none", cursor: "pointer", padding: "0 0 10px 0",
              fontFamily: enExplorador ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.04em", fontWeight: 600,
              color: (view.screen === "categories" || view.screen === "category" || view.screen === "entry" || view.screen === "log")
                ? (enExplorador ? EXPLORADOR_TOKENS.textPrimary : TOKENS.ink)
                : (enExplorador ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim),
              borderBottom: (view.screen === "categories" || view.screen === "category" || view.screen === "entry" || view.screen === "log")
                ? `2px solid ${enExplorador ? EXPLORADOR_TOKENS.accent : TOKENS.primary}` : "2px solid transparent",
              marginBottom: -1,
            }}>
            EXPLORADOR
          </button>
          <button onClick={() => setView({ screen: "patrones" })}
            style={{
              background: "none", border: "none", cursor: "pointer", padding: "0 0 10px 0",
              fontFamily: enExplorador ? EXPLORADOR_TOKENS.font : "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.04em", fontWeight: 600,
              color: view.screen === "patrones" ? TOKENS.ink : (enExplorador ? EXPLORADOR_TOKENS.textSecondary : TOKENS.inkDim),
              borderBottom: view.screen === "patrones" ? `2px solid ${TOKENS.primary}` : "2px solid transparent",
              marginBottom: -1,
            }}>
            MIS PATRONES
          </button>
        </nav>

        {view.screen === "bienestar" && (
          <BienestarScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase} />
        )}

        {view.screen === "patrones" && (
          <PatronesScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase} />
        )}

        {view.screen === "categories" && (
          <React.Fragment>
            <TableroAccesos
              onCargarComida={() => setView({ screen: "log" })}
              onRegistrarBienestar={() => setView({ screen: "bienestar" })}
              pase={usuario.pase}
            />
            <p style={{ fontFamily: EXPLORADOR_TOKENS.font, fontSize: 11, color: EXPLORADOR_TOKENS.textSecondary, letterSpacing: "0.06em", marginBottom: 10, textTransform: "uppercase", fontWeight: 600 }}>
              Explora y descubre
            </p>
            <ExploradorScreen
              data={data}
              query={query}
              setQuery={setQuery}
              filteredCats={filteredCats}
              onSelectCategory={(name) => setView({ screen: "category", name })}
              grupoElegido={grupoElegido}
            />
          </React.Fragment>
        )}

        {view.screen === "log" && (
          <LogMealScreen onBack={() => setView({ screen: "categories" })} pase={usuario.pase}
            tieneCondicionMedica={lsGet("reseteo_condicion_medica") === "true"} />
        )}

        {view.screen === "category" && (() => {
          const cat = grupos[view.name] || [];
          return (
            <div className="fade-in">
              <button onClick={() => setView({ screen: "categories" })} style={{ background: "none", border: "none", color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, marginBottom: 20, cursor: "pointer", padding: 0 }}>
                ← Categorías
              </button>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
                <CategoryIcon name={view.name} />
                <h2 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 700, fontSize: 22, color: TOKENS.ink, letterSpacing: "-0.01em", margin: 0 }}>{view.name}</h2>
              </div>
              <div style={{ display: "grid", gap: 10 }}>
                {cat.map((entry) => (
                  <button key={entry.id} onClick={() => setView({ screen: "entry", id: entry.id, catName: view.name })}
                    style={{ textAlign: "left", width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, background: TOKENS.surface, border: `1px solid ${TOKENS.border}`, borderRadius: 8, padding: 16, cursor: "pointer" }}>
                    <span style={{ color: TOKENS.ink, fontSize: 14 }}>{entry.combinacion}</span>
                    <EvidenceStamp level={entry.evidencia} />
                  </button>
                ))}
              </div>
            </div>
          );
        })()}

        {view.screen === "entry" && (() => {
          const cat = grupos[view.catName] || [];
          const entry = cat.find((e) => e.id === view.id);
          if (!entry) return null;
          const esPremium = usuario.nivelAcceso === "Premium";
          return (
            <div className="fade-in">
              <button onClick={() => setView({ screen: "category", name: view.catName })} style={{ background: "none", border: "none", color: TOKENS.inkDim, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, marginBottom: 24, cursor: "pointer", padding: 0 }}>
                ← Volver
              </button>
              <h2 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 800, fontSize: 25, color: TOKENS.ink, lineHeight: 1.2, marginBottom: 14, letterSpacing: "-0.01em" }}>{entry.combinacion}</h2>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
                <EvidenceStamp level={entry.evidencia} />
              </div>
              {esPremium ? (
                <React.Fragment>
                  <div style={{ borderTop: `1px solid ${TOKENS.border}`, paddingTop: 18 }}>
                    {entry.mecanismo && <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.inkDim, marginBottom: 10 }}>{entry.mecanismo}</p>}
                    <p style={{ color: TOKENS.inkDim, fontSize: 14, lineHeight: 1.65 }}>{entry.resultado}</p>
                  </div>
                  {entry.frecuencia && (
                    <div style={{ borderTop: `1px solid ${TOKENS.border}`, paddingTop: 18, marginTop: 18 }}>
                      <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.primary, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>Frecuencia</p>
                      <p style={{ color: TOKENS.ink, fontSize: 14 }}>{entry.frecuencia}</p>
                    </div>
                  )}
                </React.Fragment>
              ) : (
                <div style={{ borderTop: `1px solid ${TOKENS.border}`, paddingTop: 18 }}>
                  <div style={{ background: TOKENS.primarySoft, borderRadius: 8, padding: "12px 14px" }}>
                    <p style={{ color: TOKENS.ink, fontSize: 12.5, lineHeight: 1.6, margin: 0 }}>
                      💡 Esta herramienta sí tiene una forma concreta de aplicarse. Te mostramos el paso a paso en la sección Premium.
                    </p>
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        <footer style={{ marginTop: 40, paddingTop: 16, borderTop: `1px solid ${TOKENS.border}`, textAlign: "center" }}>
          <a href="privacidad.html" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.inkDim, textDecoration: "none" }}>
            Política de privacidad
          </a>
          <span style={{ margin: "0 8px", color: TOKENS.border }}>·</span>
          <button
            onClick={() => { lsRemove("reseteo_usuario"); lsRemove("reseteo_terminos_v1"); setUsuario(null); }}
            style={{ background: "none", border: "none", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.inkDim, cursor: "pointer", padding: 0 }}
          >
            Cerrar sesión ({usuario.email})
          </button>
        </footer>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
document.getElementById("diagnostico").style.display = "none";

</script>

<script>
(function () {
  try {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, { presets: ["react"] }).code;
    var run = new Function("React", "ReactDOM", output);
    run(React, ReactDOM);
  } catch (err) {
    var d = document.getElementById("diagnostico");
    d.style.display = "block";
    d.innerText = "ERROR REAL DETECTADO:\n" + ((err && (err.stack || err.message)) || err) +
      "\n\nMandale esta captura completa a Claude para resolverlo.";
  }
})();
</script>
</body>
