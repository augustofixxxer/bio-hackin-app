.supermarket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
.supermarket-chip{min-width:0;text-align:left;background:#111a17;color:#f2efe9;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;font-size:11px;font-weight:700;line-height:1.35}
.supermarket-chip.active{border-color:#c5a059;background:rgba(197,160,89,.12)}
.supermarket-detail{margin-top:12px;padding:14px;border-radius:16px;background:#111a17;border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.supermarket-detail>h3{font-size:17px;line-height:1.25;margin:0 0 12px}
.supermarket-detail .decision{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}
.supermarket-detail .decision>div{padding:12px;border-radius:12px}
.supermarket-detail .decision .warning{background:rgba(153,55,65,.14);border:1px solid rgba(219,105,115,.42)}
.supermarket-detail .decision .choice{background:rgba(68,139,99,.14);border:1px solid rgba(111,190,139,.4)}
.supermarket-detail .decision b{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.supermarket-detail .decision .warning b{color:#f19aa1}
.supermarket-detail .decision .choice b{color:#8fd3a5}
.supermarket-detail .decision span{display:block;font-size:12px;line-height:1.5;color:#f2efe9}
.supermarket-detail .decision small{display:block;margin-top:7px;font-size:11px;line-height:1.45;color:#b8c9bf}
@media(min-width:520px){.supermarket-detail .decision{grid-template-columns:1fr 1fr}}

function categoriasDeAlimento(nombre){
 const n=String(nombre||'').toLowerCase(), c=[];
 if(['pollo','chicken','pavo','turkey','cerdo','pork','vacuno','beef','carne','huevo','egg','atun','atún','tuna','merluza','hake','pescado','fish','lentej','lentil','poroto','bean','garbanzo','chickpea','ricota','ricotta','queso','cheese','yogur','yogurt'].some(x=>n.includes(x)))c.push('proteina');
 if(['avena','oat','arroz','rice','batata','sweet potato','papa','potato','pan','bread','galleta','rice cake','quinoa','fideo','pasta','raviol','cereal','maiz','maíz','lentej','lentil','poroto','bean','garbanzo','chickpea'].some(x=>n.includes(x)))c.push('carbohidrato');
 if(['banana','manzana','apple','naranja','orange','kiwi','palta','avocado','pera','pear','fruta','frutilla','uva','durazno'].some(x=>n.includes(x)))c.push('fruta');
 if(['aceite','oil','oliva','palta','avocado','almendra','almond','nuez','walnut','mani','maní','peanut','semilla','seed'].some(x=>n.includes(x)))c.push('grasa');
 return c;
}
function seleccionarCatalogo(catalogo,categoria,cantidad=1,excluir=[]){
 const preferencias={proteina:['pollo','chicken','huevo','egg','pavo','turkey','cerdo','pork','atun','tuna','merluza','hake','lentej','lentil','ricota','ricotta','yogur','yogurt'],carbohidrato:['avena','oat','arroz','rice','batata','sweet potato','quinoa','pan integral','whole-wheat','galleta','rice cake'],fruta:['banana','manzana','apple','naranja','orange','kiwi'],grasa:['aceite de oliva','olive oil','almendra','almond','nuez','walnut','mani','peanut','palta','avocado']};
 return (catalogo||[]).filter(a=>categoriasDeAlimento(a.nombre).includes(categoria)&&!excluir.includes(a.id)).sort((a,b)=>{
  const rank=x=>(preferencias[categoria]||[]).findIndex(k=>String(x.nombre).toLowerCase().includes(k));
  const ra=rank(a)<0?100:rank(a),rb=rank(b)<0?100:rank(b);
  return ra-rb||a.nombre.localeCompare(b.nombre);
 }).slice(0,cantidad).map(a=>({...a,nombre:nombreCatalogoUI(a.nombre),categoria}));
}
function opcionesJornadaDesdeCatalogo(catalogo,bloque){

 const usados=[],salida=[];
 for(const categoria of categorias){const item=seleccionarCatalogo(catalogo,categoria,1,usados)[0];if(!item)continue;usados.push(item.id);const p=usos[categoria];salida.push({id:item.id,nombre:item.nombre,rol:p[0],uso:p[1],categoria});}
 return salida;
}
function familiaFuenteProteica(nombre){
 const n=String(nombre||'').toLowerCase();
 if(['atun','atún','tuna','merluza','hake','pescado','fish'].some(x=>n.includes(x)))return 'pescado';
 if(['pollo','chicken','pavo','turkey'].some(x=>n.includes(x)))return 'ave';
 if(['huevo','egg'].some(x=>n.includes(x)))return 'huevo';
 if(['lentej','lentil','poroto','bean','garbanzo','chickpea'].some(x=>n.includes(x)))return 'legumbre';
 if(['yogur','yogurt','ricota','ricotta','queso','cheese','leche','milk'].some(x=>n.includes(x)))return 'lacteo';
 if(['cerdo','pork'].some(x=>n.includes(x)))return 'cerdo';
 if(['vacuno','beef','carne'].some(x=>n.includes(x)))return 'carne_roja';
 return 'otra';
}
function alternativaDesdeCatalogo(catalogo,bloque,principales,alternativasPrevias=[]){
 const comidas=Array.isArray(principales)?principales:[];
 const proteinaPrincipal=comidas.find(a=>categoriasDeAlimento(a.nombre).includes('proteina'));
 const carboPrincipal=comidas.find(a=>categoriasDeAlimento(a.nombre).includes('carbohidrato'));
 const familiaPrincipal=proteinaPrincipal?familiaFuenteProteica(proteinaPrincipal.nombre):'';
 const excluirIds=comidas.map(a=>a.id).filter(Boolean);
 const ordenProteina=bloque==='cena'?['huevo','pescado','legumbre','ave','lacteo','cerdo','carne']:bloque==='desayuno'?['huevo','lacteo','legumbre','pescado','ave','cerdo','carne']:['pescado','huevo','legumbre','ave','lacteo','cerdo','carne'];
 const ordenCarbo=bloque==='cena'?['batata','sweet potato','arroz integral','brown rice','quinoa','avena','oat']:bloque==='desayuno'?['avena','oat','pan integral','whole-wheat','batata','sweet potato','arroz integral','brown rice']:['arroz integral','brown rice','batata','sweet potato','quinoa','avena','oat'];
 const previas=new Set(alternativasPrevias);
 const proteinas=(catalogo||[]).filter(a=>categoriasDeAlimento(a.nombre).includes('proteina')&&!excluirIds.includes(a.id)&&!previas.has(a.id||a.nombre)&&(!familiaPrincipal||familiaFuenteProteica(a.nombre)!==familiaPrincipal));
 const carbohidratos=(catalogo||[]).filter(a=>categoriasDeAlimento(a.nombre).includes('carbohidrato')&&!excluirIds.includes(a.id)&&!previas.has(a.id||a.nombre));
 const rank=(item,orden)=>{const n=String(item.nombre||'').toLowerCase();const i=orden.findIndex(k=>n.includes(k));return i<0?100:i};
 proteinas.sort((a,b)=>rank(a,ordenProteina)-rank(b,ordenProteina)||a.nombre.localeCompare(b.nombre));
 carbohidratos.sort((a,b)=>rank(a,ordenCarbo)-rank(b,ordenCarbo)||a.nombre.localeCompare(b.nombre));
 let elegida=null;
 for(const p of proteinas){
  for(const c of carbohidratos){
   const clave=[p.id||p.nombre,c.id||c.nombre].join('|');
   if(!previas.has(clave)){elegida={p,c,clave};break;}
  }
  if(elegida)break;
 }
 if(!elegida)return '';
 alternativasPrevias.push(elegida.p.id||elegida.p.nombre,elegida.c.id||elegida.c.nombre);
 return 'En lugar de repetir la combinación actual, probá '+nombreCatalogoUI(elegida.p.nombre)+' con '+nombreCatalogoUI(elegida.c.nombre).toLowerCase()+'.';
}

 const esEntreno=tipo==='entreno';
 const horaNumero=Number(String(hora||'07:00').slice(0,2));
 const ahora=new Date();

   <div className="founder-plan"><button className="founder-plan-select" onClick={()=>{setPremiumPlanSeleccionado("mensual");setPremiumPagoMsg("");setPremiumModalAbierto(true)}}><span className="tag">Founder mensual</span><strong>$9.999</strong><small>por mes · Acceso completo a Pro</small><small>Bitácora de patrones y sugerencias regionales</small></button>{(premiumPlanesConfig.medios?.mercadoPagoMensualUrl||premiumPlanesConfig.medios?.mercadoPagoUrl)?<a className="founder-mp-link" href={premiumPlanesConfig.medios.mercadoPagoMensualUrl||premiumPlanesConfig.medios.mercadoPagoUrl} target="_blank" rel="noopener noreferrer">PAGAR CON MERCADO PAGO ↗</a>:<span className="founder-mp-unconfigured">Mercado Pago mensual: link pendiente de configurar</span>}</div>
   <div className="founder-plan anual"><button className="founder-plan-select" onClick={()=>{setPremiumPlanSeleccionado("anual");setPremiumPagoMsg("");setPremiumModalAbierto(true)}}><span className="tag">Founder anual · 2 meses de regalo</span><strong>$99.999</strong><small>por año · 12 meses por el precio de 10</small><small>Mejor valor para mantener continuidad</small></button>{premiumPlanesConfig.medios?.mercadoPagoAnualUrl?<a className="founder-mp-link" href={premiumPlanesConfig.medios.mercadoPagoAnualUrl} target="_blank" rel="noopener noreferrer">PAGAR CON MERCADO PAGO ↗</a>:<span className="founder-mp-unconfigured">Mercado Pago anual: link pendiente de configurar</span>}</div>

  {premiumPagoMsg&&<div className="saved" role="status">{premiumPagoMsg}</div>}

</section>
  {premiumContexto?<div className="premium-context"><b>Venís de Descubrir</b><span>{premiumContexto.original||premiumContexto.titulo||'La comida que acabás de explorar'}</span></div>:<div className="premium-context"><b>Premium empieza con una comida concreta.</b><span>Entrá desde una comida que acabás de explorar para recibir el hallazgo, la sugerencia y qué vamos a comparar.</span></div>}

  <div className="premium-feature">
    <div className="feature-kicker">1 · TU COMIDA Y EL HALLAZGO</div>
    <h3>{premiumContexto?.original||premiumContexto?.titulo||'Tu comida'}</h3>
    <p>{premiumContexto?.texto||'Esta tarjeta muestra el hallazgo que recibiste al explorar esta comida en Descubrir.'}</p>

  <div className="premium-feature">
    <div className="feature-kicker">2 · LA SUGERENCIA</div>

    {premiumContexto?.variable&&premiumContexto.variable!=='protocolo_culinario'&&<p className="premium-variable-note">Variable en foco: {etiquetaVariable(tipoVariableAdaptativa(premiumContexto))}.</p>}
    {premiumContexto?.protocoloCulinario&&!premiumContexto.protocoloCulinario.hackIntegrado&&<div className="premium-culinary-protocol">
      <div className="label">PROTOCOLO CULINARIO ADAPTATIVO</div>
      {premiumContexto.protocoloCulinario.coccion&&<><div className="label">COCCIÓN &amp; TÉCNICA</div><p>{premiumContexto.protocoloCulinario.coccion}</p></>}
      {premiumContexto.protocoloCulinario.condimentos&&<><div className="label">SINERGIA DE CONDIMENTOS</div><p>{premiumContexto.protocoloCulinario.condimentos}</p></>}

      {protocoloAlmidonEspecifico(premiumContexto)&&<><div className="label">TÉCNICA ESPECÍFICA PARA ESTE ALIMENTO</div><p>{premiumContexto.protocoloCulinario.almidonResistente}</p></>}
    </div>}
  </div>

  <div className="premium-feature">
    <div className="feature-kicker">3 · LA COMPARACIÓN</div>
    <h3>Antes y después, con una sola variable en foco.</h3>
    {premiumContexto ? <>
      <div className="adaptive-before-after" aria-label="Comparación visual entre comida de referencia y variante">
        <div><span>ANTES · REFERENCIA</span><b>{premiumContexto.original||premiumContexto.titulo||'Tu comida de origen'}</b></div>
        <div className="adaptive-arrow" aria-hidden="true">→</div>
        <div><span>DESPUÉS · VARIANTE</span><b>{premiumContexto.hackNombre||premiumContexto.accion||premiumContexto.adaptacion||'La alternativa propuesta'}</b></div>
      </div>
      <p className="comparison-unique">Variable en foco: <strong>{etiquetaVariable(tipoVariableAdaptativa(premiumContexto))}</strong>. Probá la variante con tu porción habitual y mantené el resto de la preparación lo más parecido posible.</p>
      <form className="adaptive-log-form" onSubmit={guardarBitacoraVariante}>
        <label htmlFor="premium-experience-note">¿Cómo te sentiste con esta variante?</label>
        <p className="adaptive-log-hint">Anotá una diferencia que hayas notado. No hace falta medirlo todo.</p>
        <textarea id="premium-experience-note" value={premiumRegistroTexto} onChange={e=>setPremiumRegistroTexto(e.target.value)} maxLength={500} placeholder="Ej.: me resultó más cómoda, noté más saciedad o no percibí diferencias…" rows={4} />
        <button type="submit" className="primary" disabled={premiumExpBusy||!premiumRegistroTexto.trim()}>{premiumExpBusy?'Guardando…':'Guardar en mi bitácora'}</button>{premiumExpMsg&&<p className={'adaptive-save-feedback '+(premiumExpMsg.startsWith('✓')?'success':'')} role="status" aria-live="polite">{premiumExpMsg.startsWith('✓')?'¡Guardado con éxito en tu bitácora!':premiumExpMsg}</p>}
      </form>
    </> : <><p>Entrá desde una comida de Descubrir para que esta tarjeta pueda mostrar la comparación correcta.</p><button className="secondary" onClick={volverDesdePremium}>← Volver a {premiumRetorno==='mi-dia'?'Mi Día':'Descubrir'}</button></>}
  </div>

  {premiumContexto&&<button className="secondary" onClick={()=>{setPremiumContexto(null);setPremiumOrigen('basica');setPremiumVista('home');setTab('descubrir');setResultadoAntesDeComer(null);setResultado(null);}}>↺ Borrar esta consulta y volver a Descubrir</button>}

  <details className="premium-how"><summary>¿Qué hace Premium con esto?</summary><p>Parte de la comida que exploraste, conserva el hallazgo Free, propone una modificación concreta y te muestra qué vamos a comparar. Después podés registrar tu experiencia.</p></details>
  {premiumEstadoMsg&&<div className="saved">{premiumEstadoMsg}</div>}
  {adminPagos!==null&&!premiumEstado?.premium&&premiumEstado?.origen===null&&<button className="primary" onClick={async()=>{setPremiumEstadoMsg('');setBusy(true);try{const r=await fetch('/api/premium?ruta=activar-fundador',{method:'POST',headers:{Authorization:'Bearer '+pase()}});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo activar el modo prueba.');const sr=await fetch('/api/premium?ruta=estado',{headers:{Authorization:'Bearer '+pase()}});const sd=await sr.json();if(!sr.ok)throw Error(sd.error||'No pudimos actualizar el estado Premium.');setPremiumEstado(sd)}catch(e){setPremiumEstadoMsg(e.message||'No pudimos activar el modo prueba.')}finally{setBusy(false)}}} disabled={busy}>✦ Activar modo prueba fundador</button>}
  
</div>}

{Array.isArray(adminPagos)&&<section className="founder-admin">
 <div className="feature-kicker">CONTROL FOUNDER</div><h3>Pagos pendientes ({adminPagos.length})</h3>
 {adminPagosMsg&&<div className="saved" role="status">{adminPagosMsg}</div>}
 {adminPagos.length===0?<p>No hay comprobantes pendientes de revisión.</p>:adminPagos.map(p=><article className="founder-admin-item" key={p.id}>
  <b>{p.usuarios?.nombre_alias||p.usuarios?.email||"Usuario"}</b>
  {p.usuarios?.email&&p.usuarios?.nombre_alias&&<p>{p.usuarios.email}</p>}
  <div className="founder-admin-meta"><span>{p.plan==="anual"?"Founder anual · 365 días":"Founder mensual · 30 días"}</span><span>${Number(p.monto||0).toLocaleString("es-AR")}</span></div>
  <button className="founder-admin-receipt" disabled={!p.comprobanteSignedUrl} onClick={()=>setAdminComprobanteAbierto(p)}>{p.comprobanteSignedUrl?"VER COMPROBANTE ↗":"SIN COMPROBANTE"}</button>
  <div className="founder-admin-actions"><button className="approve" disabled={Boolean(adminPagoBusy)||!p.comprobanteSignedUrl} onClick={()=>procesarPagoFounder(p.id,"aprobar")}>{adminPagoBusy===p.id+":aprobar"?"APROBANDO…":"✓ APROBAR Y ACTIVAR ACCESO"}</button><button className="reject" disabled={Boolean(adminPagoBusy)} onClick={()=>procesarPagoFounder(p.id,"rechazar")}>{adminPagoBusy===p.id+":rechazar"?"RECHAZANDO…":"RECHAZAR"}</button></div>
 </article>)}
</section>}
{adminPagos===null&&adminPagosError&&<section className="founder-admin" role="alert"><div className="feature-kicker">CONTROL FOUNDER</div><h3>No se pudo cargar la bandeja</h3><p>{adminPagosError}</p><p>La bandeja no se oculta en silencio: verificá la sesión administrativa y las variables ADMIN_USER_ID / ADMIN_USER_EMAIL del entorno Preview de Vercel.</p><button className="founder-admin-receipt" onClick={async()=>{setAdminPagosError("");try{const r=await fetch("/api/premium?ruta=admin",{headers:{Authorization:"Bearer "+pase()}});const d=await r.json();if(!r.ok)throw Error(d.error||`No se pudo cargar la bandeja (${r.status}).`);setAdminPagos(d.pendientes||[]);setAdminPagosError("")}catch(e){setAdminPagosError(e.message||"Error de red al cargar los pagos pendientes.")}}}>REINTENTAR</button></section>}
{adminComprobanteAbierto?.comprobanteSignedUrl&&<div className="founder-receipt-overlay" role="presentation" onClick={e=>{if(e.target===e.currentTarget)setAdminComprobanteAbierto(null)}}><section className="founder-receipt-modal" role="dialog" aria-modal="true" aria-label="Visor de comprobante"><header className="founder-receipt-modal-head"><div><b>{adminComprobanteAbierto.usuarios?.nombre_alias||adminComprobanteAbierto.usuarios?.email||"Comprobante del socio"}</b><span>{adminComprobanteAbierto.plan==="anual"?"Founder anual · 365 días":"Founder mensual · 30 días"} · ${Number(adminComprobanteAbierto.monto||0).toLocaleString("es-AR")}</span></div><button className="founder-receipt-close" onClick={()=>setAdminComprobanteAbierto(null)} aria-label="Cerrar visor">✕ CERRAR</button></header><div className="founder-receipt-content">{/\.(jpe?g|png|webp)(\?|$)/i.test(adminComprobanteAbierto.comprobante_url||"")?<img src={adminComprobanteAbierto.comprobanteSignedUrl} alt={"Comprobante de "+(adminComprobanteAbierto.usuarios?.nombre_alias||adminComprobanteAbierto.usuarios?.email||"socio")}/>:/\.pdf(\?|$)/i.test(adminComprobanteAbierto.comprobante_url||"")?<iframe src={adminComprobanteAbierto.comprobanteSignedUrl} title="Comprobante PDF"/>:<p>Formato no compatible con la vista previa.</p>}</div><a className="founder-receipt-open" href={adminComprobanteAbierto.comprobanteSignedUrl} target="_blank" rel="noopener noreferrer">Abrir archivo original en otra pestaña ↗</a><div className="founder-receipt-modal-actions"><button className="approve" disabled={Boolean(adminPagoBusy)} onClick={()=>procesarPagoFounder(adminComprobanteAbierto.id,"aprobar")}>{adminPagoBusy===adminComprobanteAbierto.id+":aprobar"?"APROBANDO…":"✓ APROBAR Y ACTIVAR ACCESO"}</button><button className="reject" disabled={Boolean(adminPagoBusy)} onClick={()=>procesarPagoFounder(adminComprobanteAbierto.id,"rechazar")}>{adminPagoBusy===adminComprobanteAbierto.id+":rechazar"?"RECHAZANDO…":"RECHAZAR"}</button></div></section></div>}
<div className="premium-legal">
  <b>{premiumEstado?.modoPruebaFundador?'Modo prueba fundador · experiencia experimental':'Reseteo Propio no es una dieta'}</b>
  <span>{premiumEstado?.modoPruebaFundador?'Modo prueba activo: es una activación experimental y no representa una compra. ':''}No es un contador de calorías, un recetario ni una app médica. Te da herramientas para explorar y comparar tu experiencia; las decisiones siguen siendo tuyas.</span>
</div>
<button className="secondary" onClick={volverDesdePremium}>← Volver a {premiumRetorno==='mi-dia'?'Mi Día':'Descubrir'}</button>
</section>}
 <footer><button className="secondary" onClick={cerrarSesion}>Cerrar sesión</button><div style={{marginTop:10}}><a href="/privacidad.html">Política de privacidad</a></div></footer></main><nav className="tabs"><div className="tabs-inner"><button className={'tab '+(tab==='descubrir'?'active':'')} onClick={()=>{setDiscoverView('home');setTab('descubrir')}}>DESCUBRIR<small>Explorar</small></button><button className={'tab '+(tab==='mi-dia'?'active':'')} onClick={()=>setTab('mi-dia')}>MI DÍA<small>Registrar</small></button><button className={'tab '+(tab==='premium'?'active':'')} onClick={()=>irPremium('basica')}>PREMIUM<small>Ir más allá</small></button></div></nav></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var boot=document.getElementById('boot');
  function status(t){if(boot)boot.textContent=t}
  function load(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src;s.crossOrigin='anonymous';
      s.onload=resolve;s.onerror=function(){reject(new Error('No se pudo cargar '+src))};
      document.head.appendChild(s);
    });
  }
  async function start(){
    var etapa='dependencias';
    try{
      status('Cargando dependencias…');
      if(!window.React){
        try{await load('https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js')}
        catch(e){try{await load('https://unpkg.com/react@18.3.1/umd/react.production.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js')}}
      }
      if(!window.ReactDOM){
        try{await load('https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js')}
        catch(e){try{await load('https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js')}}
      }
      if(!window.Babel){
        try{await load('https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js')}
        catch(e){try{await load('https://unpkg.com/@babel/standalone@7.24.7/babel.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js')}}
      }
      if(!window.React||!window.ReactDOM||!window.Babel)throw new Error('React, ReactDOM o Babel no quedaron disponibles después de intentar los CDNs alternativos.');
      etapa='compilación JSX';
      status('Preparando la interfaz…');
      var sourceNode=document.getElementById('app-source');
      if(!sourceNode||!sourceNode.textContent.trim())throw new Error('No se encontró el código de la aplicación (#app-source).');
      var compiled=Babel.transform(sourceNode.textContent,{presets:['react']}).code;
      etapa='inicialización de Mi Día';
      status('Abriendo tu espacio…');
      new Function(compiled)();
    }catch(e){
      console.error('[Reseteo Propio] Fallo en '+etapa+':',e);
      if(boot){
        var titulo=etapa==='dependencias'?'No pudimos cargar las dependencias.':etapa==='compilación JSX'?'No pudimos compilar la interfaz.':'La interfaz falló al iniciar.';
        var detalle=String(e&&e.message||e||'Error desconocido').slice(0,260);
        boot.setAttribute('role','alert');
        boot.innerHTML='<b style="font-size:18px;color:#f2efe9">'+titulo+'</b><span style="max-width:440px;margin-top:8px;color:#cbd4ce">El error ocurrió durante '+etapa+'.</span><code style="max-width:520px;margin-top:10px;padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#e4c878;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">'+detalle.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})+'</code><button type="button" onclick="window.location.reload()" style="margin-top:10px;padding:12px 16px;border:0;border-radius:10px;background:#c5a059;color:#2a1d08;font-weight:800;cursor:pointer">Reintentar</button>';
      }
    }
  }
  start();
})();
</script></script></body></html>
