.supermarket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
.supermarket-chip{min-width:0;text-align:left;background:#111a17;color:#f2efe9;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;font-size:11px;font-weight:700;line-height:1.35}
.supermarket-chip.active{border-color:#c5a059;background:rgba(197,160,89,.12)}
.supermarket-detail{margin-top:12px;padding:14px;border-radius:16px;background:#111a17;border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.supermarket-detail>h3{font-size:17px;line-height:1.25;margin:0 0 12px}
.supermarket-detail .decision{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}
.supermarket-detail .decision>div{padding:12px;border-radius:12px}
.supermarket-detail .decision .warning{background:rgba(153,55,65,.14);border:1px solid rgba(219,105,115,.42)}
.supermarket-detail .decision .choice{background:rgba(68,139,99,.14);border:1px solid rgba(111,190,139,.4)}
.supermarket-detail .decision b{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.supermarket-detail .decision .warning b{color:#f19aa1}
.supermarket-detail .decision .choice b{color:#8fd3a5}
.supermarket-detail .decision span{display:block;font-size:12px;line-height:1.5;color:#f2efe9}
.supermarket-detail .decision small{display:block;margin-top:7px;font-size:11px;line-height:1.45;color:#b8c9bf}
@media(min-width:520px){.supermarket-detail .decision{grid-template-columns:1fr 1fr}}

/* Día de Entreno / Descanso — Fase 1 */

.plan-dia-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px}
.plan-dia-option{min-height:48px;padding:10px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#111a17;color:#f2efe9;font-weight:700;font-size:12px;cursor:pointer}
.plan-dia-option.selected{border-color:#c5a059;background:rgba(197,160,89,.14);box-shadow:inset 0 0 0 1px rgba(197,160,89,.35)}
.plan-dia-hora{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;padding:10px;border-radius:12px;background:#111a17;color:#d8ded9;font-size:12px}
.plan-dia-hora input{min-width:110px;background:#17211e;color:#f2efe9;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px}
.plan-dia-timeline{display:grid;gap:8px;margin-top:12px}
.plan-dia-step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:start;gap:9px;padding:12px;border-radius:12px;background:#111a17;border:1px solid rgba(255,255,255,.08)}
.plan-dia-step-icon{font-size:20px}
.plan-dia-step b{font-size:13px}
.plan-dia-step p{margin:4px 0 0;color:#aab5af;font-size:11px;line-height:1.5}
.plan-dia-tag{align-self:start;padding:4px 6px;border-radius:7px;background:rgba(143,168,155,.1);color:#aab5af;font-size:9px;white-space:nowrap}
.plan-dia-note{margin-top:12px!important;font-size:10px!important}
.plan-dia-contexto{margin-top:10px}.plan-dia-contexto .plan-dia-hora{margin:0}.plan-dia-contexto select{max-width:58%;background:#17211e;color:#f2efe9;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px}.plan-dia-foods{margin-top:9px;padding:9px;border-radius:9px;background:rgba(197,160,89,.06);border:1px solid rgba(197,160,89,.16)}.plan-dia-foods>b{display:block;color:#d9b96b;font-size:10px;margin-bottom:5px}.plan-dia-step .plan-dia-foods p{margin:5px 0;color:#d9dedb}.plan-dia-step .plan-dia-foods strong{color:#f2efe9}
@media(max-width:360px){.plan-dia-step{grid-template-columns:28px minmax(0,1fr)}.plan-dia-tag{grid-column:2}}

function nombreCatalogoUI(nombre){

 const reglas=[['egg','Huevo'],['huevo','Huevo'],['lentil','Lentejas hervidas'],['lenteja','Lentejas hervidas'],['brown rice','Arroz integral cocido'],['chicken','Pollo magro'],['tuna','Atún al natural'],['hake','Merluza'],['pork','Cerdo magro'],['ricotta','Ricota'],['yogurt','Yogur natural'],['turkey','Pavo magro'],['oats','Avena arrollada'],['sweet potato','Batata hervida'],['whole-wheat','Pan integral'],['rice cakes','Galletas de arroz'],['quinoa','Quinoa cocida'],['avocado','Palta'],['olive oil','Aceite de oliva'],['banana','Banana'],['apple','Manzana'],['orange','Naranja'],['kiwi','Kiwi'],['almond','Almendras'],['walnut','Nueces'],['peanut','Maní'],['lettuce','Lechuga'],['beans','Porotos hervidos'],['beef','Carne vacuna'],['cheese','Queso'],['fish','Pescado']];

function categoriasDeAlimento(nombre){
 const n=String(nombre||'').toLowerCase(), c=[];
 if(['pollo','chicken','pavo','turkey','cerdo','pork','vacuno','beef','carne','huevo','egg','atun','atún','tuna','merluza','hake','pescado','fish','lentej','lentil','poroto','bean','garbanzo','chickpea','ricota','ricotta','queso','cheese','yogur','yogurt'].some(x=>n.includes(x)))c.push('proteina');
 if(['avena','oat','arroz','rice','batata','sweet potato','papa','potato','pan','bread','galleta','rice cake','quinoa','fideo','pasta','raviol','cereal','maiz','maíz','lentej','lentil','poroto','bean','garbanzo','chickpea'].some(x=>n.includes(x)))c.push('carbohidrato');
 if(['banana','manzana','apple','naranja','orange','kiwi','palta','avocado','pera','pear','fruta','frutilla','uva','durazno'].some(x=>n.includes(x)))c.push('fruta');
 if(['aceite','oil','oliva','palta','avocado','almendra','almond','nuez','walnut','mani','maní','peanut','semilla','seed'].some(x=>n.includes(x)))c.push('grasa');
 return c;
}
function seleccionarCatalogo(catalogo,categoria,cantidad=1,excluir=[]){
 const preferencias={proteina:['pollo','chicken','huevo','egg','pavo','turkey','cerdo','pork','atun','tuna','merluza','hake','lentej','lentil','ricota','ricotta','yogur','yogurt'],carbohidrato:['avena','oat','arroz','rice','batata','sweet potato','quinoa','pan integral','whole-wheat','galleta','rice cake'],fruta:['banana','manzana','apple','naranja','orange','kiwi'],grasa:['aceite de oliva','olive oil','almendra','almond','nuez','walnut','mani','peanut','palta','avocado']};
 return (catalogo||[]).filter(a=>categoriasDeAlimento(a.nombre).includes(categoria)&&!excluir.includes(a.id)).sort((a,b)=>{
  const rank=x=>(preferencias[categoria]||[]).findIndex(k=>String(x.nombre).toLowerCase().includes(k));
  const ra=rank(a)<0?100:rank(a),rb=rank(b)<0?100:rank(b);
  return ra-rb||a.nombre.localeCompare(b.nombre);
 }).slice(0,cantidad).map(a=>({...a,nombre:nombreCatalogoUI(a.nombre),categoria}));
}
function opcionesJornadaDesdeCatalogo(catalogo,bloque){
 const categorias=bloque==='pre'?['carbohidrato','fruta','proteina']:bloque==='cena'?['proteina','carbohidrato','grasa']:['proteina','carbohidrato','fruta'];
 const usos={proteina:['proteína','como base proteica de la comida'],carbohidrato:['carbohidrato/fibra','para acompañar la proteína'],fruta:['fruta','como fruta entera o colación'],grasa:['grasa','en pequeña cantidad para complementar la comida']};
 const usados=[],salida=[];
 for(const categoria of categorias){const item=seleccionarCatalogo(catalogo,categoria,1,usados)[0];if(!item)continue;usados.push(item.id);const p=usos[categoria];salida.push({id:item.id,nombre:item.nombre,rol:p[0],uso:p[1],categoria});}
 return salida;
}
function familiaFuenteProteica(nombre){
 const n=String(nombre||'').toLowerCase();
 if(['atun','atún','tuna','merluza','hake','pescado','fish'].some(x=>n.includes(x)))return 'pescado';
 if(['pollo','chicken','pavo','turkey'].some(x=>n.includes(x)))return 'ave';
 if(['huevo','egg'].some(x=>n.includes(x)))return 'huevo';
 if(['lentej','lentil','poroto','bean','garbanzo','chickpea'].some(x=>n.includes(x)))return 'legumbre';
 if(['yogur','yogurt','ricota','ricotta','queso','cheese','leche','milk'].some(x=>n.includes(x)))return 'lacteo';
 if(['cerdo','pork'].some(x=>n.includes(x)))return 'cerdo';
 if(['vacuno','beef','carne'].some(x=>n.includes(x)))return 'carne_roja';
 return 'otra';
}
function alternativaDesdeCatalogo(catalogo,bloque,principales,alternativasPrevias=[]){
 const comidas=Array.isArray(principales)?principales:[];
 const proteinaPrincipal=comidas.find(a=>categoriasDeAlimento(a.nombre).includes('proteina'));
 const carboPrincipal=comidas.find(a=>categoriasDeAlimento(a.nombre).includes('carbohidrato'));

      {premiumContexto.protocoloCulinario.coccion&&<><div className="label">COCCIÓN &amp; TÉCNICA</div><p>{premiumContexto.protocoloCulinario.coccion}</p></>}
      {premiumContexto.protocoloCulinario.condimentos&&<><div className="label">SINERGIA DE CONDIMENTOS</div><p>{premiumContexto.protocoloCulinario.condimentos}</p></>}
      {premiumContexto.protocoloCulinario.timingOrden&&<><div className="label">TIMING &amp; ORDEN DE INGESTA</div><p>{premiumContexto.protocoloCulinario.timingOrden}</p></>}
      {premiumContexto.protocoloCulinario.almidonResistente&&<><div className="label">ALMIDÓN RESISTENTE</div><p>{premiumContexto.protocoloCulinario.almidonResistente}</p></>}
    </div>}
  </div>

  <div className="premium-feature">
    <div className="feature-kicker">3 · LA COMPARACIÓN</div>
    <h3>Qué cambia cuando probás la sugerencia.</h3>
    {premiumContexto ? <>
      {premiumContexto.cambioComposicional&&<><div className="label">QUÉ CAMBIA</div><p>{premiumContexto.cambioComposicional}</p></>}
      {premiumContexto.porQueCambio&&<><div className="label">POR QUÉ ESTE CAMBIO</div><p>{premiumContexto.porQueCambio}</p></>}
      {premiumContexto.queSeMantiene&&<><div className="label">QUÉ SE MANTIENE</div><p>{premiumContexto.queSeMantiene}</p></>}
      {premiumContexto.aprendizajeComparativo&&<><div className="label">QUÉ PODÉS APRENDER</div><p>{premiumContexto.aprendizajeComparativo}</p></>}
      {!premiumContexto.cambioComposicional&&!premiumContexto.aprendizajeComparativo&&!premiumContexto.queSeMantiene&&<div className="saved">Este caso todavía no tiene comparación Premium curada.</div>}
      <button className="primary" onClick={crearExperimento} disabled={premiumExpBusy||premiumAbiertas.length>0}>{premiumAbiertas.length>0?'✓ Comparación en curso':'✦ Empezar esta comparación'}</button>
      <div className="bridge" style={{marginTop:10}}>
        <b>La comida sigue siendo tu punto de partida.</b>
        <p style={{margin:'6px 0 0'}}>Premium no reemplaza tu experiencia: define qué cambiar, qué mantener y qué mirar para que una ocasión pueda compararse con otra.</p>
      </div>
    </> : <><p>Entrá desde una comida de Descubrir para que esta tarjeta pueda mostrar la comparación correcta.</p><button className="secondary" onClick={()=>setTab('descubrir')}>← Volver a Descubrir</button></>}
  </div>

  {premiumContexto&&<button className="secondary" onClick={()=>{setPremiumContexto(null);setPremiumOrigen('basica');setPremiumVista('home');setTab('descubrir');setResultadoAntesDeComer(null);setResultado(null);}}>↺ Borrar esta consulta y volver a Descubrir</button>}

  <details className="premium-how"><summary>¿Qué hace Premium con esto?</summary><p>Parte de la comida que exploraste, conserva el hallazgo Free, propone una modificación concreta y te muestra qué vamos a comparar. Después podés registrar tu experiencia.</p></details>
  {premiumExpMsg&&<div className="saved">{premiumExpMsg}</div>}
  {premiumEstadoMsg&&<div className="saved">{premiumEstadoMsg}</div>}
  {!premiumEstado?.premium&&premiumEstado?.origen===null&&<button className="primary" onClick={async()=>{setPremiumEstadoMsg('');setBusy(true);try{const r=await fetch('/api/premium?ruta=activar-fundador',{method:'POST',headers:{Authorization:'Bearer '+pase()}});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo activar el modo prueba.');const sr=await fetch('/api/premium?ruta=estado',{headers:{Authorization:'Bearer '+pase()}});const sd=await sr.json();if(!sr.ok)throw Error(sd.error||'No pudimos actualizar el estado Premium.');setPremiumEstado(sd)}catch(e){setPremiumEstadoMsg(e.message||'No pudimos activar el modo prueba.')}finally{setBusy(false)}}} disabled={busy}>✦ Activar modo prueba fundador</button>}
  {premiumEstado?.modoPruebaFundador&&<p className="legal-note">Modo prueba fundador activo. Es una activación experimental y no representa una compra.</p>}
  {premiumExperimentos.length>0&&<div className="premium-feature"><div className="feature-kicker">TU EXPERIMENTO</div>{premiumExperimentos.slice(0,1).map(exp=><div key={exp.id}><h3>{exp.titulo}</h3><p><b>A:</b> {exp.opcion_a}</p><p><b>B:</b> {exp.opcion_b}</p>{exp.registro_a?<p><b>Lo que notaste en A:</b> {exp.registro_a}</p>:<button className="secondary" onClick={()=>registrarExperimento(exp.id,'a')} disabled={premiumExpBusy}>Registrar A</button>}{exp.registro_b?<p><b>Lo que notaste en B:</b> {exp.registro_b}</p>:<button className="secondary" onClick={()=>registrarExperimento(exp.id,'b')} disabled={premiumExpBusy}>Registrar B</button>}{exp.registro_a&&exp.registro_b&&exp.estado==='abierto'&&<button className="primary" onClick={()=>cerrarExperimento(exp.id)} disabled={premiumExpBusy}>Cerrar y guardar aprendizaje</button>}{exp.estado==='cerrado'&&<div className="saved">✓ Comparación cerrada. El aprendizaje quedó guardado en tu historial Premium.</div>}</div>)}</div>}
</div>}

<div className="premium-legal">
  <b>Reseteo Propio no es una dieta.</b>
  <span>No es un contador de calorías, un recetario ni una app médica. Te da herramientas para explorar y comparar tu experiencia; las decisiones siguen siendo tuyas.</span>
</div>
{premiumEstado?.premium&&<div className="premium-founder-state">{premiumEstado.modoPruebaFundador&&'Modo prueba fundador activo · activación experimental, no representa una compra.'}</div>}
<button className="secondary" onClick={()=>setTab('descubrir')}>← Seguir explorando</button>
</section>}
 <footer><button className="secondary" onClick={cerrarSesion}>Cerrar sesión</button><div style={{marginTop:10}}><a href="/privacidad.html">Política de privacidad</a></div></footer></main><nav className="tabs"><div className="tabs-inner"><button className={'tab '+(tab==='descubrir'?'active':'')} onClick={()=>setTab('descubrir')}>DESCUBRIR<small>Explorar</small></button><button className={'tab '+(tab==='mi-dia'?'active':'')} onClick={()=>setTab('mi-dia')}>MI DÍA<small>Registrar</small></button><button className={'tab '+(tab==='premium'?'active':'')} onClick={()=>irPremium('basica')}>PREMIUM<small>Ir más allá</small></button></div></nav></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var boot=document.getElementById('boot');
  function status(t){if(boot)boot.textContent=t}
  function load(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src;s.crossOrigin='anonymous';
      s.onload=resolve;s.onerror=function(){reject(new Error('No se pudo cargar '+src))};
      document.head.appendChild(s);
    });
  }
  async function start(){
    try{
      status('Cargando…');
      if(!window.React){
        try{await load('https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js')}
        catch(e){try{await load('https://unpkg.com/react@18.3.1/umd/react.production.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js')}}
      }
      if(!window.ReactDOM){
        try{await load('https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js')}
        catch(e){try{await load('https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js')}}
      }
      if(!window.Babel){
        try{await load('https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js')}
        catch(e){try{await load('https://unpkg.com/@babel/standalone@7.24.7/babel.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js')}}
      }
      if(!window.React||!window.ReactDOM||!window.Babel)throw new Error('Dependencias de interfaz incompletas');
      status('Iniciando…');
      var source=document.getElementById('app-source').textContent;
      var compiled=Babel.transform(source,{presets:['react']}).code;
      new Function(compiled)();
    }catch(e){
      console.error(e);
      if(boot)boot.innerHTML='<b>No pudimos cargar Reseteo Propio.</b><br><span style="display:block;margin-top:8px">Recargá esta página. Si el problema continúa, el navegador está bloqueando una dependencia necesaria para iniciar la app.</span>';
    }
  }
  start();
})();
</script></script></body></html>
