const {useState,useEffect}=React;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

function pase(){try{return JSON.parse(lsGet('reseteo_usuario')||'null')?.pase||''}catch(e){return ''}}
const INTENTOS={energia:['energia','cansancio','cansado','cansada','sin energia','agotado','agotada'],descanso_sueno:['sueno','dormir','descanso','descansar','insomnio'],digestion:['digestion','pesadez','hinchazon','hinchado','hinchada'],entrenamiento:['entrenamiento','entrenar','ejercicio','actividad fisica','actividad'],foco_concentracion:['foco','concentracion','concentración','atencion','atención'],hambre_saciedad:['hambre','saciedad','antojo','antojos'],recuperacion:['recuperacion','recuperación','recuperar','despues de entrenar','después de entrenar']};
const PILLS=[['⚡','Te quedás sin energía','cansancio','energia'],['🌙','Dormís mal','sueño','descanso_sueno'],['🌿','Pesadez después de comer','pesadez','digestion'],['🫧','Te sentís hinchado','hinchazón','hinchazon'],['🎯','Te cuesta el foco','foco','foco_concentracion'],['🍽️','Llegás con hambre','hambre','hambre_saciedad'],['🏋️','Antes de entrenar','entrenamiento','entrenamiento'],['🔄','Recuperación','recuperación','recuperacion']];
function escalaValor(valor){return ({baja:'1',media:'3',alta:'5',mal:'1',regular:'3',bien:'5'})[valor]||''}
function suenoValor(valor){const h=Number(valor);if(!h)return '';if(h<6)return 'menos_6h';if(h<7)return '6_7h';if(h<=9)return '7_9h';return 'mas_9h'}

<section className="precomer" style={{marginTop:12}}><div className="eyebrow">ANTES DE COMER</div><h3>¿Estás por comer algo y querés saber qué observar?</h3><p>Escribí la comida que estás pensando comer. Te damos una observación simple, basada en lo que conocemos de esa combinación, para que sepas qué mirar en tu experiencia.</p><div className="search precomer-search"><input value={textoAntesDeComer} onChange={e=>{setTextoAntesDeComer(e.target.value);setMsgAntesDeComer('');setResultadoAntesDeComer(null);setResultado(null)}} placeholder="Ej: milanesa con papas fritas"/><button onClick={()=>{setResultado(null);registrarComida('descubrir',true)}} disabled={busy}>{busy?'...':'Ver qué observar'}</button></div>{msgAntesDeComer&&<div className="saved">{msgAntesDeComer}</div>}{renderAntesDeComer()}{resultadoAntesDeComer&&<button className="secondary" style={{marginTop:8}} onClick={()=>{setResultadoAntesDeComer(null);setMsgAntesDeComer('');setTextoAntesDeComer('')}}>Borrar devolución</button>}</section><section className="pillbox" style={{marginTop:12}}><h3 style={{margin:'0 0 5px',fontSize:14}}>Elegí algo para explorar</h3><p style={{margin:0,color:'#aab5af',fontSize:12}}>Entrá por una situación concreta y descubrí qué podés observar y probar.</p><div className="pills">{PILLS.map(([icon,label,q,intent])=><div className="pill-slot" key={label}><button className="pill" onClick={()=>{setResultadoAntesDeComer(null);setMsgAntesDeComer('');irPill(label,q,intent)}}>{icon} {label}</button>{resultado?.tipo==='pildora'&&resultado.intent===intent&&renderResultado(resultado)}</div>)}</div></section>{msg&&<div className="saved">{msg}</div>}{resultado?.tipo!=='pildora'&&renderResultado()}{resultado&&<button className="secondary" style={{marginTop:8}} onClick={()=>{setResultado(null);setMsg('');setTexto('')}}>Borrar devolución</button>}</>}
 {tab==='mi-dia'&&<><section className="hero"><div className="eyebrow">MI DÍA</div><h1>Hacé visible lo que pasa en tu día.</h1><p>Anotá lo que comiste y cómo te sentiste. Con el tiempo, esas anotaciones te ayudan a comparar experiencias.</p></section><section className="event"><h3>¿Qué comiste?</h3><p>Escribilo como lo recordarías al contárselo a alguien.</p><select value={momentoMiDia} onChange={e=>{setMomentoMiDia(e.target.value);setMsgMiDia('');setResultadoMiDia(null)}}><option value="">Momento del día</option><option value="Desayuno">Desayuno</option><option value="Almuerzo">Almuerzo</option><option value="Merienda">Merienda</option><option value="Cena">Cena</option></select><textarea value={textoMiDia} onChange={e=>{setTextoMiDia(e.target.value);setMsgMiDia('');setResultadoMiDia(null)}} placeholder="Ej: arroz con pollo" style={{marginTop:8}}></textarea><button className="primary" onClick={()=>registrarComida('mi-dia')} disabled={busy}>{busy?'Procesando...':'Quiero entender esta comida'}</button>{msgMiDia&&<div className="saved">{msgMiDia}</div>}{renderResultado(resultadoMiDia)}</section><section className="event"><h3>¿Cómo te sentiste?</h3><p>Guardá una o varias señales de hoy para poder compararlas más adelante.</p><div className="row"><select value={energy} onChange={e=>setEnergy(e.target.value)}><option value="">Energía</option><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option></select><select value={dig} onChange={e=>setDig(e.target.value)}><option value="">Digestión</option><option value="mal">Mal</option><option value="regular">Regular</option><option value="bien">Bien</option></select></div><div className="row"><select value={sleep} onChange={e=>setSleep(e.target.value)}><option value="">Sueño</option><option value="4">4 h</option><option value="5">5 h</option><option value="6">6 h</option><option value="7">7 h</option><option value="8">8 h</option><option value="9">9 h</option><option value="10">10 h</option></select><select value={water} onChange={e=>setWater(e.target.value)}><option value="">Hidratación</option><option value="0.5">0,5 L</option><option value="1">1 L</option><option value="1.5">1,5 L</option><option value="2">2 L</option><option value="2.5">2,5 L</option><option value="3">3 L</option><option value="4">4 L</option></select></div><select value={activity} onChange={e=>setActivity(e.target.value)} style={{marginTop:8}}><option value="">Actividad física</option><option value="0">0 min</option><option value="20">20 min</option><option value="40">40 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">120 min</option></select><button className="primary" onClick={registrarBienestar} disabled={busy}>{busy?'Guardando...':'Guardar lo de hoy'}</button>{msg&&<div className="saved">{msg}</div>}</section></>}

  {premiumExpMsg&&<div className="saved">{premiumExpMsg}</div>}

<script>
(function(){
  var boot=document.getElementById('boot');
  function status(t){if(boot)boot.textContent=t}
  function load(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src;s.crossOrigin='anonymous';
      s.onload=resolve;s.onerror=function(){reject(new Error('No se pudo cargar '+src))};
      document.head.appendChild(s);
    });
  }
  async function start(){
    try{
      status('Cargando…');
      if(!window.React){
        try{await load('https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js')}
        catch(e){try{await load('https://unpkg.com/react@18.3.1/umd/react.production.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js')}}
      }
      if(!window.ReactDOM){
        try{await load('https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js')}
        catch(e){try{await load('https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js')}}
      }
      if(!window.Babel){
        try{await load('https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js')}
        catch(e){try{await load('https://unpkg.com/@babel/standalone@7.24.7/babel.min.js')}catch(e2){await load('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js')}}
      }
      if(!window.React||!window.ReactDOM||!window.Babel)throw new Error('Dependencias de interfaz incompletas');
      status('Iniciando…');
      var source=document.getElementById('app-source').textContent;
      var compiled=Babel.transform(source,{presets:['react']}).code;
      new Function(compiled)();
    }catch(e){
      console.error(e);
      if(boot)boot.innerHTML='<b>No pudimos cargar Reseteo Propio.</b><br><span style="display:block;margin-top:8px">Recargá esta página. Si el problema continúa, el navegador está bloqueando una dependencia necesaria para iniciar la app.</span>';
    }
  }
  start();
})();
</script></script></body></html>
